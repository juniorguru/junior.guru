name: Claude Review
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]
jobs:
  review:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !github.event.pull_request.draft
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      REACTIONS_URL: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/reactions
    steps:
      - id: eyes
        continue-on-error: true
        run: echo "id=$(gh api "$REACTIONS_URL" -f content=eyes --jq .id)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # The plugin posts a "No issues found" comment when the PR passes, which is
      # noisy, so it's disallowed and the outcome is reported by reactions instead:
      # 👍 passed, inline comments for issues found, 🚀 skipped (reason in the check's annotations)
      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # The plugin launches subagents and Claude may run them in the background,
          # then end the run while they're still working, without reviewing anything
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            If you stop without reviewing the PR, end your final message with a single line
            starting with "Review skipped:" followed by the reason.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash(gh pr comment:*)"
      - if: always()
        continue-on-error: true
        env:
          EYES_ID: ${{ steps.eyes.outputs.id }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ -n "$EYES_ID" ]; then gh api -X DELETE "$REACTIONS_URL/$EYES_ID"; fi
          if [ "$CLAUDE_OUTCOME" != success ] || [ ! -f "$EXECUTION_FILE" ]; then exit 0; fi

          result=$(jq -r 'last(.[] | select(.type == "result")).result // ""' "$EXECUTION_FILE")
          comments=$(jq '[.[] | select(.type == "assistant") | .message.content[]?
            | select(.type == "tool_use" and .name == "mcp__github_inline_comment__create_inline_comment")] | length' "$EXECUTION_FILE")
          printf '%s\n' "$result" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$result" == *"No issues found"* ]]; then
            gh api "$REACTIONS_URL" -f content=+1 --silent
          elif [ "$comments" -eq 0 ]; then
            gh api "$REACTIONS_URL" -f content=rocket --silent
            reason=$(grep -m1 -o 'Review skipped:.*' <<< "$result" || tr '\n' ' ' <<< "$result")
            echo "::notice title=Claude review skipped::$reason"
          fi

  # The plugin above skips PRs Claude already commented on, so re-reviews
  # are requested by commenting "@claude review" or "@claude re-review" on the PR
  re-review:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && (contains(github.event.comment.body, '@claude review') || contains(github.event.comment.body, '@claude re-review'))
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Re-review this pull request. Claude reviewed it before and the author has since pushed changes.
            The PR head is already checked out in the current working directory.

            1. Read the PR's existing comments and review comments (`gh pr view ${{ github.event.issue.number }} --comments`,
               `gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/comments`)
               to find the issues raised in previous reviews.
            2. Read the current diff (`gh pr diff ${{ github.event.issue.number }}`) and check whether each previously raised issue is fixed.
            3. Look for new bugs or CLAUDE.md violations introduced by the changes. Only report issues you are
               confident are real; skip nits and anything a linter would catch.
            4. Post each new issue with `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`).
            5. Post one `gh pr comment ${{ github.event.issue.number }}` summarizing which earlier issues are fixed, which remain, and how many new ones you found.

            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}/comments)"
