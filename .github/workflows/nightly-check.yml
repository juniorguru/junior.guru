name: Nightly Check
on:
  schedule:
    # CircleCI nightly starts at 04:00 UTC and usually finishes by 05:10 UTC,
    # this leaves a buffer of almost two hours
    - cron: "53 6 * * *"
  workflow_dispatch:
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: nightly
        run: python3 .github/scripts/nightly_status.py
      - if: steps.nightly.outputs.investigate == 'true'
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 30
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            NIGHTLY: ${{ steps.nightly.outputs.url }}
            FAILED JOBS: ${{ steps.nightly.outputs.failed }}
            DATE: ${{ steps.nightly.outputs.date }}

            Today's CircleCI nightly build failed. Use the circleci skill to investigate why,
            including the comparison with recent nightly runs.

            If every failure is an expected one as described in the skill, stop and file nothing.

            Otherwise file exactly one issue:

            gh issue create --title "Nightly build failure ${{ steps.nightly.outputs.date }}" --body "..."

            The body must be brief and to the point, in English, Markdown, with these sections:
            - **Failed job(s)** with links to the CircleCI job(s)
            - **Error**: the concrete error from the logs, quoted
            - **Verdict**: intermittent or regression, with the evidence from recent runs in one or two sentences
            - **Suggested fixes**: a short list
            Do not open a PR and do not change any files.
          claude_args: |
            --allowedTools "Skill,Read,Glob,Grep,Bash(curl:*),Bash(jq:*),Bash(gh issue create:*),Bash(gh issue list:*)"
