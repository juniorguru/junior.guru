query fetch($cursor: String!, $createdFrom: UnixTimestamp!) {
  orders(first: 100, after: $cursor, createdAt: { gte: $createdFrom }) {
    pageInfo {
      endCursor
      hasNextPage
    }
    edges {
      node {
        createdAt
        status
        totalCents
        purchasable {
          ... on Plan {
            name
            intervalUnit
          }
        }
      }
    }
  }
}
