query fetch($cursor: String!) {
  members(first: 100, after: $cursor) {
    pageInfo {
      endCursor
      hasNextPage
    }
    edges {
      node {
        id
        email
        fullName
        totalSpendCents
        trackingParams
        subscriptions {
          active
        }
        orders {
          createdAt
        }
      }
    }
  }
}
