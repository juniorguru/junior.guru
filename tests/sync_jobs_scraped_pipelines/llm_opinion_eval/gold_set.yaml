- name: st-059
  inputs:
    id: st-059
    title: Partnership Manager
    text: 'BigHub Jsme technologická firma zaměřená na datovou analytiku a AI. Vyvíjíme
      datové aplikace pro korporace i startupy po celém světě. Zaměřujeme se na pokročilou
      analýzu dat, strojové učení, cloud, umělou inteligenci a vývoj aplikací. Vše
      na nejnovějších technologiích na trhu. Dodáváme datově orientovaná řešení, od
      zdrojových dat až k uživatelské aplikaci. A také pracujeme na svých vlastních
      produktech. Spojuje nás drive, touha učit se novým věcem a samozřejmě láska
      k datům.💜 Na trhu jsme od roku 2016, dnes je nás již více než 80 a stále rosteme.
      Koho hledáme? Do našeho týmu hledáme Partnership Managera, který bude zodpovědný
      za rozvoj a řízení strategických partnerství s klíčovými technologickými společnostmi
      a za rozvoj obchodních příležitostí prostřednictvím partnerského kanálu. Naším
      cílem je aktivně rozvíjet vztahy s technologickými partnery, identifikovat nové
      obchodní příležitosti, propojovat naše kompetence s jejich ekosystémem a společně
      generovat nové projekty a revenue. V této roli budeš zodpovědný/á především
      za strategické i každodenní řízení partnerství se společnostmi Microsoft, Google,
      AWS (Amazon) a Databricks. Nejde tedy pouze o relationship management. Jedná
      se o výrazně obchodní roli, jejímž hlavním cílem je rozvoj businessu prostřednictvím
      partnerského kanálu. Co budeš dělat: Rozvíjet, řídit a dlouhodobě budovat strategická
      partnerství s technologickými partnery Microsoft, Google, AWS a Databricks.
      Identifikovat nové potenciální technologické a strategické partnery relevantní
      pro naše business zaměření. Aktivně vyhledávat, oslovovat a rozvíjet vztahy
      s relevantními kontakty v partnerském ekosystému. Budovat a udržovat dlouhodobé
      vztahy s klíčovými partnery a jejich obchodními, technickými a partnerskými
      týmy. Identifikovat nové obchodní příležitosti vznikající prostřednictvím partnerského
      kanálu. Propojovat potřeby a obchodní příležitosti partnerů s našimi technologickými
      kompetencemi a službami. Spolupracovat s interním obchodním týmem, delivery
      týmy, technology leady a managementem na rozvoji společných obchodních příležitostí.
      Aktivně rozvíjet co-selling a joint go-to-market aktivity s technologickými
      partnery. Koordinovat společné obchodní aktivity, eventy, kampaně, workshopy
      a další aktivity podporující generování leadů a nového businessu. Sledovat a
      využívat partnerské programy, kompetence, certifikace, funding a další možnosti
      spolupráce. Monitorovat vývoj partnerského ekosystému, nové technologie a obchodní
      příležitosti relevantní pro naše zaměření. Vést přehled o partnerských vztazích,
      rozpracovaných příležitostech a výsledcích jednotlivých partnerství. Pravidelně
      vyhodnocovat výkonnost jednotlivých partnerství a navrhovat kroky pro jejich
      další rozvoj. Jak poznáme úspěch: Hlavními KPI této role budou především: počet
      a kvalita obchodních příležitostí generovaných prostřednictvím partnerského
      kanálu, revenue generované prostřednictvím technologických partnerství, rozvoj
      a aktivita partnerského ekosystému, počet a kvalita nových relevantních partnerních
      vztahů, úspěšnost společných go-to-market a co-selling aktivit, rozvoj strategických
      partnerství s Microsoftem, Googlem, AWS a Databricks. Co od tebe očekáváme:
      Zkušenost z oblasti business developmentu, partner managementu, channel sales
      nebo obdobné obchodní role. Prokazatelnou zkušenost s budováním a rozvojem obchodních
      vztahů. Schopnost aktivně vyhledávat nové příležitosti a otevírat nové vztahy.
      Obchodní mindset a orientaci na konkrétní výsledky. Schopnost budovat dlouhodobé
      vztahy na různých úrovních partnerských organizací. Zkušenost s B2B obchodem
      v technologickém nebo IT prostředí. Dobrou orientaci v technologickém ekosystému
      a cloudových technologiích. Schopnost rozumět obchodnímu potenciálu technologických
      řešení a propojovat ho s potřebami zákazníků. Výborné komunikační a vyjednávací
      schopnosti. Samostatnost, proaktivitu a schopnost dotahovat příležitosti od
      prvního kontaktu až k obchodnímu výsledku. Schopnost spolupracovat napříč obchodními,
      technickými a delivery týmy. Velmi dobrou znalost angličtiny, protože budeš
      pravidelně komunikovat s mezinárodními partnery. Co je pro nás výhodou: Zkušenost
      s partnerskými programy Microsoftu, Googlu, AWS nebo Databricks. Existující
      síť kontaktů v technologickém a partnerském ekosystému. Zkušenost s channel
      sales, co-sellingem nebo joint go-to-market aktivitami. Zkušenost s prodejem
      IT konzultačních služeb, cloudových řešení, datových nebo AI technologií. Technický
      přehled v oblastech cloudu, data & analytics, AI nebo moderního enterprise IT.
      Co nabízíme na oplátku: Klíčovou obchodní roli s přímým dopadem na růst společnosti.
      Možnost budovat a rozvíjet strategická partnerství s nejvýznamnějšími technologickými
      hráči. Velkou míru samostatnosti a odpovědnosti za partnerský kanál. Spolupráci
      s expertními technologickými týmy v oblasti cloudu, dat a AI. Možnost ovlivňovat
      strategii rozvoje partnerského ekosystému i obchodního směřování společnosti.
      Práci na zajímavých technologických projektech pro významné klienty. Flexibilní
      prostředí, přátelský tým a podporu osobního rozvoje. Hybridní pracovní mód,
      kanceláře v Praze na Václavském náměstí. Občerstvení v kanceláři a skvělé kafe,
      Multisport kartu, firemní fyzioterapie a další benefity. Pravidelné týmové akce
      a aktivity i mimo práci. Jestli chceš pracovat na technologicky zajímavých výzvách,
      pošli nám své CV nebo svůj LinkedIn profil a pojďme si o tom společně popovídat!'
