- name: st-149
  inputs:
    id: st-149
    title: Product Manager do Pixelfield
    text: Sháníme novou posilu v podobě Product Managera do našeho týmu vývojářů,
      designérů a strátégů do Pixelfieldu. Co by tě u nás čekalo? Shromažďování požadavků
      pro produkty a nápady našich klientů. Budeš spolupracovat s ostatními zainteresovanými
      stranami, s ohledem na zpětnou vazbu uživatelů, s týmy pro design a vývoj a
      především by jsi měl být kreativní. Výzkum produktových nápadů a témat, seznámení
      se s různými problémy a možnými řešeními a zdokumentování získaných poznatků.
      Psaní uživatelských příběhů nebo jiných specifikací, podle kterých budou designéři
      a vývojáři vytvářet produkty. Udržování produktového plánu, prověřování a vyjasňování
      úkolů v backlogu, sledování a schvalování verzí. Začlenění ostatních týmů do
      projektů, účast na plánování, průzkumech a retrospektivách. Ověřování produktových
      nápadů a prototypů s novými uživateli. Sjednocování a správa očekávání interních
      a externích týmů. Co od tebe budeme potřebovat? Máš zkušenosti z obdobné role
      v agentuře nebo startupu. Profesionální zkušenost s prací v technickém prostředí
      s vývojovými týmy a/nebo background v oblasti informatiky nebo softwarového
      inženýrství. Silné komunikační dovednosti v českém i anglickém jazyce, jak písemně,
      tak ústně, a schopnost převádět výzvy zákazníků do technických specifikací.
      Zvědavost, pokora a vášeň pro výbornou práci. Předchozí zkušenost s řízením
      produktového plánu. Zkušenost s propojováním designérů a vývojářů. Jsi samostatný
      a dokážeš pracovat i v případě, že zadání zní "vyřeš to". Co ti nabídneme? zajímavou
      práci na projektech pro menší i velké klienty (našimi klienty jsou start-upy,
      ale také společnosti jako Veolia, ČPP, RaiffeisenBank, Česká televize aj.);
      odpovídající finanční ohodnocení; možnost hybridní formy spolupráce; možnost
      práce na zajímavých projektech, které tě posunou dopředu; flexibilitu v rámci
      práce; možnost dalšího růstu v rámci společnosti; kanceláře na Karlíně; přátelský
      a podporující kolektiv; společné akce (společné večeře, teambuildingy, chození
      na drinky); firemní koučink. Pokud tě nabídka zaujala, neváhej se nám ozvat
      společně s tvým CV! Než se ti ozveme zpět, můžeš si poslechnout jeden z našich
      podcastů nebo se podívat na naše webovky. Těšíme se na tebe
