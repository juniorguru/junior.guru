- name: st-111
  inputs:
    id: st-111
    title: UX / Design Engineer – medior / senior
    text: 'Ahoj, tady Digital. Hledáme šikovné designery, kteří chtějí být u toho,
      jak se design posouvá od kreslení ke stavění. Kdo jsme? Digital Solutions je
      agilní software house z Pardubic s víc než 20 lety zkušeností. Vyvíjíme aplikace
      a informační systémy šité na míru skutečným potřebám klientů — dlouhodobě pracujeme
      pro M&M Reality, BARTH, Cinestar, Technistone. A jsme tvůrci DigiSignu , české
      platformy pro elektronické podepisování dokumentů, kterou dnes používají velké
      firmy napříč republikou. Ke každému projektu přistupujeme s maximální péčí,
      protože nástroje, které vytváříme, nejsou jen software. Jsou to systémy, které
      každý den udržují firmy v chodu a pomáhají jim růst. Na čem budeš pracovat?
      Vyber si! Máme dva týmy a je na tobě, který ti bude bližší. Liší se tím, pro
      koho ho děláš a v jakém rytmu. Napiš nám, kam tě to táhne, nebo to probereme
      u kafe. Blue tým — klientské projekty Blue tým u nás vede projekty pro firmy
      jako BARTH, Technistone, Longi, Vlastníci, Luxure Care, Cinestar, VAS, HOKR
      a další. Pracoval bys paralelně na 2–3 projektech v tandemu s product ownerem,
      se kterým společně sbíráte požadavky od klientů. Tvoje místo na sezení by nebylo
      v UX týmu — měl bys stůl přímo s vývojovým týmem a PO v jedné kanceláři, aby
      komunikace byla osobní a napřímo. Do UX týmu samozřejmě patříš, tam se potkáváme,
      sdílíme, jezdíme spolu na konference — ale denní provoz máš u svého týmu. Vyber
      si Blue, pokud tě baví střídat témata, mluvit s klientem napřímo a vidět věci
      rychle hotové. DigiSign — náš vlastní produkt Česká platforma pro elektronické
      podepisování, kterou používají velké firmy. Dnes je to hodně byznys-driven produkt
      a tvým úkolem by bylo přinést do něj UX hlas: rozjet discovery a research témat
      kolem elektronického podpisu, zadat a vyhodnotit analytiku, zformulovat zadání
      a obhájit ho před produktem i byznysem. Zhruba třetina práce by pak byla stavba
      prototypů v kódu — doplňuješ kapacitu, kterou vývojový tým potřebuje na dodávání
      nových funkcionalit. Parťákem by ti byl Míra, který na DigiSignu dělá design
      engineera a hlídá implementaci. Vyber si DigiSign, pokud chceš jít do hloubky
      jednoho produktu, opírat rozhodnutí o data a mít slovo v tom, kam se vyvíjí.
      Jak u nás designujeme? Designujeme v kódu — Claude Code, Codex, Cursor, práce
      s gitem. Figmu potkáš už jen při údržbě starších projektů nebo když si chceš
      rychle vyzkoušet nějaký styl. Naše procesy kolem toho máme vymyšlené a rádi
      tě je naučíme, s nástroji ale předpokládáme, že už umíš. Koho hledáme? Máš za
      sebou vlastní výzkumné aktivity — ne "byl jsem u toho", ale "vedl jsem to".
      Rozumíš datům. Víš, co má smysl měřit, umíš to zadat a hlavně z toho udělat
      závěr. Umíš si sám sebrat zadání a doptat se na to, co chybí. Jsi komunikativní
      a nebojíš se prosadit názor mezi lidmi, kteří mají jiný. Design zvládneš dotáhnout.
      Ve Figmě se pohybuješ minimálně na středně pokročilé úrovni (komponenty, auto-layouty,
      struktura). Práce v kódu tě láká , i kdyby to pro tebe byla zatím neprozkoumaná
      oblast. Co tě u nás čeká Zázemí v UX týmu: parta, kde si pomáháme a hrajeme
      fair play. Nejsme jen kolegové z Digitalu, ale tým lidí, které baví trávit spolu
      čas i lidsky. Rádi se potkáváme osobně — práce na dálku je občas fajn, ale hledáme
      někoho, s kým se budeme v kanceláři vídat aktivně. Pokud je ti navíc blízký
      svět fantasy a baví tě deskové hry, jsou to u nás plusové body! :-) Podpora
      a mentoring: od začátku ti bude k dispozici náš Head of UX i Design Ops kolegyně.
      Postupy a procesy máme ukotvené v UX kodexu, který je otevřený celému týmu,
      takže se ve všem rychle zorientuješ. Moderní stack: naše budoucnost je v code-base
      designu. Používáme Claude Code, Codex, Cursor, NotebookLM, Plaud, Figma Make
      a další. Know-how si sdílíme a navzájem se inspirujeme v rámci našich UX Questů.
      Růst a inspirace: pravidelně vyrážíme na konference jako Webexpo nebo mDevCamp,
      loni jsme čerpali inspiraci na UX Nordic v Kodani. Svoboda a společné zážitky:
      jsme transparentní firma bez korporátního bullshitu. Rádi spolu vyrazíme i mimo
      kancl — loni jsme si užili hory na Dolní Moravě, předloni řeckou Lefkádu. Co
      nabízíme Mzda: 70 000 – 120 000 Kč měsíčně. Pokud jsi borec, umíme to ocenit
      i vyššími částkami. Forma spolupráce: full-time,IČO. Kde: Pardubice, režim 3+2
      (kancelář / homeoffice). Nástup: dohodou, ideálně co nejdřív. Vybavení a zázemí:
      polohovatelné stoly, kvalitní hardware, vlastní fitko v kanclu, PS5/Xbox a dog-friendly
      prostředí. Zaujalo tě to? Pojďme to probrat u kafe! Pošli nám své portfolio
      a něco o sobě — a napiš, která z těch dvou rolí tě láká víc. Na našem setkání
      rádi uvidíme tvoji současnou workflow: od zadání přes návrh až po předání vývojářům.
      Budeme moc rádi i za ukázku toho, jak do procesu zapojuješ AI nástroje, ať máme
      o čem společně pokecat. Těšíme se!'
