- name: st-068
  inputs:
    id: st-068
    title: IT Support Specialist L2
    text: 'Technická podpora skladového a e-commerce systému Do našeho týmu hledáme
      zkušenějšího kolegu nebo kolegyni, který/á převezme odpovědnost za L2 technickou
      podporu našich e-commerce a skladových systémů . Role je vhodná pro člověka,
      který kombinuje technické uvažování, systematičnost a schopnost profesionálně
      komunikovat s klientem. Nejde pouze o zpracování uživatelských požadavků. Důležitou
      součástí práce je analýza incidentů, hledání jejich příčin, spolupráce s vývojovým
      týmem a dlouhodobé zlepšování fungování supportu. O společnosti Elasticr Vyvíjíme
      e-commerce řešení pro střední a větší společnosti. Na rozdíl od standardizovaných
      SaaS platforem se zaměřujeme na řešení přizpůsobená konkrétním procesům a potřebám
      našich klientů. Součástí naší platformy je také Elasticr WMS , systém pro řízení
      skladových procesů. Naše řešení využívají mimo jiné sklady s nábytkem, módou
      nebo elektronikou a prostřednictvím systémů Elasticr jsou zpracovávány stovky
      tisíc objednávek a miliony kusů zboží. S dalším rozvojem platformy posilujeme
      také oblast technické podpory. Náplň role Jako IT Support Specialist L2 budete
      přebírat technické požadavky a incidenty, analyzovat je a koordinovat jejich
      vyřešení. Vaší odpovědností bude zejména: analyzovat nahlášené incidenty, reprodukovat
      chyby a identifikovat jejich možnou příčinu, řešit požadavky, které lze uzavřít
      na úrovni L2 supportu, připravovat kvalitní technická zadání pro vývojový tým,
      dokumentovat kroky k reprodukci a očekávané chování systému, spolupracovat s
      projektovými manažery a vývojáři, sledovat reakční doby, nastavené procesy a
      KPI, evidovat a vyhodnocovat požadavky klientů. Důležitou součástí role bude
      také práce s opakujícími se incidenty. Očekáváme, že budete schopni identifikovat
      jejich společné příčiny a společně s produktovým manažerem, projektovými manažery
      a vývojovým týmem hledat možnosti, jak je eliminovat přímo v produktu nebo procesu.
      Podle aktuální kapacity se budete moci zapojit také do budování znalostní báze.
      První linii podpory pomáhají zajišťovat L1 kolegové. Jakého člověka hledáme
      Výhodou je předchozí zkušenost s technickým supportem v prostředí: softwarové
      společnosti, IT agentury, ERP systémů, e-commerce, případně přímo na L2 úrovni.
      Očekáváme základní orientaci v životním cyklu vývoje softwaru a porozumění tomu,
