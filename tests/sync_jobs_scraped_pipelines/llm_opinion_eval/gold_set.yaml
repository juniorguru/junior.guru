- name: st-003
  inputs:
    id: st-003
    title: 🤖 AI Integrations Engineer
    text: We're looking for an AI Integrations Engineer to join our team in Brno .
      Someone who is excited about AI, automation, and figuring out how new technology
      can actually make people's work better. This is a hands-on, multi-disciplinary
      role . You won't just be building AI agents - you'll also help deploy and maintain
      them, test and evaluate how well they work, and work with teams across ROUVY
      to turn AI ideas into useful tools and workflows. You'll build and evolve AI
      agents and tools for both ROUVY employees and our customers , while helping
      shape how we use AI across the company. We don't expect you to know everything.
      AI is changing ridiculously fast, so curiosity and the ability to learn matter
      more than knowing every framework or tool already . What does matter is being
      able to separate useful technology from hype and build things that actually
      work. Our AI stack At ROUVY, we like to experiment with the latest AI technologies.
      For LLMs and other AI models, we use what makes the most sense for the job,
      including Claude, Gemini, and GPT . Our AI agents are currently built mainly
      with Google's ADK , while we're also exploring other approaches. We give our
      developers plenty of freedom when it comes to AI coding tools and workflows,
      including Claude Code, GitHub Copilot, Cursor , and others. We're working extensively
      with the GCP and Cloudflare AI ecosystems , and we're building the tooling and
      infrastructure around our agents as we go. What you'll be doing Building, maintaining,
      evaluating, and deploying AI agents for internal and external use. Designing
      and developing MCP servers, tools, integrations, and evaluation workflows. Working
      with GCP and Cloudflare to build and run AI-powered applications. Improving
      our existing AI agents and experimenting with new approaches. Helping teams
      across ROUVY adopt AI in practical ways - from tools like Lovable, AI Studio,
      and n8n to custom productivity solutions. Working with people across ROUVY to
      identify workflows where AI can genuinely help. Keeping up with the rapidly
      evolving AI ecosystem through experimentation, research, and tech events. What
      we need Strong Python skills Solid software engineering fundamentals Hands-on
      experience with an AI agent SDK or framework such as ADK, LangChain, or similar
      Familiarity with at least one cloud platform (GCP, AWS, Azure, etc.) Some experience
      with testing and evaluating AI-powered products Curiosity and the ability to
      quickly learn and apply new technologies A pragmatic mindset - you're excited
      about AI, but you also know that not every AI demo needs to become a production
      system Nice to have Experience with Google ADK and the broader GCP AI ecosystem
      Experience with Cloudflare , especially Workers, Workers AI, or AI Gateway Experience
      building agentic software Some MLOps experience Working knowledge of Go and
      JavaScript/TypeScript Background in classical machine learning AI FOMO resilience
      - you can tell an exciting demo from something that's actually useful A passion
      for cycling or sports in general Why ROUVY You'll have plenty of room to explore
      new technologies, influence our AI stack, and work on projects that can have
      a real impact across the company and our product.
  metadata:
    site: startupjobs
    url: https://www.startupjobs.cz/nabidka/107883/ai-integrations-engineer
    gold_reason: AI Integrations Engineer requires 'Strong Python skills, Solid software
      engineering fundamentals' with no junior/mentoring signal, real agent-building
      work but pitched at an already-solid engineer.
  expected_output: false
  evaluators: []
- name: st-008
  inputs:
    id: st-008
    title: Growth manager pro NICEBOY 💛
    text: 'GROWTH MANAGER pro NICEBOY 💛 Ahoj! 👋 Do našeho marketingového týmu v čele
      s marketingovou ředitelkou Kristýnou a senior branďákem Martinem, hledáme parťáka
      na pozici GROWTH MANAGER ! Pokud jsou tvým rajónem Google Analytics, Shopify
      data jsou tvůj největší kámoš, ROAS, PNO a CPA jsou zkratky, který ti říkají
      pane, a řekl/a bys o sobě, že jsi mastermind v tom, jak posunout firmu z hlediska
      online performance, zákaznické zkušenosti a všemožných konverzí, tak si na správné
      adrese! Co tě u nás bude čekat? TL; DR: Revenue, forecasty a P&L: Zodpovídáš
      za měsíční revenue e-shopu - targety nejen plníš, ale hlavně překonáváš Připravuješ
      a aktualizuješ revenue forecasty, pracuješ s P&L e-shopu a rozumíš tomu, co
      ovlivňuje marži Koordinuješ úkoly napříč týmem i externisty – k ruce máš juniora
      performance specialistu Matěje (kterého zároveň mentoruješ) a externí IT specialisty
      LONGer version: Performance marketing Řídíš performance agenturu – zadání, prioritizace,
      vyhodnocování výkonu, rozvoj kanálů Spolu s Martinem nastavuješ strategii kampaní
      podle kampaňového kalendáře napříč Meta, Google, YouTube, TikTok a PPC Pracuješ
      s budgety, testuješ a doporučuješ škálování Růst e-shopu na Shopify: Spravuješ
      a optimalizuješ e-shop – homepage, produktové karty, bannery, UX flow, nové
      extensions Staráš se nejen o český e-shop, ale i o další trhy a jejich expanzi
      Spolupracuješ s grafiky, designéry a vývojáři na zlepšeních – e-shop je pro
      tebe obchod, ne jen web Analytika a testování: Analyzuješ chování uživatelů
      pomocí GA4, Looker, Power BI, Hotjar/Clarity Navrhuješ a vedeš A/B testy napříč
      funnelem (bannery, checkout, produktové stránky) Rozumíš SEO i GEO a pracuješ
      s brandovými výzkumy a feedbackem, aby to sedělo na klíčová KPI Sleduješ trendy,
      novinky na Shopify a AI nástroje a rovnou je zkoušíš v praxi Iniciuješ krátké
      růstové sprinty s velkým dopadem A koho vlastně hledáme? Musíš mít minimálně
      3 roky prokazatelných zkušeností v e-commerce a performance marketingu → umíš
      postavit funkční kampaň i funnel Pokročilý Excel je must have (kontingenční
      tabulky, vzorce, modely) → reporty a forecasty budeš dělat denně Zvládneš řídit
      agenturu i externí dodavatele → baví tě vést a mentorovat lidi kolem sebe. Obecně
      rád/a pracuješ v týmu → domluvíš se s lidmi ať jsou to obchodníci, branďáci,
      skladníci nebo vývojáři. Máš znalost Shopify a e-mailingového nástroje (typu
      Ecomail), výhodou je pak znalost ERP Pohoda Proč Niceboy? Tvoje práce bude vidět
      – budeš se podílet se na rychle rostoucím, nově budovaném e-shopu a můžeš si
      na něm udělat jméno. Tvoje nápady budou slyšet, v našem marketingu budeš mít
      hlas. Na košile si nepotrpíme. Jsme otevření, přátelští, chceme slyšet tvoje
      nápady, všichni si tykáme a v kanclu máme srandu. Necháme tě věci rozhodovat,
      zkoušet a budovat, především, pokud je dokážeš opřít o čísla. Na co se u nás
      můžeš těšit? Na tým kolegů, kteří spolu rádi pracují, táhnou za jeden provaz
      a mají chuť se podílet na dalším růstu Niceboye. Pravidelné týmové akce jako
      jsou snídaně, grilovačky, sportovní aktivity, teambuildingy a další. Zaměstnaneckou
      slevu na veškeré výrobky od Niceboye. 5 týdnů dovolené a další 2 sickdays. Multisport
      kartu. Homeoffice dle domluvy, ale počítej s tím, že chodíme pravidelně do kanclu.'
  metadata:
    site: startupjobs
    url: https://www.startupjobs.cz/nabidka/107877/growth-manager-pro-niceboy
