- name: st-046
  inputs:
    id: st-046
    title: Head of Data
    text: 'V Directu bereme data jako jeden z hlavních nástrojů řízení firmy – od
      každodenních rozhodnutí až po strategii. Teď hledáme Head of Data, který to
      posune ještě dál. Budeš klíčovým partnerem pro business a zároveň povedeš datové
      týmy napříč analytikou, engineeringem a data science. Zároveň budeš součástí
      Direct skupiny. Čeká tě úzká spolupráce se skupinovým CDO a dalšími datovými
      lídry – sdílení know-how, společné standardy i hledání synergií napříč firmami.
      Tvůj cíl je jasný: dostat z dat maximum. Proměnit je v lepší customer experience,
      chytřejší řízení produktů a celkově lepší fungování firmy. Co tě u nás čeká?
      Definuješ a zrealizuješ datovou strategii pro Direct pojišťovnu a sladíš ji
      se směřováním celé skupiny. Pomůžeš firmě dělat lepší rozhodnutí na základě
      dat a hledat příležitosti pro růst (revenue, profitabilita, CX). Budeš přinášet
      insighty pro vedení a posouvat firmu k data-driven fungování. Nastavíš a budeš
      řídit data governance (kvalita, vlastnictví, katalog, compliance) a zajistíš,
      že jsou data spolehlivá a bezpečná. Povedeš rozvoj moderní datové platformy
      (Databricks) a rozhodneš o architektuře a toolingu. Zajistíš, že datový stack
      je škálovatelný, efektivní a dává smysl i v kontextu skupiny. Rozvineš advanced
      analytics a AI use cases (pricing, fraud, churn, personalizace) a dostaneš je
      do každodenního fungování businessu. Povedeš a budeš rozvíjet datové týmy (analytics,
      engineering, data science) a nastavíš fungující operating model. Propojíš business,
      IT a analytiku – budeš překládat potřeby do konkrétních řešení. Budeš klíčovým
      partnerem pro CEO, CFO, CRO, CMO i skupinové vedení (zejména CDO). Jak si tě
      představujeme? Máš 8–12+ let zkušeností v datech, z toho několik let v leadership
      roli. Máš zkušenost s tvorbou a exekucí data strategie. Umíš se pohybovat v
      prostředí, kde se potkává více firem, a sladit společný směr. Máš silný business
      mindset (ideálně finance, insurance, telco nebo e-commerce). Rozumíš datové
      architektuře (Databricks, dbt, DWH, Airflow, lake, pipelines). Máš zkušenost
      s BI nástroji (Power BI, Metabase apod.). Ovládáš SQL a orientuješ se v cloudu
      (Azure, AWS nebo GCP). Máš zkušenost s vedením multidisciplinárního týmu. Výhodou
      bude, pokud: Máš zkušenost z pojišťovnictví nebo bankovnictví, Znáš prostředí
      matrix / skupinového řízení, Máš zkušenost s pricingem, riskem nebo claims analytikou,
      Máš za sebou AI/ML use cases v produkci. Na co se můžeš těšit? Reálný dopad
      na fungování celé pojišťovny i skupiny. Možnost ovlivnit datovou strategii,
      technologie i způsob práce s daty. Prostor stavět věci od základu a posouvat
      je dál. Spolupráci napříč Direct skupinou a sdílení know-how. Prostředí, kde
      se věci řeší napřímo a dobré nápady se realizují.'
  metadata:
    site: startupjobs
    url: https://www.startupjobs.cz/nabidka/107327/head-of-data
