- name: st-053
  inputs:
    id: st-053
    title: AI Content Producer pro Filipa Dřímalku
    text: Hledáme člověka, který z Filipových podcastů, videí, přednášek a poznámek
      vytáhne nejlepší myšlenky a dotáhne je do top obsahu na sociální sítě. Potřebuješ
      skvěle pracovat s češtinou, mít cit pro obsah a poznat, kdy je text nebo vizuál
      opravdu dobrý. Střih ani grafické programy ovládat nemusíš. S našimi AI postupy
      tě naučíme pracovat. Jak tahle práce vypadá Filip natočí podcast. Ty projdeš
      přepis, vybereš nejsilnější pasáže a rozhodneš, co z nich má vzniknout. Může
      to být short, YouTube video, post, newsletter, článek nebo carousel. U shortu
      najdeš v původním videu přirozený začátek, konec a hlavní pointu. Pohlídáš,
      aby pasáž fungovala samostatně a nezkreslovala původní sdělení. Pomocí AI připravíš
      střih, titulky, název a popis. Výsledek porovnáš se zdrojem, opravíš detaily
      a předáš ho připravený ke schválení. Stejným způsobem budeš pracovat s přednáškami,
      knihami, zpětnou vazbou od účastníků a dalšími materiály. Co převezmeš Obsah
      kolem Filipova podcastu a YouTube - výběr témat a pasáží, shorts, názvy, popisy,
      kapitoly a publikační podklady. Posty, newslettery, články, carousely, reference
      a obsah pro kampaně. Texty a zadání pro grafiku. Složitější výstupy doladíš
      s grafikem. Přehled o rozpracovaném obsahu a dotažení každého výstupu do verze
      připravené ke schválení. Postupně také doporučení, co by měl Filip natočit,
      jaké téma rozpracovat nebo jaký formát vyzkoušet. Co od tebe potřebujeme Výbornou
      češtinu a schopnost text zkrátit nebo přestavět bez ztráty významu. Redakční
      úsudek - poznáš dobrou pointu, správný úhel a publikum. Obsahový a vizuální
      vkus. Umíš říct, co nefunguje a proč. Samostatnost. Převezmeš výstup a dotáhneš
      ho ke schválení. Chuť učit se pracovat s AI a hledat lepší způsob výroby obsahu.
      Nemusíš umět profesionálně stříhat video, pracovat v grafických programech ani
      mít dokonalou znalost ChatGPT Codex nebo Claude Code. To tě naučíme. Budeš u
      projektů, které jsou vidět Kolem našich programů a akcí máme skvělou komunitu
      lidí, kteří zkoušejí nové způsoby práce s AI a otevřeně sdílejí své zkušenosti.
      Účastníme se konferencí a vytváříme vlastní projekty s velkým dosahem i společenským
      přesahem. Patří mezi ně průzkum AImpact a akce AI Predictions nebo The State
      of AI. Vedle zpracování existujícího obsahu tak budeš přímo u vzniku nových
      témat, kampaní a živých akcí. Budeš se moct účastnit také velkých kurzů Future
      AI Leader. Uvidíš, jak lidé nové postupy skutečně používají, co jim funguje
      a jaké příběhy stojí za další zpracování. Čeká tě přímá spolupráce s Filipem,
      přístup ke spoustě skutečných zdrojů a možnost ovlivnit, co natočíme, zveřejníme
      nebo vyzkoušíme příště. Na čem pracujeme Náš obsah propojuje téma Budoucnost
      nepráce a Superpowered. Zajímá nás, co může jeden člověk zvládnout s pomocí
      AI a jak si při tom zachovat vlastní hlavu, myšlení a taky zdravý rozum :) Téma
      se promítá do knih, podcastů, přednášek, videí, kurzů, konferenčních formátů
      i kampaní. Hledáme člověka, který nám pomůže převádět silné myšlenky do obsahu,
      kterému lidé rozumějí a mohou ho použít. Pokud tě lákají méně obvyklé projekty
      z konferencí nebo živých akcí, dostaneš prostor zapojit se i do nich. Nebojíme
      se ani guerillových kampaní nebo crazy nápadů :) Praktické podmínky Spolupráce
      na IČO (velmi dobře placená) Přibližně 10–25 hodin týdně Primárně remote Občasné
      online nebo osobní setkání Nástup možný ihned Odměna dle dohody Jak se přihlásit
      Pošli přihlášku přes StartupJobs. V doplňující otázce nám můžeš poslat jednu
      nejlepší existující ukázku práce a stručně uvést svůj podíl, výsledek a použití
      AI. Nic nového kvůli přihlášce nevytvářej. Pokud ukázku právě nemáš po ruce,
      přihlášku můžeš odeslat i bez ní; případné chybějící informace si doplníme u
      vybraných kandidátů. Vybraným kandidátům pošleme placené zadání. Do 14 dnů budeš
