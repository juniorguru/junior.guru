- name: st-141
  inputs:
    id: st-141
    title: 🧠 Medior PHP & Node.js vývojář | Nette, TypeScript | Freelance remote 🚀
    text: 'Hledáme PHP/Node.js vývojáře či vývojářku do malého týmu, který staví reálné
      digitální produkty. Naše systémy nejsou prototypy do šuplíku — zákazníci je
      používají každý den a běží přes ně jejich provoz i peníze. Čeká tě full-time
      spolupráce na freelance a práce full remote . Jsme malý software house, kde
      budeš mít skutečný vliv na architekturu, technologie i podobu výsledného řešení.
      🚀 Na čem budeš pracovat Čeká tě práce na dvou propojených částech jednoho ekosystému.
      Některé věci budujeme od nuly, jiné postupně modernizujeme - vždy s vědomím,
      že výsledek musí obstát v běžném provozu. Platforma pro fitness centra a sportoviště:
      budeš rozvíjet zavedený produkt v PHP, který má reálné uživatele. Dopad své
      práce uvidíš klidně hned druhý den na recepci. Propojení online světa s hardwarem
      na pobočkách: v Node.js a TypeScriptu budeš stavět služby komunikující s reálnými
      zařízeními, platbami i výpadky sítě. Happy path tady nestačí. Propojené systémy:
      obě části spolu komunikují, takže se přirozeně dostaneš k PHP i Node.js podle
      toho, co projekt právě potřebuje. 🧩 Koho hledáme Nehledáme jen dobře napsané
      CV, ale člověka se správným mindsetem. Potřebujeme parťáka či parťačku na úrovni
      medior až senior, který či která se umí samostatně rozhodovat a dotahovat věci
      do funkčního výsledku. PHP i Node.js: zvládáš oba světy, i když mezi nimi nemusíš
      dělit svůj čas přesně napůl. Praxe a samostatnost: máš alespoň 4 roky zkušeností
      a přepínání mezi jazyky podle aktuálního úkolu je pro tebe přirozené. AI s rozumem:
      aktivně využíváš nástroje jako Claude, Codex nebo Cursor, zároveň víš, že kvalitní
      kód nevzniká bezmyšlenkovitým copy-pastem. Chuť zlepšovat: nebojíš se sáhnout
      do staršího kódu, pochopit ho a posunout ho k lepšímu. 🧰 Tech stack Backend
      a aplikační logika V PHP budeš pracovat s PHP 8.5 a Nette 3.2 . Pro služby kolem
      zařízení a online provozu používáme Node.js 24 a TypeScript , včetně NestJS
      , Bunu a WebSocketů . Data, provoz a integrace V každodenní práci se potkáš
      s MySQL , Dockerem a GitLab CI . Součástí řešení jsou také platební brány, externí
      API a mobilní aplikace pro iOS a Android . 🛠️ Jak fungujeme Pracujeme full remote.
      Když je potřeba něco vyřešit, mluvíme spolu přímo a hledáme cestu, která posune
      produkt i zákazníka. Full remote: pracuj odkudkoliv a organizuj si práci způsobem,
      který ti vyhovuje. Malý tým: znáš lidi, se kterými spolupracuješ, a tvoje práce
      nezapadne v korporátním procesu. Přímá komunikace: domlouváme se bez mezivrstev
      a dáváme si otevřený, konkrétní feedback. Rychlá rozhodnutí: dobré nápady nemusí
      čekat na několik kol schvalování. 💬 Zaujalo tě to? Ozvi se nám a pošli pár řádků
      o sobě, odkaz na GitHub nebo ukázku projektů, na kterých jsi pracoval/a. Pavla,
      HR'
