- name: st-112
  inputs:
    id: st-112
    title: Technický lídr produktu a implementací GITRIX™
    text: 'Hledáme technologického lídra a partnera, který chce společně s námi budovat
      platformu GITRIX™ a naplnit naši ambici stát se světovým lídrem v oblasti digitálních
      identit a kybernetické bezpečnosti. Existují pracovní nabídky. A pak příležitosti,
      které přicházejí jednou za život. Toto je jedna z nich. O nás Jsme česká technologická
      společnost stojící za platformou GITRIX™ . Vyvíjíme vlastní enterprise platformu
      GITRIX™ pro komplexní správu digitálních identit, moderní multifaktorovou a
      bezheslovou autentizaci, řízení životního cyklu certifikátů a správu související
      bezpečnostní infrastruktury. Naše řešení dnes využívají nemocnice, veřejná správa,
      města, kraje i významné komerční organizace. Pomáháme jim budovat bezpečné a
      důvěryhodné digitální prostředí v souladu s požadavky NIS2, nového zákona o
      kybernetické bezpečnosti (nZKB), eIDAS a moderními standardy kybernetické bezpečnosti.
      Nevyvíjíme software na zakázku ani další běžný informační systém. Budujeme vlastní
      technologickou platformu s jasnou vizí a globální ambicí. Naše cíle V České
      republice jsme si vybudovali silnou pozici zejména ve zdravotnictví a veřejném
      sektoru. Nyní expandujeme na Slovensko a připravujeme vstup na polský trh. Naší
      ambicí je vybudovat GITRIX™ jako evropského technologického lídra v oblasti
      digitálních identit, autentizace a digitální důvěry – a postupně se zařadit
      mezi světovou špičku. Chceme vytvářet technologie, které budou konkurovat nejlepším
      světovým řešením. Ne kopírovat. Udávat směr. Proč hledáme technického lídra
      produktu a implementací? Firma vstupuje do další zásadní fáze svého rozvoje.
      Chceme stabilizovat technologické základy a na nich nastartovat silný a dlouhodobě
      udržitelný růst. Hledáme zkušeného technického lídra, který pomůže propojit
      produktový rozvoj, architekturu, vývoj, obchod a reálné implementace platformy
      GITRIX™ u zákazníků. Hledáme technologického lídra a partnera, který bude společně
      s námi určovat budoucnost společnosti a udávat směr GITRIX™. Budeš partnerem
      zakladatelů společnosti s přímým vlivem na architekturu produktu, technologickou
      strategii, vývoj nových technologií i další rozvoj platformy. Hledáme člověka,
      který dokáže převzít technické vedení rozvoje platformy GITRIX™, vést vývojový
      tým, spolupracovat se sales týmem, podílet se na produktové strategii a zároveň
      pochopit implementační proces tak hluboko, aby jej bylo možné zjednodušit, standardizovat
      a předat dál internímu týmu i našim technologickým a obchodním partnerům. Nejde
      nám pouze o vývoj nebo architekturu. Hledáme člověka, který rozumí tomu, že
      dobrý produkt musí být nejen technicky správně navržený, ale také dobře implementovatelný,
      srozumitelný pro partnery, obchodně uchopitelný a dlouhodobě udržitelný. Společně
      chceme vybudovat GITRIX™ jako světového lídra ve svém segmentu, udávat trendy
      v bezpečnostních technologiích a rozvíjet strategická partnerství, která budou
      posouvat celý obor. Co budeme budovat Platformu nové generace pro: Identity
      & Access Management (IAM) Multi-Factor Authentication (MFA) Passwordless autentizaci
      Public Key Infrastructure (PKI) správu životního cyklu certifikátů správu interní
      podnikové PKI infrastruktury správu serverových a technologických certifikátů
      Single Sign-On (SSO) Privileged Access Management (PAM) správu privilegovaných
      účtů monitoring bezpečnostní infrastruktury automatizaci bezpečnostních procesů
      cloudová i on-premise prostředí integraci do Microsoft ekosystému využití AI
      při správě identit, automatizaci a bezpečnostních operacích Naším cílem je vybudovat
      GITRIX™ jako jednotnou enterprise platformu kybernetické bezpečnosti pro organizace
      s nejvyššími nároky na bezpečnost, důvěryhodnost a vysokou dostupnost. Hlavní
      smysl role Cílem této role je posílit technické a produktové vedení platformy
      GITRIX™ a pomoci nám vybudovat opakovatelný systém rozvoje, implementace a předávání
      know-how. Potřebujeme člověka, který dokáže: pochopit platformu GITRIX™ do technického
      i produktového detailu, pomoci určovat její další směr, navrhovat architekturu
      nových funkcí a integračních scénářů, vést a koordinovat vývojový tým, převádět
      obchodní a zákaznické potřeby do technických zadání, aktivně spolupracovat se
      sales týmem, zapojit se do vybraných implementací u klientů, zjednodušovat instalační
      a implementační postupy, vytvářet metodiku, dokumentaci a checklisty, předávat
      know-how internímu týmu i partnerům. Jedním z hlavních cílů role bude snížit
      závislost na individuálním know-how a převést klíčové technické a implementační
      znalosti do systému, který bude možné opakovat, škálovat a předávat dál. Tvoje
      role V Tvé gesci bude technologické směřování a další rozvoj GITRIX™, stejně
      jako budování, vedení a rozvoj špičkového týmu technických specialistů. Budeš
      mít odpovědnost i prostor zásadně ovlivňovat, kam se naše technologie a celý
      produkt posouvají. Budeš technickým partnerem pro product board, sales tým,
      vývojový tým i implementační tým. Pomůžeš určovat, kam se má platforma GITRIX™
      dále ubírat, jaké funkce mají největší hodnotu a jak je technicky správně navrhnout.
      Budeš zodpovědný zejména za: technologickou strategii společnosti, technické
      vedení rozvoje platformy GITRIX™, návrh a rozvoj enterprise architektury, návrh
      architektury nových funkcí, modulů a integrací, spolupráci na produktové roadmapě,
      převod obchodních a zákaznických požadavků do technických zadání, spolupráci
      se sales týmem při návrhu řešení pro zákazníky, účast na produktových, presales
      a technických konzultacích, prioritizaci technického backlogu, budování, vedení
      a rozvoj technického týmu specialistů, nastavování technických standardů a vývojových
      postupů, výběr a rozhodování o použitých technologiích, bezpečnostní architekturu,
      kvalitu a efektivitu vývoje, stabilitu a škálovatelnost řešení, dohled nad kvalitou,
      bezpečností, škálovatelností a udržitelností řešení, přípravu strategických
      návrhů dalšího vývoje produktu, spolupráci s klíčovými zákazníky a strategickými
      technologickými partnery, komunikaci s vedením společnosti o technických dopadech
      produktových rozhodnutí. Budeš mít přímý vliv nejen na GITRIX™, ale i na to,
      jak bude celá společnost technologicky fungovat a růst. Implementace a předávání
      know-how Součástí role bude také hluboké pochopení toho, jak se platforma GITRIX™
      reálně nasazuje u klientů. Hledáme člověka, který se dokáže naučit instalační,
      konfigurační a implementační postupy, aktivně se zapojit do vybraných implementací
      a pomoci tyto postupy zjednodušit. Cílem není vytvořit novou závislost na jednom
      člověku. Cílem je naopak know-how strukturovat, zdokumentovat a předat dál.
      Tato oblast bude zahrnovat zejména: pochopení instalačního a implementačního
      procesu platformy GITRIX™, účast na vybraných klientských implementacích, návrh
      zjednodušení implementačních postupů, standardizaci konfigurací a integračních
      scénářů, přípravu implementačních playbooků, checklistů a technické dokumentace,
      identifikaci částí implementace, které lze automatizovat nebo zjednodušit, vytvoření
      metodiky pro předávání know-how partnerům, podporu technologických partnerů
      při prvních implementacích, spolupráci se sales týmem při návrhu realistického
      rozsahu implementace, zpětnou vazbu do produktu tak, aby se platforma postupně
      snadněji nasazovala. Koho hledáme? Hledáme zkušeného člověka, který už má za
      sebou odpovědnost za vývoj nebo technické vedení komplexnějšího softwarového
      produktu, platformy nebo enterprise řešení. Měl bys umět vést technickou diskusi,
      ale zároveň ji dokázat přeložit do obchodního a produktového jazyka. Potřebujeme
      někoho, kdo dokáže komunikovat s vývojáři, obchodem, zákazníky i vedením společnosti.
      Očekáváme, že máš: zkušenost s technickým leadershipem nebo vedením vývojového
      týmu, silné architektonické myšlení, zkušenost s návrhem webových aplikací,
      portálových řešení nebo SaaS platforem, zkušenosti s návrhem enterprise systémů,
      zkušenosti s architekturou rozsáhlých aplikací, schopnost připravit technický
      návrh řešení na základě obchodního zadání, praktickou zkušenost s řízením backlogu,
      prioritizací a technickou dokumentací, schopnost komunikovat se sales týmem,
      konzultanty a zákazníky, cit pro produkt, uživatelskou hodnotu a dlouhodobou
      udržitelnost, schopnost rozhodovat, nést odpovědnost a dotahovat věci do výsledku,
      zkušenosti s Microsoft technologiemi, zkušenosti s cloudovými i on-premise řešeními,
      zkušenosti s vývojem vlastních technologických produktů, ochotu pochopit produkt
      nejen z pohledu vývoje, ale také z pohledu implementace a provozu u klienta.
      Výhodou bude zkušenost s některou z oblastí: enterprise software, identity management,
      certifikáty, PKI, elektronický podpis nebo kybernetická bezpečnost, integrační
      platformy, CRM nebo portálová řešení, cloudové služby a API integrace, implementace
      softwaru u zákazníků, tvorba technické a implementační dokumentace, školení
      partnerů nebo budování partnerské metodiky, řízení dodavatelů nebo externích
      vývojářů. Jaká bude tvoje role v týmu? Nebudeš izolovaný technik mimo dění.
      Tato role propojuje několik důležitých oblastí: obchodní tým, který přináší
      potřeby trhu a zákazníků, product board, který určuje směr platformy, vývojový
      tým, který řešení realizuje, implementační tým, který zavádí řešení u klientů,
      technologické a obchodní partnery, kteří potřebují jasnou metodiku, vedení společnosti,
      které potřebuje srozumitelný technický pohled na další rozvoj produktu. Potřebujeme
      člověka, který dokáže vést technickou diskusi věcně, klidně a srozumitelně.
      Člověka, který umí říct, co dává smysl, co je rizikové, co je potřeba nejdřív
      připravit a jaký postup je dlouhodobě správný. Technologie Pracujeme s moderním
      enterprise technologickým stackem: C# / .NET, ASP.NET Core, Python, Blazor,
      JavaScript / TypeScript, REST API, SQL Server, Git, Docker, Kubernetes, CI/CD,
      Windows Server, Linux, Active Directory, Microsoft Entra ID, LDAP, Kerberos,
      Keycloak, PKI / X.509, HSM, MFA, IAM, PAM, OAuth 2.0, OpenID Connect, SAML,
      FIDO2, Smart Cards, Windows Hello for Business a TLS. Co nabízíme klíčovou roli
      u dalšího rozvoje platformy GITRIX™, možnost přímo ovlivnit produktovou a technickou
      strategii, úzkou spolupráci s vedením, obchodem a product boardem, prostor nastavovat
      technické standardy a vývojové procesy, možnost zjednodušit a profesionalizovat
      implementační metodiku, práci na produktu s reálným využitím u zákazníků, možnost
      budovat stabilní a profesionální vývojový tým, spolupráci s technologickými
      a obchodními partnery, kombinaci strategické, architektonické, produktové a
      praktické práce. FOKUS: Nebudeš spravovat cizí produkt. Budeš vytvářet vlastní.
      Nebudeš pouze plánovat roadmapu. Společně budeme určovat směr, kterým se bude
      GITRIX™ dál rozvíjet. Nebudeš jedním z mnoha manažerů. Budeš technologickým
      lídrem společnosti. ZAMĚŘENÍ NA: technologickou strategii, architekturu platformy
      GITRIX™, produktovou roadmapu, výběr klíčových technologií, společné budování
      a rozvoj technologického týmu, technologickou podporu expanze společnosti na
      další trhy. Co je pro nás důležité Hledáme spolehlivého technického partnera
      pro celý tým. Někoho, kdo umí nejen navrhovat architekturu a vést vývoj, ale
      také komunikovat, vysvětlovat, prioritizovat, zjednodušovat a předávat know-how
      dál. Důležité pro nás je, aby kandidát dokázal know-how nejen získat, ale také
      ho strukturovat, zdokumentovat a přeměnit v opakovatelný systém – pro interní
      tým, technologické partnery i obchodní partnery. Naše ambice Věříme, že i z
      České republiky může vzniknout technologická společnost, která bude udávat směr
      v oblasti digitálních identit a kybernetické bezpečnosti. Nechceme být největší.
      Chceme být nejlepší. Pokud hledáš místo, kde můžeš zanechat skutečnou technologickou
      stopu, kde budou mít Tvá rozhodnutí dlouhodobý dopad a kde budeš budovat produkt
      s globálními ambicemi, rádi se s Tebou potkáme. Pokud chceš být u dalšího rozvoje
      platformy GITRIX™ a hledáš roli, kde se propojuje technická strategie, produktový
      rozvoj, vedení týmu, implementace a spolupráce s obchodem, rádi se s Tebou potkáme.
      Protože některé příležitosti nejsou jen o změně zaměstnání. Jsou o možnosti
      vybudovat něco, co tu bude ještě dlouho po nás.'
