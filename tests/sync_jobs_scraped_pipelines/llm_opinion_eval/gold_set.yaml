    title: Hackni s námi svět jako Citadelo Junior Etický Hacker / Penetration Tester
    text: 'Tuhle část si určitě přečti, protože tam poznáš, kdo opravdu jsme. Baví
      tě hledat cesty tam, kam se běžně nikdo nedostane? Chceš s námi absolvovat tajné
