- name: st-026
  inputs:
    id: st-026
    title: Online Marketing Specialist pro FAVI.cz
    text: 'Hledáme někoho, kdo převezme český trh a pomůže nám ho posouvat zase o
      kus dál. Čekají tě sociální sítě, influenceři, lokalizace kampaní i trochu performance.
      Většina obsahu vzniká v našem centrálním týmu, takže budeš mít skvělý základ
      - ty se postaráš o to, aby všechno dávalo smysl českým zákazníkům a fungovalo
      co nejlépe. Co tě čeká? 📱 Sociální sítě (CZ) Správa našich českých kanálů (Facebook,
      Instagram, TikTok, Pinterest, YouTube) Lokalizace obsahu z centrálního týmu,
      plánování, publikování a péče o komunitu Správa HR profilu Meet FAVI 🎨 Tvorba
      obsahu Tvorba vlastního obsahu, který využívají i ostatní FAVI trhy Sdílení
      lokálních trendů a nápadů s mezinárodním týmem 📊 Meta Ads (CZ) Lokalizace kreativ,
      textů a CTA Spouštění, monitoring a optimalizace kampaní 🤝 Influencer marketing
      & UGC Kompletní koordinace spolupráce s influencery - od briefu až po vyhodnocení
      Budování vztahů s českými tvůrci 🌍 Lokalizace Překlady a adaptace marketingových
      materiálů pro český trh Udržování přehledného workflow v ClickUpu Koho hledáme?
      Máš alespoň 2 roky zkušeností se social media, contentem nebo influencer marketingem
      Čeština je tvůj rodný jazyk a dobře rozumíš českému trhu Domluvíš se anglicky
      s kolegy z ostatních trhů Meta Ads jsou výhodou Jsi samostatný/á, proaktivní
      a umíš dotahovat věci do konce Proč FAVI? Dostaneš velkou míru ownershipu nad
      českým trhem a zároveň budeš součástí mezinárodního marketingového týmu. Věci
      se hýbou rychle - nové nápady testujeme v praxi, vyhodnocujeme a posouváme dál.
      Fokus na exekuci, ne nekonečné schvalování Jak vypadá výběrko? Máme rádi jednoduchý
      a lidský přístup: 📞 Krátký telefonát s Ivet (People Care Specialist) – jen abychom
      se vzájemně poznali a pobavili se o tvé motivaci. 📝 Case study - praktický úkol.
      Zajímá nás více tvůj způsob uvažování než „dokonalé odpovědi“ 👋 Osobní pohovor
      - s Karin (Head of Brand & Content ), Ewelí (Social Media Team Lead) a Ivet.
      Projdeme si tvou case study, dosavadní zkušenosti a přiblížíme ti, jak to ve
      FAVI funguje. A samozřejmě budeš mít prostor zeptat se na cokoliv, co tě zajímá.
      A co nabízíme na oplatku? Možnost spolupráce na zaměstnanecký poměr i IČO 5
      týdnů volna + 3 sick days ročně Možnost práce z domova a flexibilní pracovní
      dobu Den na dobročinné aktivity Stravenkový paušál (90,-/den) Vzdělávání - interní
      kurzy, ale i semináře a konference dle tvého výběru Multisportka (zaměstnanci
      přispívají 400,-) Svůj den můžeš vždycky začít dobrou snídaní a kávou/čajem,
      které Ti bude k dispozici po celý den stejně jako jídlo a pití v mini chladničce,
      ovesné kaše, müsli, ovoce, zelenina a jiné dobrůtky Pořádáme pravidelné teambuildingy.
      Vedle toho občas společně grilujeme nebo zajdeme po práci jen tak posedět. Nevěříš?
      Podívej se na náš instagram @meetfavi Útulné kanceláře v srdci Prahy u Václavského
      náměstí s okny do klidného vnitrobloku Už se vidíš v našem týmu? Super, napiš
      něco málo o sobě. Těšíme se na Tebe! 🙂'
