      byznys problémy napříč firmou — od zákaznického servisu přes marketing po obchod
      integrovat mezi sebou systémy přes API (e-shop, ERP, doprava, sklad) stavět
      datové pipeline a dbát o to, aby dlouhodobě spolehlivě běžely dotahovat věci
