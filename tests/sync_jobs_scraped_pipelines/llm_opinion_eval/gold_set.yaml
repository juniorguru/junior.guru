- name: st-029
  inputs:
    id: st-029
    title: AI First Software Engineer (.NET & Go)*
    text: 'Hledáme vývojáře, který už změnil způsob, jakým píše software. Ne někoho,
      kdo si občas nechá doplnit funkci od Copilota — ale člověka, který umí zadání
      rozložit do specifikace, pustit na ni agenta, výsledek zkritizovat a dotáhnout
      do produkce. AI nástroje u nás nejsou experiment, jsou součástí denní pipeline.
      Co tě čeká Vývoj backendových služeb v .NET nebo Go v microservices architektuře.
      Práce ve spec-first režimu : zadání → analýza/PRD → implementace → PR → review
      loop → merge, s agenty (Claude Code) jako běžnou součástí procesu. Psaní kontextu
      pro agenty: instrukce k repozitářům, guardraily, evaluace výstupů. Review agentních
      PR — zodpovědnost za kód a jeho chování v produkci zůstává na člověku. Zlepšování
      vývojářské pipeline pro celý tým a sdílení toho, co funguje, na interním AI
      Weekly. DevOps kultura: nasazujeme v AWS , monitorujeme přes Datadog a Prometheus
      , používáme feature flags a CI/CD . Koho hledáme Máš několik let solidní zkušenosti
      s backendovým vývojem ( .NET Core nebo Go ; jiný silný jazyk s ochotou přejít
      je taky varianta). AI nástroje používáš denně a umíš věcně říct, kde ti pomáhají
      a kde ti lžou. Umíš napsat specifikaci, kterou zvládne odbavit agent — a zároveň
      poznáš, kdy je rychlejší to napsat rovnou sám. Zdravá skepse: testy, review,
      observabilita. Vygenerovanému kódu nevěříš víc než vlastnímu. Zajímá tě, jak
      se aplikace chovají v produkci, a DevOps přístup bereš jako samozřejmost. Máš
      češtinu na úrovni rodilého mluvčího (nebo se tomu aspoň blížíš) a angličtina
      ti také problém nedělá Výhodou: MCP servery, RAG, práce s embeddingy a vyhledáváním,
      evaluace a měření kvality LLM výstupů, spec-driven nástroje (OpenSpec, Spec
      Kit), zkušenost s češtinou jako jazykem modelu. Co nabízíme Firemní předplatné
      Claude a plnou podporu v používání AI nástrojů — máme vlastní interní guidelines
      i pravidelné sdílení. Prostor spoluurčovat, jak celá firma vyvíjí software —
      ne jen dodávat tasky. Práci v týmu, který spojuje vývoj, provoz i produktové
      myšlení. Hybridní režim (on-site v Praze, kombinace remote podle dohody). Přátelskou
      kulturu , kde vítáme nové nápady a otevřenou komunikaci. 25 dní dovolené + 2
      dny volna navíc – ať si opravdu odpočineš. Třikrát v týdnu jídlo v kanclu zadarmo
      – v úterý ovoce, ve středu snídaně a ve čtvrtek sladká tečka. Dovoz obědů až
      do kanclu za zvýhodněnou cenu. Stravenkový paušál za každý odpracovaný den.
      Mobilní tarif od T-Mobile zadarmo – neomezené volání, SMS a internet do 8 GB,
      s možností rozšíření i pro blízké. MultiSport karta. Pravidelné firemní akce.
      Slevy na masáže. Slevy na naše produkty – auto si jako náš zaměstnanec pojistíš
      se slevou 45 %, cestovní pojištění pro sebe i své blízké se slevou 70 %.'
