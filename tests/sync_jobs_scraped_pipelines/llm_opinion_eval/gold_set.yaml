- name: st-089
  inputs:
    id: st-089
    title: Junior Customer Support Specialist (m/ž)
    text: 'Pomoz nám zbavit firmy té nejnudnější práce na světě Ahoj, my jsme Digitoo
      👋🏼 Pomáháme firmám zbavit se ručního přepisování faktur. S využitím moderních
      technologií a vlastní AI měníme účetnictví v něco, co konečně dává smysl (a
      občas udělá i radost 🍰). Naše aplikace šetří firmám až 75 % nákladů a zkracuje
      schvalování faktur na pár vteřin. Abychom tuto supermoc udrželi bezchybnou,
      hledáme do týmu akčního parťáka na L1 zákaznickou podporu . 💡 Kdo tento člověk
      JE a KDO NENÍ Nejsi pro nás jen „odpovídač na e-maily a dotazy v chatu“. Hledáme
      zvídavého detektiva a skvělého komunikátora v jednom. Tvou rolí je zachovat
      klid, vytáhnout z klienta (často účetní v presu) správné informace, domyslet
      si širší kontext a přeložit technické řešení od vývojářů do řeči běžného člověka.
      🎯 Co u nás budeš dělat? První linie podpory (L1): Klienti volají nebo píší na
      chat a Freshdesk, když jim něco nefunguje, neví si rady s aplikací nebo se jim
      špatně vytěžil doklad. Ty jsi ten, kdo jim zachrání den. Detektivní práce a
      domýšlení: Klient často neví, jak přesně chyba vznikla. Tvým úkolem je nepsat
      generické odpovědi, ale aktivně zjišťovat informace, ptát se a domýšlet si kontext,
      co se na pozadí stalo. Propojování klientů a vývojářů: Co nevyřešíš hned, přetavíš
      do přesně zadaného ticketu v JIRA pro naše vývojáře. Odpověď od vývojářů pak
      „přeložíš“ z IT řeči do lidštiny tak, aby tomu rozuměl i uživatel na druhé straně.
      Řešení integrací: Digitoo se dá propojit s různými ERP systémy - budeš se orientovat
      v tom, jak tato napojení fungují, a řešit s integrátory případné dotazy/potíže.
      Práce s interním know-how: Máme skvěle vedené znalosti v Notionu a Slacku. Než
      zapojíš kolegy, nejdřív si informace proaktivně dohledáš. 👤 Koho hledáme? Praxe
      na zákaznické podpoře: Už jsi na supportu pracoval/a a víš, co tato práce obnáší.
      Máš v sobě přirozenou chuť pomáhat, najít řešení. Rodilý mluvčí ČJ + základní
      AJ: 95 % našich klientů je z ČR, takže perfektní čeština a rychlé psaní jsou
      absolutní základ. Angličtinu aktuálně využiješ spíš výjimečně. Technické zázemí
      a zvídavost: Technologický svět tě baví. Chceme někoho, kdo má technické myšlení,
      rád se šťourá v tom, jak věci fungují pod kapotou, a dostane se aplikaci Digitoo.ai
      rychle pod kůži. Zkušenost s tickety (Freshdesk, JIRA): Zkušenost se spravováním
      ticketů je obrovskou výhodou, v JIRA budeš zakládat zadání pro vývojáře. Lidskost,
      klid a empatie: Dokážeš mluvit s lidmi v stresových situacích s nadhledem, klidem
      a ideálně i s úsměvem. 🛠 Jak to u nás funguje a co nabízíme? Pracovní doba:
      Po–Pá, standardně 9:00 – 17:00 (podpora je k dispozici 9:00 – 16:30). Flexibilita
      a hybridní model: Na začátku tě důkladně zaškolíme, čeká tě vstřícný a skvělý
      tým dvou zkušených kolegů. Postupně se můžeme domluvit na remote / hybridním
      fungování. Skvělé benefity: Notebook, telefon, Multisport karta, možnost kariérního
      růstu, výborná káva a občerstvení v kanceláři, týden dovolené navíc. Chtěl/a
      bys s námi dělat účetnictví trochu méně bolestivé? Pošli nám své CV a napiš
      nám krátce, proč tě láká právě zákaznická podpora v technicko-AI produktu. Těšíme
      se na tebe! 🙂'
