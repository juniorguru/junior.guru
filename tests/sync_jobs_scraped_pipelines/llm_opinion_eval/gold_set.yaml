- name: st-162
  inputs:
    id: st-162
    title: IT Operations Team Lead
    text: '✨ What awaits you here: As an IT Operations Team Lead, you will take ownership
      of our internal technological environment. We are on a journey to make our internal
      IT as robust and secure as our core products, and we need a hands-on leader
      to help us get there. You will guide a small, dedicated team responsible for
      our entire internal stack—from hardware lifecycle to our suite of internal collaboration
      and productivity tools. Your role is to build on our existing foundations, professionalize
      our processes, and ensure that our internal operations are stable, secure, and
      well-documented. If you want to know more about Braiins, check our profile on
      Cocuma ! 🤝 Responsibilities: Lead, mentor, and grow a small team of IT specialists,
      fostering a culture of operational excellence, accountability, and a service-oriented
      mindset. Actively participate in daily L1/L2 support and system administration
      while simultaneously driving the long-term professionalization and scalability
      of our internal environment. Take ownership of internal security and maintenance
      of our SOC2 compliance, ensuring systems are hardened and access rights are
      regularly audited under "least privilege" principles. Maintain and refine internal
      workflows for the entire IT lifecycle (onboarding/offboarding, hardware provisioning,
      access management). Manage the physical and digital workplace infrastructure,
      overseeing office connectivity, conferencing technology, and the complete hardware
      fleet lifecycle. Drive operational efficiency by identifying bottlenecks and
      implementing pragmatic automation where it makes sense. Act as a bridge between
      internal IT and the Ops/Infra team to ensure technical and security standards
      remain aligned across the company. Take an active role in hiring and onboarding
      new team members to maintain a high-performing IT team. 🔎 We are looking for
      someone with: Minimum 5 years of experience in IT infrastructure or system administration,
      with at least 2 years in a leadership or senior role. Solid experience with
      Linux (our environment is primarily Linux-based). A "Player-Coach" mindset,
      being comfortable leading a team while remaining technically hands-on and resolving
      daily support tickets. Hands-on experience with administration of Google Workspace,
      Jira and GitLab. Strong security and compliance awareness (ideally SOC2 or similar).
      Solid understanding of IT operations, specifically asset management, identity
      management, hardware lifecycle, and office networking. A process-oriented approach
      with a drive to document internal workflows and standardize procedures without
      unnecessary bureaucracy. Service-oriented mindset with excellent communication
      skills in both Czech and English. Strong organizational skills and the ability
      to prioritize tasks effectively in a small, fast-paced team. Ability to transform
      manual tasks into automated workflows. 💪 Preferred Skills: Experience with scripting
      in Bash or Python for automation or API integrations. Solid understanding of
      networking (securing and troubleshooting office Wi-Fi and VPNs). 🏖 What we offer
      to you: Full-time position with flexible working hours. Both possibilities to
      work as an Employee or Freelance. Indefinite agreement. For employees 5 weeks
      of vacation and 3 sick days. Company events, and occasional brunches in the
      office. Relaxing room, a shower, and a parking spot. Modern offices in the center
      of Prague, Czech Republic — the heart of Europe. 🔥 We will love you even more
      if… You are interested in cryptocurrencies or have active experience with them.
      You are interested in the responsible and effective application of AI tools.'
