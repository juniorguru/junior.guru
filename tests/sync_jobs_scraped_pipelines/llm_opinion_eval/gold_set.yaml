- name: st-116
  inputs:
    id: st-116
    title: Produktový lídr a  vývojář nové AI služby
    text: KPCS CZ, Praha, převážně na dálku, plný nebo částečný úvazek Proč tuhle
      pozici otevíráme Stavíme službu, která u zákazníka odvede část toho, co dnes
      dělá konzultant . Má se sama napojit na jeho prostředí, sesbírat z něj data,
      porovnat je s tím, co považujeme za správně nastavené, dojít k závěru a umět
      vysvětlit, z čeho ho postavila. Kde si nebude jistá, měla by to říct a předat
      to člověku. Na výzkumné části spolupracujeme s ČVUT . Architektura a rozsah
      se teď formují, znalost oboru i přístup do zákaznických prostředí máme, konzultanti
      dokážou posoudit, jestli výstup dává smysl, a máme zákazníky ochotné zkoušet
      první verze. Chybí nám k tomu jeden člověk , se kterým se dá přít o návrh, rozdělit
      si práci a vzít to za druhý konec. Koho si pod tím představujeme Člověka, který
      drží v hlavě celek a zároveň si na věci sám sahá . Rozumí tomu, co zákazník
      ocení a za co zaplatí, umí říct, kde končí prototyp a začíná něco prodejného,
      a to celé si sám staví. Opírá se přitom o AI nástroje i o kolegy , kteří Azure,
      identity a bezpečnost dělají roky a poznají, když je výstup vedle. Není to role
      na správu backlogu, psaní specifikací a plánování sprintů. To si zvládneme sami
      a s tímhle typem člověka máme na podobných projektech spíš špatnou zkušenost.
      Bližší je nám někdo, kdo návrh raději ověří na funkčním prototypu než v další
      prezentaci . Jak bude vypadat tvoje práce Na straně stavění se budeme bavit
      o architektuře celé služby . Jak se orchestrují agenti, odkud se bere kontext,
      jak se sahá na zákaznická data, co postavit vlastními silami a co koupit hotové.
      Většina těchhle rozhodnutí je zatím otevřená a chceme je dělat společně, ne
      aby jedna strana vypracovala návrh a druhá ho odkývala. Součástí je psaní kódu.
      A pak měření. Bez sady případů, na kterých se dá ověřit, že nová verze je lepší
      než ta minulá, je vývoj tohohle typu systému hádání. Sestavit ji z reálných
      zakázek je jeden z prvních úkolů. Vedle toho chceme, abys od začátku držel celek
      . Teď stavíme základ, ale souběžně je potřeba přemýšlet o tom, jak bude vypadat
      rozhraní, jaké další nástroje službě přidáme, jak se to bude testovat a v jaké
      chvíli z toho je věc, se kterou se dá jít za zákazníkem a říct si o peníze.
      Nechceme, aby tohle za tebe o rok později řešil někdo jiný. Na straně zákazníků
      chodit na projekty, dívat se kolegům přes rameno a překládat to, co dělají,
      do něčeho, co jde automatizovat. Být u nasazení prvních verzí a poslouchat,
      kde to selhalo. Občas odjet za zákazníkem a obhájit, proč mu to stojí za čas.
      A pak vysvětlování . Dovnitř firmy, protože konzultantům budeš zabírat čas a
      část z nich se na automatizaci vlastního řemesla nebude dívat s nadšením. Ven,
      protože tenhle typ služby si zákazník nekoupí z letáku, chce vidět, jak to uvnitř
      funguje a proč se tomu dá věřit. Kdo si troufne o vlastní práci mluvit na webináři
      nebo o ní napsat, má to u nás k dobru. Co od tebe čekáme Že s AI nástroji opravdu
      pracuješ. Claude Code, Codex nebo něco podobného. Nestačí o nich číst a jedna
      appka poskládaná ve vizuálním nástroji taky ne. Zajímá nás něco, cos dotáhl
      do stavu, kdy to používá i někdo jiný než ty, nebo cos musel opravovat, když
      to spadlo. Když tě to za poslední rok nechytlo, přestože ty nástroje leží na
      stole a mluví se o nich všude, nejspíš si nesedneme. Že rozumíš zákazníkovi.
      Roky strávené někde, kde ses s ním potkával naživo. Konzultant, presales, technický
      account, produkťák u B2B produktu, na názvu role nám nezáleží. Potřebujeme,
      abys poznal rozdíl mezi tím, co zákazník řekne, a tím, co potřebuje, a nevadilo
      ti říct to nahlas. Kdo posledních deset let stavěl produkt pro anonymní uživatele
      a se zákazníkem nikdy neseděl u stolu, tady bude tápat. Že jsi něco dotáhl do
      provozu. Systém, který měl víc než jednu komponentu. Napojení na cizí systémy,
      držení stavu, ošetřené chyby a odpovědnost za to, když to v noci spadne. Že
      se umíš přít. Když ti návrh přijde špatný, chceme to slyšet hned a s odůvodněním,
      ne až u nasazení. Souhlas se vším nám nepomůže. Že se v nejistotě neztratíš.
      Obor se překlápí každých pár měsíců, hodně rozhodnutí padne s neúplnými informacemi
      a některá se za půl roku ukážou jako slepá. Čeština na jednání se zákazníkem
      a angličtina na technickou dokumentaci jsou samozřejmost. Tohle není seznam
      k odškrtání. Zajímá nás spíš to, jak přemýšlíš a co jsi s tím zatím udělal,
      než počet let u jednotlivých položek. Když sedí to podstatné, zbytek se dá dohnat.
      Co naopak neřešíme Akademické vzdělání v machine learningu ani zkušenost s trénováním
      modelů nepotřebujeme, stavíme na hotových modelech a těžiště práce je jinde.
      Microsoftu tady umíme dost, takže co ti bude chybět, doženeš za pochodu. A neupínáme
      se na konkrétní framework, za rok bude v kurzu jiný. Co za to nabízíme kromě
      peněz Naučíme tě stavět tenhle typ systému pořádně a dáme ti prostor osahat
      si ty nástroje na skutečných věcech , ne na hračkách. Kdo si dneska chce v AI
      nástrojích dobrousit řemeslo, obvykle na to hledá večery a víkendy. Tady to
      bude součást práce. Kolem sebe budeš mít lidi, kteří dělají Microsoft cloud
      a bezpečnost roky a znají zákaznická prostředí zevnitř. Na doménu ani na zákazníky
      nebudeš sám. Na oplátku od tebe od začátku chceme ten celostní pohled a to,
      abys ho dostal i do zbytku týmu. Lidí, kteří umí Microsoft do hloubky, tu máme
      dost. Chybí nám hlas, který se ptá, jestli to, co stavíme, někdo koupí. Kde
      a jak se pracuje Kancelář máme v Praze a práce na dálku je u nás zavedená a
      dlouhodobě funguje. U téhle role ale počítáme s tím, že se budeš potkávat s
      konzultanty a jezdit na zákaznická jednání, takže několik dní v měsíci strávíš
      v Praze nebo u zákazníka . Když bydlíš jinde v Česku, dá se to zvládnout. Když
      mimo republiku, bude potřeba se o tom bavit dopředu. Primárně hledáme člověka
      na plný úvazek . Menší úvazek nevylučujeme, ale chceme se o tom bavit rovnou
      v prvním kole, ať víme, s čím počítat. Jak vypadá výběrové řízení Tři kola,
      obvykle do měsíce od prvního kontaktu. První je hovor na půl hodiny. Co jsi
      stavěl/a a jak přemýšlíš o tom, kde má dnes smysl nasazovat agenty a kde ne.
      Ptej se i ty, ať víš, do čeho jdeš. Druhé je technické setkání na dvě až tři
      hodiny, ideálně osobně . Vezmeme jeden konkrétní problém z tohohle projektu,
      sedneme si k němu a budeme o něm přemýšlet nahlas. Zajímá nás, jak si sháníš
      informace, kde vidíš rizika a jak s nástroji doopravdy pracuješ. Vlastní notebook
      s sebou. Třetí je setkání s vedením, kde doladíme formu spolupráce, peníze a
      termín nástupu. Ozveme se ti po každém kole tak jako tak. Peníze 130 000 až
      180 000 Kč měsíčně hrubého při plném úvazku. Horní polovina rozpětí patří někomu,
      kdo pokrývá obě strany té role, tedy staví i rozumí zákazníkovi. Při zkráceném
      úvazku počítáme poměrnou část. Kdo jsme Již 20 let pomáháme firmám růst díky
      moderním IT řešením – od cloudu a kybernetické bezpečnosti po umělou inteligenci.
      Navrhujeme a implementujeme technologie, které zefektivňují procesy a chrání
      data. Naši odbornost potvrzují stovky úspěšných projektů i Microsoft certifikací
      a ocenění. Jsme skvělý tým s expertními znalostmi. Rozvíjíme silné stránky každého
      zaměstnance, děláme vše naplno a naším cílem je být vždy nejlepší. To je DNA
      naší společnosti. Zaujala tě tato pracovní pozice? Budeme rádi, když pošleš
      svoje CV nebo LinkedIn profil. Hlavně ale napiš pár vět o tom, cos postavil,
      a odkaz na něco, co si můžeme prohlédnout, ať už je to repozitář, nasazená služba
      nebo text, který jsi o své práci napsal. Životopis se hodí, ale sám o sobě nám
      o tobě moc neřekne:-)
