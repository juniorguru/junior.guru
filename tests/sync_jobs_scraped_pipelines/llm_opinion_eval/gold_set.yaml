- name: jo-249
  inputs:
    id: jo-249
    title: ADAS Test Engineer - ideální pro čerstvé absolventy technických oborů –
      EVOMOTIV s.r.o.
    text: 'Pracovní nabídka Buď u toho, když se auta učí vidět, myslet a rozhodovat.
      Kdo jsme a proč by Tě to mělo zajímat Jsme pobočka německé společnosti EVOMOTIV
      – technologického partnera předních evropských automobilek. V Německu jsme si
      vybudovali výborné jméno díky špičkovým výsledkům, technické kvalitě a otevřené
      firemní kultuře. Tento přístup jsme přenesli i do ČR, kde budujeme mladý tým
      zaměřený na projekty s vysokou přidanou hodnotou. Inovace bereme vážně. AI pro
      nás není buzzword, ale nástroj, který reálně používáme při vývoji a testování
      moderních automobilových systémů. Právě teď máš jedinečnou příležitost stát
      se součástí stále ještě nového týmu a zanechat trvalou stopu ve směřování EVOMOTIV
      v Česku. Hledáme šikovné absolventy se zájmem o vývoj automobilových systémů
      na pozici Test and Development Engineer, kteří mají drive, technickou zvědavost
      a chuť budovat značku. Co bude náplní Tvé práce Testování a validace ADAS systémů
      v reálném provozu i v testovacích scénářích Zaměření především na funkce: ELKS
      / aLDW (Lane Keeping & Lane Departure Warning), RMF (Emergency Assist) Práce
      s prototypovými vozidly – od prvních integrací až po finální ověřování Analýza
      chování systémů, hledání hraničních situací a jejich vyhodnocení Používání profesionálních
      automotive nástrojů jako: CANape, CANoe, CANalyzer, ODIS, IDEX, CP‑TOOL, KPM,
      CRETA (znalost je výhodou) Úzká spolupráce s vývojovými týmy zákazníků i kolegy
      v Německu Testování vozidel v zahraničních testovacích centrech – občasné cestování
      je součástí role Co od Tebe očekáváme Automotive je pro Tebe víc než práce –
      ADAS a moderní asistenční systémy Tě skutečně baví Máš dokončené VŠ vzdělání
      technického směru (automotive, mechatronika, elektro, IT, strojírenství…), nebo
      jsi SŠ absolvent s relevantní praxí Orientuješ se v testovacím a validačním
      procesu (ISTQB výhodou) Máš zkušenost nebo chuť pracovat s prototypy vozidel
      Čeština a angličtina na komunikativní úrovni Němčina je výhodou, nikoliv podmínkou
      Nevadí Ti v prvních dvou až třech měsících jezdit pravidelně do Německa pro
      načerpání potřebného know-how Na co se u nás můžeš těšit Naše EVOMOTIV firemní
      kultura Ti umožní ideálně skloubit práci a volný čas: s pružnou pracovní dobou
      si práci naplánuješ, jak potřebuješ - stačí se domluvit s týmem home-office
      nebo práci na dálku budeš moci kombinovat dle svých potřeb a potřeb projektu
      5 týdnů dovolené ti zajistí dostatek času na relax dle vlastních preferencí
      Chceme, aby ses i v práci cítil/-a jako doma: Máme otevřenou firemní kulturu,
      kde si lidé váží jeden druhého. Posloucháme se navzájem - tvůj názor je pro
      nás důležitý. Pracujeme v moderním prostředí Port7 v pražských Holešovicích
      - máme krásné kanceláře s terasou, s metrem na jedné a cyklostezkou na druhé
      straně a s nabídkou kulturních akcí přímo v areálu. Více si o naší firemní kultuře
      můžeš přečíst zde: https://www.atmoskop.cz/nazory-na-zamestnavatele/78297-evomotiv-s-r-o.
      Jdeš do toho s námi? Pošli nám svůj životopis v angličtině! Těšíme se na Tebe!
      #Vehicle Engineer, #Vehicle Development, #Vehicle Testing, #Automotive Testing,
      #Automotive Developer'
