- name: st-015
  inputs:
    id: st-015
    title: PHP & AI Software Developer
    text: 'Píšeš v PHP, ale poslední rok koukáš spíš na to, co se dá postavit s LLM
      a agenty? Hledáme vývojáře, který drží obě věci naráz: solidní backend v Nette
      a Symfony a chuť stavět AI nástroje. Půjde o práci v malé partě, kde se hodně
      zkouší, rychle rozhoduje. NA ČEM BUDEŠ DĚLAT backend v PHP (Nette, Symfony)
      a jeho dlouhodobý rozvoj frontend v Reactu (JS/TS/CSS) tam, kde je potřeba interní
      AI a DX tooling: skills, workflows, specs, evals, benchmarky AI featury, třeba
      vylepšování textů, generování obrázků nebo práce s MCP návrh a ladění promptů
      a ověřování, jestli reálně fungují KOHO HLEDÁME Nette a Symfony ovládáš na velmi
      dobré úrovni. Tohle u nás nedoškolíme, na tom stavíme. máš za sebou agentic
      vývoj, ideálně něco, co nám můžeš ukázat výhodou je zkušenost s tvorbou MCP
      výhodou je AI benchmarking, evaluace a ladění promptů výhodou je, žes už stavěl
      vlastní agenty nebo AI řešení výhodou je znalost nástrojů jako LiteLLM, Windmill
      nebo N8N, Harbor, LangChain či LangGraph JAK U NÁS PRACUJEME s AI nástroji jedeme
      naplno a denně (Claude, Codex, opencode s vlastními modely) funguješ samostatně
      a nebojíš se rychle rozhodnout máš chuť se doptávat a sám si rozjet PoC nebo
      prototyp na výsledný kód se neupínáš, počítáme s tím, že se řada věcí přepíše
      nebo smaže zajímá tě, jak věci fungují uvnitř, a chceš si ověřit reálný dopad,
      ne jen že to nějak běží CO MŮŽEŠ ČEKAT OD ARTINU žádný micromanagement, důvěra
      u nás není benefit, ale základ spolupráce otevřená komunikace a zpětná vazba,
      věci si říkáme napřímo a konstruktivně prostor ovlivnit směr řešení i způsob
      práce tým, který je zvyklý diskutovat věcně a hledat nejlepší řešení flexibilita
      a remote režim s občasným osobním setkáním Pokud tě baví PHP a zároveň chceš
      být u toho, jak si tým staví vlastní AI nástroje, ozvi se :).'
