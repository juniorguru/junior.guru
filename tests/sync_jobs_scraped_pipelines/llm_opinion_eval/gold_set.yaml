- name: st-161
  inputs:
    id: st-161
    title: Atlassian Solution Architekt
    text: 'Atlassian Solution Architekt: Architekt digitálního světa a byznysový partner
      našich klientů Hledáme k nám profíka, který nekouká jen na tickety, ale vidí
      za nimi živé lidi a jejich byznys. U nás nebudeš jen „klikat“ v Jiře – budeš
      tvůrcem prostředí, které firmám mění jejich fungování. Pomáháme našim zákazníkům
      sjednotit kulturu, procesy a nástroje tak, aby dosahovali lepších výsledků a
      týmové spolupráce. Jsme firma, kde si všichni tykáme, sázíme na autenticitu
      a dáváme lidem svobodu, která ale vyžaduje stejnou porci zodpovědnosti. O čem
      to u nás je? Design řešení a vize jeho dalšího rozvoje : Navrhování komplexní
      architektury na Atlassian platformě. Navrhování správné kombinace nástrojů pro
      pokrytí potřeb našich klientů, digitalizace a optimalizace jejich procesů, migrace
      Atlassian nástrojů a dat do Cloudu, nasazování AI agentů a automatizací na místa,
      kde to dává smysl. Budování vztahů : Na vztazích se zákazníky nám fakt záleží.
      Nebudeš schovaný za monitorem – budeš pro ně partnerem, kterému věří, se kterým
      si někteří i tykají a který jim rozumí. Svoboda v praxi : Pracujeme na principech
      svobodné firmy. Máš u nás obrovskou volnost v tom, jak si práci zorganizuješ,
      ale čekáme za to stoprocentní spolehlivost a tah na branku. Solution architekt
      u nás není jen běžný konzultant, všichni jsme zapojení i do další interní agendy.
      Nemáme šéfy, a tak je každý nápad třeba představit a shodnout se na jeho uvedení
      do praxe s kolegy. Řešíme tímto způsobem obchodní, strategická nebo finanční
      rozhodnutí, tedy od způsobů spolupráce s klienty až po mzdový systém, který
      je u nás zcela transparentní a otevřený. Ale to je na delší povídání - třeba
      při osobním setkání u nás v kanceláři v Brně nebo Praze? Jak bude vypadat tvůj
      běžný týden? Plánování společně s kolegy : pokud je pondělí, tak s celým týmem
      naplánujeme, co nás ten týden čeká. Pokud je úterý nebo čtvrtek, tak si předáváme
      své znalosti formou mentoringu a pomáháme si řešit různé situace, u klientů,
      sdílíme si hotová řešení. Setkání s klientem : pokud je běžný den, tak máš určitě
      několik schůzek nebo workshopů s našimi klienty. Buď řešíte to, v jaké fázi
      projektu se nacházíte, nebo se bavíte o dalších potřebách a směru spolupráce.
      Architektonický blok : pokud nejsi na schůzkách s klienty, tak pro ně připravuješ
      řešení - navrhuješ procesy, způsoby jejich digitalizace, využití správných nástrojů
      nebo dokumentuješ, co jste už společně udělali. Práce se systémy : v rámci práce
      pro klienty budeš v Atlassian nástroje nastavovat, vytvářet automatizace, testovat
      a hledat chyby. V některých případech môžeš dokonce pracovat se scripty. Research
      & Learning : Atlassian svět se mění pod rukama. Část dne můžeš věnovat i tomu,
      že se učíš novinky a zkoumáš, jak je využít v praxi. Konzultace s týmem : někdy
      i konzultant potřebuje poradit, a proto část svého pracovního času věnujeme
      svým kolegům a dáváme si druhý pohled na navržená řešení nebo brainstormujeme
      o řešeních a situacích, se kterými se potýkáme u klientů. Každý máme za sebou
      jiné projekty a tyto zkušenosti si sdílíme. Učíme se jeden od druhého. Jak si
      tě představujeme? Zodpovědnost máš v DNA : svoboda tě neděsí, ale motivuje.
      Víš, že tvoje práce má přímý dopad na klienta i na nás jako firmu. Samostatnost
      : nebojíš se nést zodpovědnost za projekty sám. Podporu a pomoc od kolegů určitě
      dostaneš. Máš otevřenou mysl : když narazíš na problém, nehledáš výmluvy proč
      to nejde, ale zkoušíš nové cesty a věci řešíš. Baví tě lidi : dokážeš si se
      zákazníkem vybudovat vztah založený na důvěře a otevřenosti. Chceš se posouvat
      : Chceš se posouvat dál a baví tě výzvy, které tě posouvají v osobním i profesním
      růstu. Jira ti není cizí : máš alespoň uživatelskou zkušenost s nástroji společnosti
      Atlassian (Jira, Confluence…). Nemusíš být programátor ani analytik, důležité
      je logické uvažování a chuť přemýšlet v souvislostech. Co u nás najdeš? Kulturu
      svobody : žádný micromanagement ani šéfové. Věříme ti a dáváme ti prostor, ale
      současně počítáme s tvou dospělostí a zodpovědností. Tykání a otevřenou atmosféru
      : neformální atmosféra u nás není jen fráze v inzerátu, opravdu ji žijeme. Projekty,
      co mají smysl : pomáháme firmám k efektivní a smysluplné spolupráci. Pokud tě
      zajímá, pro jaké zákazníky bys mohl/a pracovat, tak mrkni na naše reference
      . Sedí to na tebe? Tak se nám ozvi, rádi tě poznáme!'
