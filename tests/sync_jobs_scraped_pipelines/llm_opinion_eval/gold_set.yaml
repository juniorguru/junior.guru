- name: st-157
  inputs:
    id: st-157
    title: DevOps Engineer
    text: 'We are looking for DevOps Engineers of all skill levels who love to explore
      new technologies, optimize existing ones and share the knowledge along the way.
      At Custom Ink, we are building an e-commerce platform on which you are able
      to design and order custom printed swag, and the operations and supply chain
      tooling that powers our large printing facilities. We have millions of users,
      and more than a hundred applications running in AWS. This is a remote position;
      however, to be eligible for hire, candidates must reside within the Czech Republic,
      with in-office presence for onboarding. What will you do Engineer and optimize
      automated cloud infrastructure across multiple regions, ensuring high availability,
      security, cost efficiency, and PCI compliance. Build and maintain next-gen infrastructure
      for AI models and microservices using Docker, Kubernetes (EKS), Lambda, Kserve,
      and Knative. Develop, review, and refine software tooling and frameworks (primarily
      in Python and Go) to reduce deployment friction and enhance self-service capabilities
      for developers. Collaborate closely with global engineering ecosystems, maintaining
      regular regional working hours while occasionally syncing with international
      team members on major initiatives. Design, manage, and scale robust CI/CD pipelines
      to accelerate software delivery and testing automation. Participate in our on-call
      rotations and help actively resolve infrastructure incidents. What we’re looking
      for: 3–5 years of hands-on experience as a DevOps, Systems, or Site Reliability
      Engineer. Strong programming proficiency in Python, Go, or Ruby, with a proven
      track record of building internal tooling and contributing directly to application
      codebases beyond basic scripting. Core cloud expertise in AWS utilizing services
      such as EKS, RDS, Aurora, Lambda, and EC2 (AWS certification is a plus). Experience
      supporting AI/ML workloads, including hands-on exposure to modern open-source
      AI infrastructure components like Kserve, Knative, or vector databases. Experience
      deploying and managing AI agents using cloud frameworks such as the Google Agent
      Development Kit (ADK) or AWS Bedrock, with a focus on standardization, guardrailed
      development, and cost-effective infrastructure management. Solid Infrastructure
      as Code (IaC) experience managing environments using Terraform and AWS SAM.
      Practical understanding of a modern Kubernetes stack built on EKS and GitOps
      workflows using ArgoCD. Pipeline automation skills utilizing CircleCI, GitHub
      Actions, or custom CI/CD orchestration tools.Clear, confident communication
      skills, essential for working within the local team and syncing with international
      colleagues. Who this role isn''t for: Engineers who prefer a traditional, high-firefighting
      infrastructure setup over structured IaC and GitOps optimization. Siloed specialists
      who want to execute isolated infrastructure tasks rather than collaboratively
      partnering with development teams to optimize, containerize, and migrate microservices.
      What we offer Contractor Wellness: Multisport card and access to mental health
      wellness program with Soulmio Daily rate 5,400 Kč–6,200 Kč/day Flexible working
      hours and home office. Professional Development: Grow your career with access
      to training programs, English classes, certifications, and tuition assistance.
      Friendly Team Environment: A beautiful office in Karlín with a full fridge,
      amazing coffee, and an Xbox. Every Tuesday, company breakfast, occasional lunches
      and dinners, and regular team buildings (game nights). We support fully-remote
      work, but if you prefer coming into an office, that’s definitely an option.'
