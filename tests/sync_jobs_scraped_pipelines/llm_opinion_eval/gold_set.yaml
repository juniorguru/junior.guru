- name: jo-209
  inputs:
    id: jo-209
    title: Test manažer - digitální kanály a core – MOTYNA s.r.o.
    text: 'Pracovní nabídka Hledáme test manažera, který posune kvalitu našich služeb
      dále Digitální obsluha klientů a partnerů i naše core systémy stojí a padají
      na kvalitě. Proto hledáme test manažera, který nastaví metodiku testování, provede
      testováním business i IT uživatele a bude mít přehled o tom, jak daleko jsme.
      Hledáme někoho, kdo umí testování řídit i uchopit metodicky — a kdo si zároveň
      sám prošel praxí, takže občas rád sedne k tvorbě testovacích scénářů nebo si
      i sám otestuje. Umíš se nad testováním zamyslet strategicky, nastavit proces,
      provázet lidi napříč byznysem i IT — a zároveň se umíš dívat na věci v souvislostech.
      Na čem budeš pracovat Tvým hlavním hřištěm bude řízení a metodické nastavení
      testování napříč digitálními kanály i core systémy — portály, aplikace, samoobsluhy,
      partnerské integrace i backendové systémy, na kterých to všechno stojí. Nejde
      o testování zúžené na jednu technologii nebo vrstvu — jde o kvalitu napříč celým
      řešením. Konkrétně budeš: Nastavovat a rozvíjet metodiku testování — jak se
      u nás testuje, kdo za co odpovídá, jaké jsou standardy Provázet business a IT
      uživatele procesem testování — vysvětlovat, koordinovat, pomáhat jim najít se
      v roli testera Reportovat stav a postup testování směrem k vedení a stakeholderům
      — kde jsme, co nás brzdí, jaká jsou rizika Občas hands-on tvořit testovací scénáře
      a v případě potřeby i sám/sama testovat — zůstáváš v kontaktu s praxí, ne jen
      s tabulkami Koordinovat integrační a regresní testy, které pojedou v každém
      releasu Spolupracovat s vývojáři, analytiky a produkťáky tak, aby kvalita byla
      součástí návrhu, ne až dodatkem Co od tebe čekáme Hands-on zkušenost s testováním
      — prošel/prošla sis prakticky tvorbou testovacích scénářů a testováním, ne jen
      jejich řízením od stolu Zkušenost s nastavením nebo vedením testovací metodiky
      v rámci projektu nebo organizace Zkušenost s koordinací testování mezi business
      a IT stranou — umíš to lidem srozumitelně vysvětlit a provést je procesem Umíš
      reportovat stav testování tak, aby tomu rozuměli jak technici, tak vedení Rozumíš
      základním konceptům testování napříč vrstvami (API, UI, databáze, integrace)
      — nejde o hlubokou specializaci na jednu technologii Umíš si stát za názorem,
      ale taky uznat, že máš někdy chybu Česky nebo slovensky komunikuješ na úrovni
      rodilého mluvčího, anglicky se neztratíš v dokumentaci a občasné komunikaci
      Bonus, který nás potěší (ale není nutnost) Zkušenost s testováním API (Postman,
      SoapUI, Bruno) a orientace v SQL Zkušenost s digitální obsluhou klientů — portály,
      samoobsluhy, klientské zóny Znalost CI/CD a Gitu (Jenkins, GitLab CI, GitHub
      Actions) Zkušenost s test management nástroji (např. TestRail) a jejich zavedením
      ISTQB certifikace (ideálně Advanced Level) Nesplňuješ úplně všechno? Pošli životopis
      stejně. Pokud máš pevný testerský základ, chuť nastavovat proces a provázet
      lidi testováním, zbytek doženeš s námi. U nás se naučíš I když máš testování
      i řízení v malíku, vždycky je co posunout. U nás budeš mít prostor osahat si
      nástroje a postupy, na které jinde nemusíš narazit: Práci s JIRA — od plánování
      přes reporting až po napojení na další nástroje Práci s Kibanou a Splunkem —
      protože logy ti řeknou víc než stack trace TestRail (případně další nástroje
      pro správu testovacích scénářů) — jak v něm udržet pořádek a získat z něj smysluplná
      data Co u nás dostaneš Projekty s reálným dopadem — pracujeme na digitální obsluze
      klientů a partnerů pro velké hráče na trhu Moderní kanceláře v Praze-Karlíně
      s parádní dostupností na metru Hybridní režim — umíme pracovat z kanceláře i
      z domova Flexibilní pracovní dobu — důležitý je výsledek, ne čas strávený u
      monitoru 5 týdnů dovolené Stravenky a příspěvek na penzijní připojištění / DIP
      (myslíme i na tvoji budoucnost) Projektové odměny za odvedenou práci — když
      se daří projektu, daří se i tobě Notebook a firemní telefon — vybavení, se kterým
      je radost pracovat Týmové akce — od neformálních pivek po pořádný teambuilding
      Plat odpovídající tvým zkušenostem — domluvíme se na pohovoru férově Jak na
      to dál Pokud máš pocit, že tohle by mohla být tvoje hra, hoď nám životopis nebo
      LinkedIn zde na inzerát. Stačí pár vět o tom, na čem nejvíc makáš a kdy bys
      mohl/a začít — zbytek probereme spolu nad kávou v Karlíně. Nemáš životopis?
      Nevadí. Pošli odkaz na GitHub, portfolio nebo jen popsanou zkušenost. Zajímá
      nás, co umíš, ne jak vypadá tvoje CV.'
