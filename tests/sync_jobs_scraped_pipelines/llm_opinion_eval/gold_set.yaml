    title: Office Assistant/Recepční
    text: 'Jsme Livesport, stabilní česká společnost s globálním dosahem. Naše weby
      a aplikace jsou bránou do světa sportovních výsledků a zpravodajství pro více
      než 150 milionů fanoušků. Momentálně hledáme novou posilu našeho Back Office
      týmu, která bude pečovat nejen o bezproblémový chod naší recepce, ale taky o
      příjemnou atmosféru v celé firmě. Nabízíme spolupráci na HPP (full-time) a jako
      recepční tě potřebujeme onsite každý den. Co tě u nás čeká? Péče o recepci a
      návštěvy: Budeš prvním kontaktem pro naše hosty i kolegy. Správa zázemí: Odpovědnost
      za zasedačky, kuchyňky, doplňování zásob, objednávky (káva, občerstvení, kancelářské
      potřeby). Pošta a správa budovy: Zpracování zásilek, komunikace s kurýry a řešení
      drobných závad se správcem objektu. Spolupráce napříč firmou: Denní kontakt
      s kolegy a příležitost zapojit se i do projektů jiných týmů jako např. Finance,
      HR nebo Payment Operations. Eventy a organizace: Pomoc s přípravou interních
      akcí a organizačními úkoly. Bez čeho se neobejdeš? Praxe: Předchozí zkušenost
      na obdobné pozici (ideálně ve střední či větší firmě). Jazyky a komunikace:
      Čeština na úrovni rodilého mluvčího a angličtina minimálně B2 . Nástroje: znalost
      Google Workspace a chuť učit se nové věci. Osobnost: Organizovanost, smysl pro
      detail, diskrétnost, přirozený lidský přístup, baví tě dělat věci pro druhé.
      Co ti nabízíme? 👉Tvá práce bude mít viditelný dopad, recepce je místo, kde se
      lidé potkávají a také se utváří první dojem pro návštěvy. V tvých rukou bude
      udržovat přátelskou a profi atmosféru, která je Livesportu vlastní. 🎓Dostatek
      času na osobní růst a vzdělávání. 💰Roční bonus podle výsledků společnosti a
      mimořádné odměny. 💻Prvotřídní vybavení, od ergonomických pracovišť s výškově
      nastavitelnými stoly až po špičkový hardware. Samozřejmostí je také telefon
      a tarif s neomezenými daty. 🌿Kanceláře na Nových Butovicích s parkováním, dvěma
      fitky a relaxační zónou s fotbálkem nebo šipkami. Pracujeme v prostředí, které
      podporuje jak tvou profesionální, tak osobní pohodu. 🎉Několik akcí ročně - od
      meetupů, přes pravidelné sportovní turnaje každý měsíc, až po nezapomenutelné
      vánoční večírky, kde můžeš strávit čas s kolegy i mimo pracovní prostředí. 🍔Kredit
      do restaurace v naší budově, aby sis mohl/a vychutnat vynikající jídlo v pohodě
      a bez starostí. 🌴Samozřejmostí je bonus za doporučení kolegy a 25 dnů dovolené.
      Zní to jako práce pro tebe? V tom případě na nic nečekej, pošli nám CV a my
      se ti ozveme. Těšíme se na tebe! Anita (Head of Procurement and Payment) a Jitka
      (Talent Acquisition Partner)'
