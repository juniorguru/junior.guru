- name: jo-284
  inputs:
    id: jo-284
    title: PPC specialista / Datový analytik (junior) – myTimi s.r.o.
    text: 'Pracovní nabídka Baví tě PPC, ale nechceš zůstat jen u správy kampaní?
      Přemýšlíš analyticky a radši si věci ověříš v datech, než abys střílel/a od
      boku? Láká tě více proniknout do měření, práce s daty, automatizace a AI? 👉
      Pak by ti tahle role mohla sednout. Do našeho týmu digitálního marketingu hledáme
      PPC specialistu s analytickým a technickým přesahem. Na začátku se zapojíš hlavně
      do klasické práce na PPC kampaních. Postupně přejdeš i na webovou analytiku,
      měření, práci s daty a pokročilejší nástroje, takže nezůstaneš jen u nastavování
      a optimalizace reklam. Nemusíš k nám přijít jako hotový datový analytik. Potřebujeme
      ale člověka, kterého baví čísla, technické věci a přemýšlení nad tím, proč kampaně
      fungují právě tak, jak fungují – a jestli máme správná data, podle kterých se
      rozhodujeme. 🌍 Kdo jsme my, myTimi? Digitální agentura myTimi je partnerem pro
      podnikatele a investory, kteří chtějí, aby jejich firma rostla rychle a efektivně.
      Pomáháme jim růst díky digitálnímu marketingu, obchodu, zákaznické péči a dalším
      službám. V marketingovém týmu se staráme o kampaně a výkonnostní marketing pro
      různé klienty – od menších firem až po značky jako Alaskan Fisherman, ISIC,
      Copy General nebo Farma Živina. Díky tomu nebudeš celý rok řešit jeden e-shop
      nebo jeden typ kampaní. Dostaneš se k různým businessům, datům i problémům,
      které je potřeba vyřešit. 💻 Co Tě u nás čeká? Na začátku se zapojíš do běžné
      PPC agendy: správa kampaní v Google Ads, Meta Ads, Skliku a dalších systémech,
      průběžné vyhodnocování výkonu kampaní, práce s Google Analytics a dalšími nástroji,
      analýza klíčových slov, tvorba reklamních textů a zadání pro bannery, příprava
      podkladů a reportů pro klienty, hledání cest, jak kampaně průběžně zlepšovat.
      📊 V čem postupně získáš expertizu? Analytická část role bude ze začátku menší,
      ale postupně se v ní můžeš profilovat čím dál víc. Naučíš se například: nastavovat
      měření přes Google Tag Manager – GA4 i konverze pro Google Ads, Meta Ads a další
      systémy, analyzovat výkonnost v GA4 a reklamních systémech a hledat v datech
      odpovědi, vytvářet reporting a vizualizace dat a postupně navrhovat vlastní
      řešení, implementovat cookie lišty a Consent Mode v2, pracovat se server-side
      trackingem a serverovým GTM, pracovat s daty v BigQuery a dalších pokročilejších
      nástrojích, využívat automatizace a AI nástroje reálně v provozu. Analytiku
      a měření navíc nebudeš řešit jen pro svoje kampaně. Postupně se můžeš stát člověkem,
      který je bude řešit pro celé oddělení výkonnostního marketingu. 🧠 Co bys měl/a
      splňovat? Znáš základy PPC reklamy vč. nástrojů – máš alespoň roční zkušenost
      s PPC nebo online kurz Dobře ovládáš Excel Neděsí tě slova analýza a reporting,
      nemáš problém se zorientovat v číslech Baví tě technické věci a máš chuť se
      je učit. Přemýšlíš analyticky – jsi pečlivý/á, dotahuješ detaily a než něco
      odhadneš, radši si to ověříš v datech. 🙌 Proč pracovat u nás? Vstřícnost a flexibilita.
      Není problém domluvit se na flexibilní pracovní době, volnu a podobně. Díky
      tomu můžeš práci skvěle skloubit s rodinou, koníčky nebo třeba studiem. Pohodová
      komunikace. Otevřeně komunikujeme s klienty i kolegy. Pokud něco uděláš špatně,
      štve tě klient, něco nechápeš nebo s něčím nesouhlasíš, vždycky to můžeš říct.
      Přesah do dalších oborů. Můžeš se zaměřovat na to, co tě baví. Pokud tě zajímá
      například marketing, není problém domluvit se s kolegy z reklamy a přijít na
      jejich školení. Postupně tak získáš svou unikátní specializaci. Vzdělávání.
      U nás budeš mít možnost posouvat se. Můžeš chodit na jakákoli interní školení
      v rámci firmy a na externí školení dostaneš příspěvek. Školíme se například
      v marketingu, procesním řízení nebo projektovém managementu. Super tým. Je s
      námi sranda! Pravidelně chodíme na teambuildingy, jako je laser game, virtuální
      realita nebo svítící minigolf. Jednou za čas pořádáme firemní snídaně a občas
      zajdeme po práci na pivo. Káva, ovoce a snacky v kanceláři 🤝 Jak bude probíhat
      výběrové řízení? Nejdříve ti ozve Iva, naše HR manažerka. Pobavíte se spolu
      o tobě (o tvém životopisu, motivaci a zkušenostech) i o nás (o tom, jak zhruba
      práce probíhá a co ti za ni můžeme nabídnout). Cílem je zjistit, jestli je mezi
      námi shoda. :) V druhém kole si popovídáš se svým potenciálním přímým nadřízeným
      Dominikem. Tu už budou zajímat tvé konkrétní dovednosti i to, jestli povahově
      zapadneš do týmu. Popíše ti, jak přesně bude tvoje práce vypadat, a odpoví ti
      na všechny otázky. Pokud všechno klapne, můžeš hned nastoupit!'
