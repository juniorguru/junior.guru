- name: st-092
  inputs:
    id: st-092
    title: Digital designer (UX/UI)
    text: 'Rozšiřujeme design tým v Yolk! V Yolk už více než 10 let navrhujeme a stavíme
      digitální produkty, weby a značky, které dnes používají stovky tisíc lidí po
      celém světě. Pracujeme pro klienty z Londýna, Dubaje, Kanady i USA a díky novým
      projektům rozšiřujeme náš seniorní design tým. Hledáme designéra, který má ambici
      dělat výjimečnou digitální práci. Člověka, kterého pořád baví craft, detail,
      typografie, interakce, pohyb, vizuální systém a hledání nápadu, který z obyčejného
      zadání udělá silný digitální zážitek. Nechceme jen dalšího člověka do produkce.
      Hledáme kolegu, který se chce posouvat, přemýšlet, tvořit, zkoušet nové nástroje
      a dělat weby, aplikace a digitální produkty, za kterými si bude moct stát .
      Ideálně někoho, kdo sleduje špičkový digitální design, chápe úroveň práce oceněné
      na Awwwards, ale zároveň ví, že dobrý design není jen efekt. Musí mít nápad,
      funkci, systém a perfektní provedení. Na čem budeš pracovat Budeš navrhovat
      digitální produkty od prvních konceptů až po finální detaily. Weby, aplikace,
      produktové rozhraní, vizuální systémy, interakce, mikroanimace a kampaně, které
      mají ambici být víc než jen dobře vypadající obrazovky. Nebudeš na to sám .
      K dispozici budeš mít další designéry, 3D grafiky, animátory, AI asset creatory,
      vývojáře a lidi, kteří ti pomůžou posunout nápad do opravdu silné podoby. Věříme,
      že nejlepší digitální práce dnes vzniká kombinací dobrého designového myšlení,
      řemesla, technologie, pohybu, 3D, AI a precizního exekutivního týmu. Konkrétně
      budeš: navrhovat digitální produkty od prvních konceptů až po finální detaily
      určovat vizuální směr projektů a posouvat jejich celkovou kvalitu tvořit weby,
      aplikace, produktová rozhraní a digitální kampaně pracovat s typografií, layoutem,
      interakcemi, mikroanimacemi a vizuálními systémy tvořit a rozvíjet komplexní
      design systémy ve Figmě spolupracovat s dalšími designéry, 3D grafiky, animátory,
      AI asset creatory i vývojovým týmem hledat vizuální metafory, silné koncepty
      a nápady, které projektu dají charakter podílet se na produktech, které používají
      lidé po celém světě má silný vizuální cit a cit pro současný digitální design
      rozumí UX, produktovému myšlení a tomu, že skvělý design musí nejen dobře vypadat,
      ale i fungovat dokáže převzít zodpovědnost za vizuální kvalitu projektu má rád
      detail, typografii, interakce, mikroanimace a craft, ale neztrácí se v maličkostech
      umí přemýšlet v systémech, design systémech a škálovatelných řešeních dokáže
      hledat momenty, které z dobrého projektu udělají zapamatovatelný digitální zážitek
      ovládá Figmu na vysoké úrovni a zvládá komplexnější design systémy má chuť hledat
      nové cesty místo opakování šablon a bezpečných řešení sleduje špičkový digitální
      design, nové nástroje, Awwwards, technologie, AI a vizuální trendy má v sobě
      vnitřní tah, ambici růst a potřebu dělat práci, která je lepší než včera dokáže
      pracovat samostatně, ale zároveň funguje dobře v týmu bere feedback jako přirozenou
      součást procesu, ne jako útok na ego chce být součástí interního týmu, který
      spolu pravidelně diskutuje, hledá řešení a posouvá věci do posledního detailu
      Jak pracujeme Náš proces je hodně založený na pravidelné spolupráci, zpětné
      vazbě a společném posouvání návrhů. Nejlepší nápady často vznikají při debatách
      nad rozpracovanými obrazovkami, při rychlém testování variant a při společném
      hledání detailu, který celý projekt zvedne. Proto hledáme člověka, který s námi
      bude pracovat interně . Tato pozice není vhodná pro freelance spolupráci ani
      hybridní model. Potřebujeme někoho, kdo bude součástí týmu, bude s námi přemýšlet
      každý den a bude přirozeně zapojený do procesu, který stojí na osobním kontaktu,
      rychlé výměně názorů a společném craftu. Nepoužíváme univerzální šablony ani
      generické vizuály. Vizuály, 3D prvky, ilustrace, animace a další assety tvoříme
      interně. Chceme dělat práci, která má vlastní výraz, nápad a kvalitu. Zároveň
      se snažíme využívat nové nástroje, AI workflow a moderní procesy tak, aby nám
      pomáhaly tvořit rychleji, chytřeji a ve vyšší kvalitě. Co je pro nás důležité
      Chceme se společně vzdělávat a posouvat. Sledujeme digitální design, hledáme
      inspiraci mimo běžné zdroje, chodíme do muzeí, na výstavy, na designové výlety
      a snažíme se do práce dostávat širší kulturní i vizuální kontext. Hledáme k
      sobě kolegu s ambicí. Někoho, kdo nechce jen odbavit další projekt, ale chce
      být součástí studia, které má chuť dělat výjimečné weby, aplikace a digitální
      produkty pro klienty po celém světě. Pokud tě pořád baví craft, máš rád digitální
      design na vysoké úrovni a chceš tvořit v týmu, který má podobné nároky, rádi
      tě poznáme.'
