- name: st-163
  inputs:
    id: st-163
    title: RevOps and Sales Transformation Lead
    text: 'RevOps and Sales Transformation Lead We are a Czech scale-up that developed
      its own produc t a few years ago - a platform connecting merchants with banks
      and their clients. If Rewards from Air Bank or Moneyback from Česká spořitelna
      sound familiar to you, then that''s us. But we haven''t been limited to the
      Czech Republic for a long time -thanks to satisfied banks that recommended us,
      today we cooperate with Slovak, Romanian, Hungarian, Austrian, Croatian and
      German banks. And we definitely don''t stop there. What will be your mission?
      We are looking for a professional to help us transform our processes and how
      do we operate in the AI era. This is not about classic support or boring datasheets;
      You will therefore experience something rare in RevOps: you will see the whole
      commercial operating system, not just one part of it. You will design and implement
      the operating system of our next-generation Sales organization. The processes
      you design will be used by Sales teams across seven countries. So everyone,
      including you, will see the impact of your work immediately. How does our team
      work? You won’t work in a silo. You’ll be a connector across Sales × Data ×
      BI × Product × Offer Management × AI, working directly with the leaders responsible
      for these areas — and across seven countries. You’ll move between strategy and
      execution: one day working with the CCO on the Sales operating model, the next
      helping a team turn a new process into something that actually works How do
      you fit in? You can work with ambiguity and change and know how to bring structure
      where there is no established playbook. You have a strong problem-solving and
      analytical mindset and naturally challenge the way things are done. You are
      a connector and a clear communicator, comfortable working across teams, functions,
      and countries. You have a strong bias towards action — you like building, testing
      and implementing, not just analyzing and recommending. You are curious about
      AI and new technologies , but pragmatic about where they can create real business
      impact. You take ownership and are comfortable driving things forward without
      needing everything to be defined for you. How do we imagine you? 3+ years of
      relevant experience in Project/ Process management, Sales Operations, RevOps,
      Business Transformation , or a similar role. Proven experience delivering change
      across teams or functions , turning business challenges into practical solutions
      and implementing them successfully. Hands-on experience managing and improving
      data-driven Sales processes , at least with some of the following topics: pipeline
      management, forecasting, qualification frameworks, sales stages, CRM, KPIs,
      dashboards, performance metrics and management cadence. Understanding of B2B
      Sales and Account Management, including how commercial teams operate, collaborate
      and scale. Experience working with senior stakeholders and C-level leaders ,
      with the confidence to challenge, influence and align them. Fluent English ;
      experience working across multiple countries and cultures is a strong advantage.
      What do we offer? Flexible working hours and occasional work from home are a
      given. Office in Anděl, Prague (with terrace, shower and bike room), so everything
      important is nearby. Pet-friendly office - Your canine companion can come with
      you. Regular events with colleagues, Multisport card, darts in the office, 25
      days of vacation, 3 sick days,... Opportunity to be part of a successful company
      that is on the verge of a decent international expansion (we have been ranked
      in the Deloitte Fast50 ranking of the fastest-growing companies 2 times in a
      row). What is ahead of you? Process is fast: All applications will be carefully
      read Initial call with Vojta for 30 min, AI will help with notes Online meeting
      with Ondřej Vychodil and Vojta Case Study Final round in our Prague office We
      will check references Offer What are you waiting for? Let''s talk! 👋 Odesláním
      své odpovědi na naší nabídku pracovní pozice se odešlou všechny informace, které
      jste přidali výše, společnosti Dateio. Než to uděláte, myslíme si, že je dobré
      si přečíst naše Zásady ochrany osobních údajů . Zde je vysvětleno, co děláme
      s vašimi osobními údaji, když se u nás ucházíte o pracovní pozice, a jak můžete
      aktualizovat informace, které jste nám poskytli, nebo jak je odstranit.'
