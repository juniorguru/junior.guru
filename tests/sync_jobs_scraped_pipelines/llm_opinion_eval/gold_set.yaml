- name: st-091
  inputs:
    id: st-091
    title: Digital Marketing & Content Manager
    text: 'Alaskan Fisherman · Praha · plný úvazek Ahoy! Jsme Alaskani. Lovíme divoké
      ryby na Aljašce a přivážíme je až k českým zákazníkům domů. Už jsme tu jasná
      jednička, a přitom teprve začínáme. Stavíme prémiovou DTC značku divokých ryb,
      která má potenciál a ambici uspět globálně. Naši zakladatelé jsou Češi a centrálu
      máme v Praze. Rozhoduje se tady, ne v zahraniční matce. Takže každý den reálně
      ovlivníš, kam se Alaskan Fisherman posune a jak jako značka uspějeme. Naše kultura
      stojí na senioritě, pružnosti a rychlosti. Tým držíme záměrně malý a agilní,
      protože takový zvládá rychlé tempo změn i vysoké nároky na delivery. AI u nás
      není buzzword, ale každodenní pracovní nástroj. Jestli v práci rád(a) hledáš
      výzvy, rychlý kariérní růst a reálný dopad své práce – tohle je příležitost
      pro tebe. Stručný popis pozice Hledáme seniorního marketingového manažera, který
      převezme řízení celého našeho kreativního enginu – od plánování přes tvorbu
      až po nasazení kampaní a obsahu, především v digitálních kanálech. Budeš koordinovat
      malý interní tým (Influencer & UGC specialista, Content & Community specialista)
      a řídit spolupráci s externími partnery – grafikem, kreativní agenturou, produkcí,
      střihačem... Obsah budeš plánovat, vymýšlet, koordinovat a podle své expertízy
      i spoluvytvářet, zejména pro tyto kanály: Meta Ads, organický obsah na Instagramu
      a Facebooku, web včetně performance microsites, UGC a influenceři, e-mailing
      a YouTube. Reportoval bys přímo Country Managerovi s marketingovým/CMO backgroundem.
      Co konkrétně budeš dělat Plánovat kampaňový a obsahový kalendář napříč všemi
      digitálními kanály (zejména Meta ads, web, mailing, Instagram, Facebook, YouTube...)
      a hlídat jeho plnění. Denně zadávat, koordinovat a schvalovat práci interního
      týmu i externích dodavatelů. Řídit produkci kreativy pro performance i brandové
      kampaně – video, statika, UGC, copy. Podle své expertízy se hands-on zapojit
      do tvorby nebo nasazení obsahu na konkrétních kanálech. Držet konzistenci značky
      a kvalitu výstupů ve všech kanálech. Aktivně zapojovat AI do plánování, tvorby
      i produkce obsahu. Požadavky na pozici Must-have Seniorní zkušenost v digitálním
      marketingu B2C/D2C e-commerce značky – ideálně s lifestyle přesahem a velkým
      objemem digitálních výstupů. Prokazatelná zkušenost s koordinací marketingových
      projektů a komplexních multikanálových kampaní. Zkušenost s řízením interního
      týmu i externích dodavatelů (agentury, produkce, freelanceři) v dynamickém prostředí.
      Silná strukturovanost a organizační schopnosti – udržíš si přehled nad několika
      souběžně běžícími projekty a nad desítkami rozpracovaných výstupů. Pozitivní
      vztah k AI – už dnes ti šetří hodiny práce každý den. Výborná čeština – budeš
      s pomocí AI tvořit, připomínkovat a schvalovat texty, které jdou přímo k zákazníkům.
      Nice-to-have Zkušenost z agenturního prostředí. Hlubší expertíza v některé z
      kreativních oblastí (e-mailing, social media, web, produkce, grafika, video...)
      a schopnost práce s příslušnými nástroji jako Adobe Creative Cloud, Figma, Canva...
      Zkušenost se subscription modelem nebo retenčním marketingem. Co nabízíme Full-time
      spolupráci na HPP/IČO. 25 dní placeného volna ročně. Převážně onsite model spolupráce
      v kancelářích na náměstí Republiky v Praze. Budování a škálování D2C subscription
      značky s prémiovým produktem, ve které je marketing motorem byznysu, ne nákladem.
      Budeš se učit více a rychleji než v zavedené firmě, kde je marketing jen položka
      v rozpočtu. Zkušenost, kterou v Česku těžko získáte: subscription model, prémiový
      potravinový produkt a full-funnel digitál v jednom. Hands-on role s reálným
      dopadem – výsledky svých rozhodnutí uvidíte v číslech za týden, ne za rok. Zajímavé
      finanční ohodnocení odpovídající seniornímu profilu pozice.'
