- name: jo-293
  inputs:
    id: jo-293
    title: Medior/Senior Tester – Unicorn
    text: 'Pracovní nabídka Kvalitní testování začíná dávno před spuštěním prvního
      testu. Proto hledáme zkušené testery a testerky, kteří dokážou porozumět business
      i technickým požadavkům, navrhnout efektivní testovací strategii a propojit
      manuální i automatizované testování. Budeš se podílet na vývoji rozsáhlých podnikových
      aplikací napříč různými obory. Čeká tě spolupráce s vývojáři, analytiky i architekty,
      návrh testovacích scénářů, automatizace testů a hledání způsobů, jak dlouhodobě
      zvyšovat kvalitu softwaru i testovacích procesů. Jestli tě baví hledat souvislosti,
      přemýšlet nad kvalitou už při návrhu řešení a automatizaci bereš jako přirozenou
      součást testování, rádi se s tebou potkáme. Co si jako Tester vezmeš na starost?
      analýzu business i technických požadavků z pohledu testování návrh (případně
      spolupráci na tvorbě) testovací strategie a testovacích scénářů automatizaci
      testů pro frontend, backend i API integraci automatizovaných testů do CI/CD
      pipeline ověřování kvality aplikací pomocí unit, integračních, regresních i
      end-to-end testů manuální testování tam, kde přináší největší přínos spolupráci
      s vývojáři, analytiky i dalšími členy projektového týmu identifikaci rizik a
      hledání příčin potíží rozvoj testovacích postupů a automatizace na projektech
      podle zaměření projektu také výkonové nebo bezpečnostní testování Na této pozici
      využiješ: 3-5 let zkušeností se softwarovým testováním praxi s test analýzou
      i automatizací zkušenosti s některým z frameworků Selenium, Cypress nebo Playwright
      znalost API testování v Postmanu, Rest Assured nebo SoapUI orientaci v CI/CD
      a práci s Gitem zkušenosti s agilním vývojem schopnost navrhnout testovací scénáře
      podle business požadavků analytické myšlení a chuť hledat souvislosti Výhodou
      pro tebe bude, pokud máš: zkušenosti s Dockerem, Kubernetes nebo microservices
      zkušenosti v performance testování znalost prostředí bankovnictví, energetiky,
      logistiky nebo automotive Nemusíš znát všechno. Důležitější než konkrétní technologie
      je schopnost navrhnout kvalitní testování, vybrat vhodný přístup a hledat řešení,
      která mají dlouhodobou hodnotu. Které plusy ti u nás usnadní a zpříjemní život?
      příspěvek na dovolenou v Chorvatsku, Řecku nebo na českých horách finanční příspěvek
      pro novomanžele, vouchery na studium kurzů Red Monster pro děti výhodný datový
      tarif +4U Mobile pro tebe a tvé blízké tradiční plusy: 5 dnů rekondičního volna
      navíc ke 4 týdnům dovolené, MultiSport karta, stravování, penzijní připojištění
      a další Přidej se k nám a začni působit na projektech, které jsou smysluplné
      pro tvou kariéru i svět kolem tebe. Pošli nám CV nebo odkaz na svůj LinkedIn
      profil. Rádi se dozvíme, co už máš za sebou a ukážeme ti, co můžeš s námi ještě
      dokázat.'
