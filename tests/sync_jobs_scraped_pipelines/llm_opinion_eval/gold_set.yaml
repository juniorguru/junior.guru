- name: st-127
  inputs:
    id: st-127
    title: Vývojář/ka vlastní tradingové aplikace — AMPower (Karlín, Praha)
    text: '120 000 – 350 000 Kč/měsíc fix + jsi součástí bonusového poolu. Plně on-site
      — Karlín, žádný home office. Nehledáme dalšího vývojáře do týmu, kde architekturu
      vymyslel někdo jinej před pěti lety a ty jen doplňuješ tikety. Hledáme člověka,
      co postaví vlastní tradingovou aplikaci od nuly — vlastní návrh, vlastní zodpovědnost.
      A uvidí, jak ji tým používá k obchodování hned další den. Kdo jsme AMPOWER je
      malá, rychle rostoucí tradingová firma z Karlína, co se živí krátkodobým obchodováním
      s elektřinou — day-ahead a intraday trhy, evropský energetický mix, spousta
      dat a žádná trpělivost na byrokracii. Jsme kolektiv, tým, ne aparát: rozhodujeme
      rychle, mluvíme na rovinu a chyby řešíme tím, že se z nich poučíme, ne nekonečnými
      poradami. Co budeš dělat Navrhovat a stavět architekturu naší vlastní tradingové
      aplikace od základů — žádný cizí legacy kód, žádné “na tohle se nesmí sahat”.
      Vyvíjet nástroje pro obchodování v reálném čase: napojení na trhy a burzy, zpracování
      tržních dat, pozice, riziko, P&L. Rozhodovat o tech stacku, nástrojích a procesech
      — je to tvoje hřiště a tvoje zodpovědnost. Pracovat agentně — řídit AI coding
      agenty (Claude Code a podobné) jako součást každodenního vývoje, ne je jen občas
      vyzkoušet. Sedět s tradery, kteří tvůj nástroj používají — feedback je okamžitý,
      ne přes tři vrstvy product manažerů. Koho hledáme Musíš mít: Zkušenost s vývojem
      tradingových nebo jinak na reálný čas a spolehlivost náročných aplikací (obchodní
      systémy, market data, risk/PnL, napojení na burzy či brokery). Schopnost navrhnout
      architekturu systému sám od sebe — ne jen implementovat zadání, ale umět říct,
      jak by to mělo být postavené a proč. Reálnou zkušenost s agentic programováním
      — AI coding agenty používáš cíleně a efektivně, ne jen jako našeptávač. Solidní
      inženýrský základ: čistý kód, testování, přemýšlení o spolehlivosti systému,
      do kterého teče živý obchodní provoz. Bude výhodou: Zkušenost s energetickými
      nebo finančními trhy, jejich daty a specifiky (latence, přesnost, časové řady).
      Zkušenost se stavěním interních nástrojů od nuly v malém týmu, ne jen údržba
      existujícího systému. Co u nás nefunguje: čekání na zadání a schválení, než
      uděláš krok. Tenhle job je pro lidi, co chtějí rozhodovat, ne jen exekuovat.
      Co ti nabízíme 120 000 – 350 000 Kč/měsíc fix + podíl z bonusového poolu firmy.
      Přímý dopad hned teď. Nestavíš demo pro investory — stavíš nástroj, na kterém
      se obchoduje ten samej den. Skutečné ownership. Architektura, tech stack, priority
      — rozhoduješ ty, ne výbor. Malý kolektiv, kde tě znají jménem. Není nás moc,
      takže tvoje práce je vidět — a je i oceněná. Žádná zbytečná byrokracie. Ploché
      řízení, rychlá rozhodnutí, minimum schvalování. Plně on-site v Karlíně. Tým,
      se kterým se dá být v pohodě i po páté odpolední — ne avataři na Zoomu. Jak
      to bude probíhat Pošli CV / profil, odkaz na to, co jsi stavěl (GitHub, portfolio,
      cokoliv), a pár vět o tom, proč tě baví agentic programování. Technický rozhovor
      o architektuře a rozhodnutích na konkrétním projektu, co jsi dělal. Pohovor
      s týmem, se kterým budeš reálně sedět v kanceláři. Žádný nekonečný kolečka s
      HR, kde nikdy nikoho nepotkáš. Rozhodujeme rychle. Zaujalo tě to? Přihlas se
      přes StartupJobs. Těšíme se, co umíš.'
