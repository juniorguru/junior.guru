      klienty zvučných jmen, které nebudeš smět nikdy a nikomu prozradit? Rozproudila
      se Tvá hackerská DNA, když tohle čteš? Tak čti dál a pozoruj co to s Tebou dělá.
      Každý rok se podílíme na stovkách projektů napříč Evropou. Jen v loňském roce
      jsme dokončili 628 zakázek a identifikovali 3293 zranitelností v regionech:
