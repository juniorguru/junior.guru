- name: st-160
  inputs:
    id: st-160
    title: IT Business Analytik – Staň se mostem mezi IT a investičním světem! 🚀
    text: IT a investice jsou IN! 🔥 V CTS TRADE IT tvoříme unikátní software, který
      pomáhá největším bankám a finančním institucím v ČR a v Evropě řídit investice
      do fondů, obchodování s akciemi a správu portfolií. Naším cílem je stát se leaderem
      v regionu a přinášet chytrá řešení, která formují budoucnost investičního bankovnictví.
      A právě teď hledáme IT Business Analytika, který nám s tím pomůže. Chceš pracovat
      na projektech, které mají reálný dopad? Čekají tě projekty v oblasti kapitálových
      trhů, obchodování s akciemi, správy investičních portfolií a další inovativních
      řešení, které pomáhají formovat moderní investiční nástroje. 💡 Ať už jsi junior
      nebo zkušený analytik, u nás dostaneš prostor růst. Pokud tě lákají technologické
      inovace a investičního bankovnictví, přidej se k nám a buď součástí projektů,
      které hýbou světem investic. 🟢 Co tě u nás čeká? 👉 Budeš u významných projektů
      Zapojíš se do vývoje kritických softwarových řešení pro bankovní i nebankovní
      finanční instituce v ČR i Evropě. Budeš mít možnost ovlivnit, jak se tyto systémy
      navrhují, vyvíjejí a implementují. 👉 Propojíš byznys a IT svět Tvým úkolem bude
      analyzovat business požadavky a navrhovat efektivní řešení. Budeš spolupracovat
      se zkušenými specialisty v tomto zajímavém oboru a budeš se spolupodílet na
      tom, že výsledek odpovídá potřebám klienta. 👉 Inovace v oblasti investic Budeš
      součástí týmu, který přináší inovativní softwarová řešení pro svět investičního
      bankovnictví. Čekají tě projekty týkající se zejména obchodování s akciemi,
      investic do fondů, správy portfolií a dalších finančních produktů. 🟢 Co potřebujeme?
      💡 Hledáme IT Business analytika, který umí spojit technický pohled s byznysovým
      uvažováním. Nezáleží, jestli jsi na začátku kariéry, nebo už máš zkušenosti
      – důležité je, že chceš posouvat věci vpřed. ✅ Analytické myšlení – umíš se
      ponořit do detailu, ale zároveň vidět širší souvislosti. ✅ Znalost principů
      relačních databází – SQL ti není cizí. ✅ Schopnost komunikace – budeš propojením
      mezi byznysem a IT, takže musíš umět efektivně vyjednávat a formulovat požadavky.
      ✅ Samostatnost a zodpovědnost – řešíš problémy a hledáš efektivní cesty, jak
      věci posunout dál. ✅ Proaktivní přístup a smysl pro odpovědnost – umíš převzít
      iniciativu a postarat se o to, aby se věci skutečně posouvaly dopředu. ✅ Angličtina
      na komunikativní úrovni – budeš se občas setkávat i se zahraničními klienty.
      ✅ VŠ vzdělání v oblasti IT, ekonomie nebo technických oborů – pomůže ti lépe
      porozumět komplexním systémům, se kterými pracujeme. 🟢 A proč pracovat s námi?
      👉 Tým, který tě podpoří od prvního dne Od začátku se můžeš spolehnout na podporu
      zkušenějších kolegů, kteří tě provedou našimi procesy i analýzou. Nečekáme,
      že budeš vědět všechno hned, a proto ti pomůžeme rychle se zorientovat. Sdílíme
      znalosti, radíme si a hledáme nejlepší řešení společně. 💡 A nejen v práci! Po
      práci spolu třeba zajdeme i na pivo 🍻, pořádáme teambuildingy 🎯, každoročně
      běháme Pražskou štafetu a mnoho dalšího. Máme skvělou partu, se kterou tě bude
      práce bavit. 👉 Možnost růstu a specializace Business analýza u nás není jen
      o psaní dokumentace – naučíš se porozumět procesům investičního bankovnictví,
      obchodování s akciemi a správě portfolií. Postupně se můžeš stát expertem na
      danou oblast. 🚀 👉 Práce, která dává smysl Nebudeš jen analyzovat požadavky –
      budeš ovlivňovat, jak fungují klíčové finanční systémy, které denně používají
      největší banky ve střední Evropě. Tvoje analýzy pomohou utvářet moderní řešení
      v oblasti investic. 📊 👉 Kanceláře, kde se budeš cítit dobře Naše kanceláře hned
      u metra Budějovická mají nejen skvělý výhled na Prahu, ale i relaxační místnost,
      fotbálek, šipky a čerstvou kávu – protože všichni potřebují palivo. ☕ 👉 Benefity,
      které mají smysl Kromě 5 týdnů dovolené ti nabídneme například MultiSport kartu,
      občerstvení na pracovišti, výuku angličtiny s rodilým mluvčím, příspěvek na
      penzijní a životní připojištění/DIP a také možnost online psychoterapie. Víme,
      že spokojený a odpočatý člověk podává nejlepší výkon. 🎯 Jsi připraven/a propojit
      IT s investicemi? Pošli nám CV a zastav se na kávu – rádi ti ukážeme, jak pracujeme.
      😉
