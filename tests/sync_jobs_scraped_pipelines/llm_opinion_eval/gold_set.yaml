- name: st-010
  inputs:
    id: st-010
    title: .NET Developer/ka
    text: '🌍 Do naší české pobočky ve Zlíně nebo v Brně. 📅Klidně ihned, na plný úvazek.
      🧠Zkušenosti s .NET vývojem, angličtina. Do našeho týmu hledáme .NET vývojáře
      nebo vývojářku s chutí pracovat na úspěšných a smysluplných interních produktech.
      U nás nebudeš jen psát kód - zapojíš se do návrhu funkcionalit, hledání nejlepších
      technických cest a sdílení nápadů v týmu. Baví tě čistý kód, přemýšlení nad
      architekturou a chuť učit se nové věci? Pak si s námi sedneš. Fungujeme agilně,
      vyvíjíme služby v cloudovém prostředí a backend stavíme v C#. Každý nápad se
      počítá. Přidáš se se svými nápady k nám? Kdo jsme? Jsme norsko-česká společnost
      Papirfly (dříve BrandMaster). Spolu s více jak 200 zaměstnanci po celém světě
      vyvíjíme inovativní nástroje pro digitalizaci marketingu a pomáháme s efektivní
      správou značky firmám jako BMW, Helly Hansen, PepsiCo a více než 1.500 dalším.
      Každý den používá naše nástroje přes milion marketérů a designérů. Od roku 2022
      je majoritním vlastníkem Papirfly největší evropský technologický fond Verdane,
      který ze své pozice dále podporuje globální růst společnosti. Stále tak potřebujeme
      další chytré a kreativní hlavy, které nám pomůžou dobýt svět. 😊 Jak poznáš,
      že je Papirfly pro tebe to pravé? .NET prostředí ti není cizí - se C# už máš
      zkušenosti alespoň dva roky a baví tě se v něm zlepšovat. Máš cit pro čistý
      kód, technické myšlení a chuť hledat chytrá řešení. Umíš spolupracovat s týmem,
      sdílet nápady a nebojíš se zeptat, když si nevíš rady. Dokážeš mluvit „jazykem
      vývojářů“, ale rozumíš i tomu, co potřebuje business. Domluvíš se anglicky.
      Angličtinu využiješ každý den - ať už při komunikaci v týmu, nebo při čtení
      dokumentace. Tohle je náš stack, se kterým budeš pracovat (není podmínkou znát
      všechno): Backend: .NET (C#), Typescript/Node.js, SQL, Redis. Cloud & DevOps:
      AWS (Lambda, DynamoDB, S3, API Gateway, CloudWatch, Docker, SAM. Nástroje: Rider
      / Visual Studio, Bitbucket, Bitbucket Pipelines, unit testing. Poznal/a ses?
      Pak si přečti, co ti u nás nabídneme: Práci na HPP v kancelářích v centru Brna
      nebo v Zlíně. Férové finanční ohodnocení a příjemné čtvrtletní prémie k tomu.
      Zázemí stabilní mezinárodní firmy, která vytváří smysluplné nástroje pro světoznámé
      klienty. 25 dní dovolené a 2 sick days. Možnost občasné práce z domova (ale
      převažuje u nás práce z kanceláře). Spolupráci na velkých projektech, a pokud
      se chytneš příležitosti, můžeš růst v rámci skupiny. Otevřené jednání a pohodovou
      atmosféru v přátelském kolektivu. Počítač nebo notebook (Windows, Linux nebo
      Mac) a veškeré další vybavení, které pro práci potřebuješ. Přispějeme ti na
      obědy, na sport i dovolenou, nabídneme ti teplé kafe a studené freshe, čerstvé
      ovoce a pozveme tě na naše legendární grilovačky. Líbí? To máme radost! Co dál?
      Dej nám o sobě vědět! Pošli nám prosím, svoje CV / odkaz na LinkedIn profil.
      Budeme se těšit na naše první společné kafe či čaj. 😊'
