- name: st-113
  inputs:
    id: st-113
    title: Fullstack Developer (Java + React)
    text: 'Chceš stavět něco nového, co zjednoduší práci autosalonů po celé Evropě?
      Přidej se k nám a posuň přípravu a předání aut na další úroveň! Tvoříme platformu
      Dealer Digital Assistant, kterou používá 1400+ autosalonů v 17 zemích a která
      digitalizuje cestu vozu od příjmu z výroby až po předání zákazníkovi. Vyvíjíme
      ji pro našeho klíčového klienta – významnou evropskou automobilku. Aktuálně
      budujeme modul aftersales za použití moderní PWA v ReScriptu, řešíme offline
      režim, rychlejší synchronizaci, intuitivnější UX a nové funkcionality pro uživatele.
      Na tenhle vývoj za podpory AI toolingu (SDD) hledáme právě tebe! Hledáme Fullstack
      vývojáře/vývojářku, jako posilu do desetičlenného týmu, který vede náš kolega
      Michal ( https://www.linkedin.com/in/gajdicka/ ). 🛠️ Co budeš dělat stavět a
      rozvíjet nové moduly Příjem → Příprava vozu → Předání s live dashboardem pro
      techniky přímo v dílně i na výstavní ploše vyvíjet frontend v ReScriptu/Reactu
      i backendové služby v Javě a Spring WebFlux (REST API, business logika, integrace)
      – kompletní vertikální vývoj funkcí navrhovat datový model a pracovat s PostgreSQL
      (reaktivně přes R2DBC) úzce komunikovat s produktovými vlastníky a technickými
      leadery na straně automobilky digitalizovat checklisty, fotodokumentaci škod
      a PDF reporty nasazovat a provozovat služby na GCP / Kubernetes přes CI/CD ladit
      offline režim, PWA performance a rychlou synchronizaci dat pro uživatele pomáhat
      zkrátit čas techniků strávený ručním zadáváním z dnů na hodiny díky datově řízeným
      experimentům 🎯 Co od tebe očekáváme Hard skills – frontend (jádro role): TypeScript
      / ReScript a React (hooks, context) znalost SPA, PWA, HTML + CSS (Flexbox /
      Grid) základní funkcionální programování a test-driven mindset Hard skills –
      backend Java a Spring Boot / Spring WebFlux – psaní REST API a služeb práce
      s relační databází (PostgreSQL, ideálně reaktivně přes R2DBC) základní přehled
      o GCP a Kubernetes je výhoda, ne podmínka Jazyky: čeština/slovenština C1, angličtina
      B2 Plusové body: Material UI, reaktivní programování (Project Reactor), zkušenost
      s CI/CD. Soft skills: Samostatnost – umíš si nastavit směr a jít si za ním.
      Analytické myšlení – rozumíš kontextu, dokážeš propojovat body. Komunikační
      dovednosti – zvládneš argumentovat, naslouchat i vést diskuzi. Pozitivní myšlení.
      Týmový hráč – rád sdílíš know-how, přispíváš ke zdravé atmosféře. 🎁 Co nabízíme
      spolupráci na HPP nebo IČO dle preferencí možnost dlouhodobé práce na zajímavém
      projektu s moderními technologiemi dlouhodobou a férovou spolupráci přátelský
      tým a otevřenou komunikaci pravidelná týmová setkání několikrát do měsíce v
      IBC Florenc možnost hybridní / remote spolupráce 🎁 Kromě toho máme celou řadu
      zaměstnaneckých benefitů: 25 dní dovolené 3 sick days během roku 6 dní školení
      ročně Půlroční bonusy Multisport karta s příspěvkem zaměstnavatele Příspěvek
      na penzijní nebo životní pojištění (2 000 Kč/měsíc) Stravenkový paušál Zvýhodněné
      tarify od Vodafone Firemní akce a teambuildingy Firemní permanentka do ZOO Praha
      ‍ Zaujala tě tato příležitost? Pošli nám své CV. Rádi ti představíme tým, technologie
      i projekty, na kterých budeš pracovat.'
