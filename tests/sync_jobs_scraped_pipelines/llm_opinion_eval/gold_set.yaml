    title: Ochránce a správce firemního IT | Infrastructure & Security Engineer
    text: 'V PATRON-IT přebíráme odpovědnost za kybernetickou bezpečnost firem. Jejich
      IT prostředí nastavujeme a zabezpečujeme tak, abychom předcházeli útokům, a
      průběžně ho monitorujeme, abychom případné hrozby dokázali včas odhalit. Pomáháme
      také firmám, které se na nás obrátí ve chvíli, kdy je zasáhne kybernetický útok.
      Řešíme bezpečnostní incidenty, pomáháme obnovit provoz a napadené prostředí
      znovu zabezpečit. Do našeho týmu nyní hledáme dalšího člověka se zkušenostmi
      s IT infrastrukturou nebo kybernetickou bezpečností , který se bude věnovat
      správě a zabezpečení IT prostředí našich zákazníků . Pokud tě láká i práce na
      bezpečnostních incidentech, můžeš se zapojit také do incident response . Co
      budeš dělat Budeš pracovat v týmu s kolegou Filipem, který se zákazníkem dohodne
      požadovaný výsledek, rozsah a časovou náročnost zakázky. Na tobě pak bude technická
      realizace a komunikace potřebných detailů s interním IT zákazníka . To znamená
      samostatně navrhnout vhodný postup, posoudit technické dopady a rizika, řešení
      realizovat, ověřit výsledek a vše potřebné zdokumentovat. U složitějších nebo
      rizikovějších rozhodnutí budeš mít k dispozici Filipa i další specialisty napříč
      firmou , se kterými můžeš řešení konzultovat. Zakázky budou obvykle v rozsahu
      několika hodin až nižších desítek hodin . Typická náplň tvé práce: realizace
      bezpečnostních opatření a menších infrastrukturních projektů nasazení nebo úpravy
      serverů zavádění bezpečnostních opatření v Microsoft Entra ID a Microsoft 365
      revize a úpravy Active Directory a GPO troubleshooting problémů eskalovaných
      od zákazníků bezpečné nasazování nových informačních systémů dokumentace provedené
      práce a evidence času hledání možností, jak zlepšit nebo automatizovat naše
      technické postupy testování a zavádění nových technologií a bezpečnostních opatření
      S čím pracujeme Technologický stack držíme záměrně užší, abychom technologiím,
      které používáme, rozuměli opravdu do hloubky. Nejčastěji u nás narazíš na: Microsoft
      infrastruktura: Active Directory, Windows Server, Windows 10/11, Hyper-V Microsoft
      cloud a security: Microsoft 365, Entra ID, Exchange, SharePoint, Teams, OneDrive,
      Intune, Defender, Azure Fortinet: FortiGate, FortiSwitch, FortiAP, FortiAnalyzer,
      Forti EMS Další technologie: ESET, Veeam AI nástroje: ChatGPT, Microsoft Copilot,
      Codex Koho hledáme Pro tuto pozici potřebuješ: alespoň 5 let praxe v oblasti
      IT infrastruktury nebo kybernetické bezpečnosti, z toho alespoň 2 roky v MSP
      nebo MSSP společnosti praktickou zkušenost s technologiemi Windows Server, Active
      Directory, Group Policy, Microsoft 365 a Entra ID zkušenost s počítačovými sítěmi
      a jejich zabezpečením schopnost samostatně řešit technické problémy a poznat,
      kdy je potřeba řešení konzultovat schopnost domýšlet dopady a rizika technických
      změn schopnost poradit si i s problémem, který řešíš poprvé, dohledat potřebné
      informace, ověřit je a použít v praxi iniciativu při zjednodušování a automatizaci
      opakující se práce schopnost využívat AI při hledání řešení a analýze, ověřovat
      její výstupy a bezpečně pracovat s důvěrnými informacemi schopnost převzít technickou
      realizaci zakázky od návrhu vhodného postupu až po ověření výsledku schopnost
      věcně komunikovat se zákazníky skutečný zájem o IT a kybernetickou bezpečnost,
      chuť průběžně se učit a držet krok s oborem Výhodou je: zkušenost s technologiemi
      Fortinet/FortiGate, Hyper-V, VMware, Microsoft Defender, ESET nebo Linux angličtina
      pro pracovní komunikaci řidičský průkaz skupiny B Co nabízíme 70 000 – 80 000
      Kč měsíčně Konkrétní nástupní mzda se odvíjí od tvých zkušeností, znalostí a
      míry samostatnosti. Mzdu pravidelně valorizujeme. K tomu můžeš získat finanční
