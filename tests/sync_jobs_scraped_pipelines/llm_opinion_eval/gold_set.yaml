  inputs:
    id: st-100
    title: Junior Project Manager ve Viole - expanduj do Evropy s digitální platformou
      🧓🏻
    text: Ahoj! Přemýšlel/a jsi už někdy nad vlastní firmou? Nebo si chceš vyzkoušet,
      jaké to je pracovat ve startupu, který je na začátku, ale pořádně rychle roste?
      Nedávno jsi dokončil/a VŠ nebo ji právě dokončuješ a už máš čas pracovat na
      full-time? V prosinci 2024 jsme spustili technologický startup a věci se daly
      do pohybu mnohem rychleji, než jsme čekali. Během krátké doby jsme se rozrostli
      z 5 na 16 lidí a z Prahy expandovali do Brna, Bratislavy a Košic. Tím ale nekončíme,
      protože už v srpnu spouštíme další evropskou zemi a na dalších již pracujeme.
      Že jdeme správným směrem, nám potvrdil i postup do finále soutěže Nápad roku
      , kde jsme se probojovali zatím do TOP 10 z celkových 189 projektů a jsme taky
      v TOP 5 Cen SDGs 2026 . Startupový portál Vestbee nás pak zařadil mezi top 100
      CEE startupů , které teď sledovat. Právě teď jsme ve fázi dynamického růstu,
      kdy se vytvářejí klíčové role, a ty máš ideální příležitost být u toho a reálně
      ovlivnit, kam se jako projekt posuneme dál 💥 👀 Co bys o nás ještě měl/a vědět?
      Nespustili jsme jen tak ledajakou firmu, ale startup, který usiluje o revoluci
      v přístupu seniorů ke kvalitní péči pomocí digitalizace. A to nejen v Česku
      a na Slovensku, ale rovnou i v dalších evropských státech. Máme na to kopec
      zkušeností, včetně budování jednoho z nejúspěšnějších evropských startupů od
      úplných začátků. Hned po spuštění jsme překonali naše úvodní cíle a ověřili
      jsme si velmi rychle, že poptávka po tom, co děláme tady určitě je a můžeme
      spouštět další země i na dálku. 👨‍💻 Co budeš dělat? Nalijme si čistého vína
      🍷, budeš tak trochu holka nebo kluk pro všechno. Jsme zkrátka stále v začátcích
      a potřebujeme pomoct hned v několika oblastech. O to víc zkušeností a znalostí
      ale získáš! Co konkrétně ti svěříme? Pomůžeš s onboardingem platformových pracovníků
      a poradíš jim se vším, co bude potřeba 👥 Komunikace s rodinami seniorů, kterým
      pomůžeš s vyřízením objednávek 📞 Pomůžeš našemu týmu formovat strategii, a to
      nejen pro Česko a Slovensko, ale i pro expanzi do dalších evropských zemí, které
      jsou již za rohem 🌍 Budeme chtít slyšet i ty nejšílenější nápady na to, jak
      dělat marketing a shánět zákazníky i platformové pracovníky. Fantazii se meze
      nekladou 🙌 Budeš pomáhat při průzkumu trhu při vstupu do dalších zemí – konkurence,
      legislativa, ceny… zkrátka vše, co potřebujeme vědět 🔍 🎯 Co od tebe potřebujeme?
      Ochotu pustit se do náročných výzev a nebát se chaosu, který startupy často
      provází 🔄 Skvělé komunikační schopnosti v češtině/slovenštině a angličtině nebo
      němčině 🗣️ Analytické myšlení – a schopnost rozhodnutí podložit daty 📊 Základní
      zkušenosti s marketingem jsou plusem 💻 40 hodin týdně ⏳ - takže ideálně pokud
      jsi zrovna dokončil(a) vejšku nebo jen dopisuješ diplomku Smysl pro humor –
      u nás ho budeš občas potřebovat 😄 💡 Co ti nabízíme? Plné zapojení do našeho
      týmu, kde se budeš každý den učit něco nového 🎓 Možnost budovat byznys od začátku
      a naučit se to, co je opravdu důležité💡 44 000 Kč měsíčně a zkušenosti k nezaplacení
      💸 Příjemné kanceláře na Smíchově 🏢 Sdílení zkušeností, které jsme nasbírali
      v největších evropských startupech i korporátech 🌍 📩 Chceš se k nám přidat?
      Paráda! Ozvi se nám. Těšíme se na tebe!
