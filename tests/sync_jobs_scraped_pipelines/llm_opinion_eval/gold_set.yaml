- name: st-043
  inputs:
    id: st-043
    title: Business Development Manager Siesta AI
    text: 'Chceš se během pár let naučit business rychleji než za deset let v korporátu?
      Jsme Siesta AI: český AI startup využívaný v celé Evropě. Vyvíjíme vlastní platformu
      pro firemní využití AI a pracujeme v oblastech jako energetika, automobilový
      průmysl, logistice, aerospace nebo realitách a to jak v Česku tak i zahraničí.
      Řešíme s nimi, jak umělou inteligenci reálně dostat do jejich dat, procesů a
      každodenní práce. A hledáme někoho na začátku kariéry, kdo chce růst společně
      s námi. Od prvních týdnů budeš sedět na jednáních s managementem velkých firem,
      připravovat AI use cases, nabídky a analýzy a pracovat přímo s vedením Siesta
      AI. Ze začátku bude vedle tebe vždy někdo zkušenější. Postupně ale chceme, abys
      přebíral/a větší část klientské komunikace, obchodních jednání a nakonec i vlastní
      příležitosti. Nehledáme člověka, který chce dalších pět let dělat juniorní support.
      Hledáme někoho, kdo chce být u budování firmy ve chvíli, kdy je pořád dost malá
      na to, aby mohl mít reálný vliv - a zároveň už řeší skutečný business a enterprise
      zákazníky. Co budeš dělat Každý klient je jiný. Jiný business, jiný problém,
      jiná data a jiné možnosti využití AI. Nebudeš proto dokola prodávat stejný produkt
      podle jednoho sales scriptu. Budeš například: připravovat research firem, jejich
      businessu a lidí, se kterými jednáme společně s týmem hledat konkrétní AI use
      cases a přemýšlet, kde klientovi dokážeme vytvořit největší hodnotu připravovat
      prezentace, nabídky, analýzy a další materiály pro konkrétní klienty účastnit
      se obchodních meetingů, workshopů a prezentací a postupně na nich aktivně vystupovat
      komunikovat s klienty mezi jednotlivými meetingy a pomáhat posouvat obchodní
      příležitosti dopředu Jednou budeš před meetingem studovat fungování výrobní
      firmy. Podruhé řešit konkrétní AI use case. Potřetí připravovat enterprise nabídku
      nebo prezentaci pro management. AI pro tebe musí být normální pracovní nástroj
      Jsme AI firma. Takže nechceme člověka, kterému budeme vysvětlovat, proč je užitečný
      ChatGPT nebo Claude. Nemusíš programovat. Nemusíš stavět vlastní agenty ani
      automatizovat půl internetu. Ale očekáváme, že už dnes AI reálně používáš. Když
      dostaneš firmu, o které nic nevíš, přirozeně tě napadne použít AI pro research.
      Když máš před sebou desítky stran podkladů, nebudeš je dvě hodiny ručně pročítat
      bez pomoci. Když připravuješ prezentaci nebo analýzu, víš, jak si pomocí AI
      urychlit první draft, strukturovat informace nebo zkontrolovat vlastní myšlení.
      AI pro nás není benefit ani buzzword. Je to běžná součást práce. Koho hledáme
      Ideálně někoho krátce po vysoké škole nebo s prvními 1-3 lety pracovních zkušeností.
      Nemusíš mít perfektní CV ani několik let zkušeností přímo v sales. Mnohem víc
      nás zajímá, jestli: jsi chytrý/á, rychle se učíš a dokážeš si věci samostatně
      zjistit dokážeš rychle pochopit nový business nebo problém umíš dobře mluvit
      i psát a zvládneš strukturovat svoje myšlenky dokážeš připravit kvalitní prezentaci
      nebo analýzu působíš profesionálně a nebude pro tebe problém sedět na meetingu
      s managementem velké firmy máš přirozený zájem o business, technologie a AI
      používáš nástroje jako ChatGPT nebo Claude při reálné práci nebo studiu dotahuješ
      věci a nepotřebuješ deset připomínek máš ambici růst rychleji, než umožňuje
      klasická juniorní kariérní cesta Předchozí zkušenost s obchodem, consultingem,
      startupem nebo prací s klienty je výhoda. Není to ale podmínka. Potenciál, drive
      a schopnost rychle se učit jsou pro nás důležitější než perfektní LinkedIn.
      Proč Siesta AI Nechceme stavět další malý AI tool. Chceme vybudovat firmu, která
      pomůže velkým společnostem skutečně dostat AI do každodenního fungování - bezpečně,
      prakticky a ve velkém. A jsme pořád ve fázi, kdy jeden schopný člověk může mít
      na výsledek firmy reálný dopad. To znamená: přímý kontakt s vedením firmy minimum
      vrstev managementu přístup k reálným klientům a obchodním rozhodnutím možnost
      vidět zblízka, jak se staví a prodává AI produkt rychle rostoucí odpovědnost
      prostor ovlivnit, jak bude tvoje role za rok nebo dva vypadat Pokud hledáš prostředí,
      kde dostaneš přesně definovaný seznam úkolů a dalších pět let budeš postupovat
      po předem připraveném kariérním žebříčku, pravděpodobně ti nebudeme sedět. Pokud
      chceš být u firmy dřív, než je všechno hotové a obvious, může to být přesně
      pro tebe. Co nabízíme full-time práci přímo v AI startupu přímou spolupráci
      s vedením společnosti kontakt s velkými českými i zahraničními klienty možnost
      naučit se enterprise business development přímo v praxi rychlý profesní růst
      podle výsledků a převzaté odpovědnosti mladý tým a minimum korporátního bullshitování
      středeční společné obědy pet-friendly kancelář zvýhodněnou Multisportku možnost
      pobytů v našem penzionu v Jizerských horách kancelář na Bruselské 14 na Vinohradech
      Prakticky Úvazek: full-time Místo: on-site, Praha, s možností HO Odměna: podle
      zkušeností a schopností 350-500 Kč/hodina Forma spolupráce: IČO nebo jiná domluvená
      forma Nástup: dle dohody - ideálně co nejdříve Chceš do toho jít? Pošli mi CV
      a pár vět o sobě. Jsem Honza, COO firmy a rád se s tebou potkám. Co mě zajímá:
      Proč tě láká kombinace businessu, technologií a AI? Jak dnes používáš ChatGPT,
      Claude nebo jiné AI nástroje při práci nebo studiu?'
