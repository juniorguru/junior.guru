    title: IT specialist - systems administration and internal development with AI
      (part-time)
    text: 'LDparks je pražský developer retail parků. Nemáme vlastní IT oddělení:
      Microsoft 365, automatizace, webový portál pro technické oddělení, interní znalostní
      báze a elektronický podpis vznikly prací jednoho člověka s AI asistenty a běží
      v provozu. Na částečný úvazek hledáme někoho, kdo tuto agendu převezme a bude
      ji dál rozvíjet. Náplň práce Správa Microsoft 365 a Entra ID: uživatelé, práva
      a skupiny, schránky, sdílené složky SharePoint, Teams, licence, servisní účty
      automatizací. Správa Google Workspace, firemních předplatných AI nástrojů a
      elektronického podpisu Software602 Sofa. Domény a hosting včetně DNS a obnov,
      zálohy, obnova provozu po výpadku. Počítače a kancelářská technika: nákup a
      výběr konfigurace, evidence včetně sériových čísel a záruk, kontrola stavu,
      příprava pracovního místa novému kolegovi, servis tisku a spotřební materiál.
      Údržba a rozvoj automatizací: Power Automate, Office Scripts, skripty pro tabulky,
      přenosy dat mezi systémy. Tvorba interních řešení s AI asistenty (Claude Code
      a podobné): interní aplikace a portály pro oddělení od zadání po nasazení, weby
      firmy a projektů, 3D vizualizace objektů z výkresů. Vedení dokumentace nastavení
      a přístupů. První linie podpory kolegů v digitálních nástrojích. Požadujeme
      Praxi se správou Microsoft 365 a Entra ID v reálném provozu. Zkušenost s automatizací,
      která běžela v ostrém provozu: Power Automate, Office Scripts, Python nebo JavaScript.
      Praxi s AI asistenty při psaní kódu a porozumění tomu, co výsledný kód dělá.
      Základní orientaci ve webovém vývoji: JS/TS, nasazení, git. Ruštinu aktivně,
      zadávání úkolů a interní komunikace probíhají rusky. Angličtinu na pracovní
      úrovni, čeština výhodou. Samostatnost a zodpovědný přístup k přístupům a datům,
      pozice získává administrátorská práva. Nabízíme Částečný úvazek, práce převážně
      remote, s dostupností v pracovní době. Licence na pracovní nástroje včetně AI
      asistentů hradí firma. Volnou ruku ve volbě technického řešení. Formu spolupráce
      dle dohody: HPP nebo IČO. Nástup dle dohody.'
