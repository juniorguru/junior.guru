- name: st-042
  inputs:
    id: st-042
    title: Data Governance Consultant pro rostoucí scale-up 🚀
    text: 'Dawiso je inovativní platforma, která pomáhá organizacím lépe pracovat
      s vlastními daty pomocí datového katalogu, business glosáře, interaktivního
      data lineage i AI Context Layer. Hledáme posilu do našeho Customer Success týmu
      , která naše zákazníky provede celou cestou úspěšné implementace: od onboardingu
      přes úspěšné zavedení platformy až po efektivní využití a dlouhodobou spolupráci.
      Co bude tvojí náplní práce? Provedeš nové zákazníky onboardingem a pomůžeš jim
      začít platformu co nejrychleji efektivně využívat. Budeš konzultovat jejich
      potřeby, rozumět jejich procesům a společně s nimi hledat nejlepší způsob, jak
      je může Dawiso podpořit. Převádět požadavky a zpětnou vazbu od zákazníků do
      konkrétních návrhů na zlepšení produktu ve spolupráci s UX/UI designéry, architekty
      a vývojáři. Zapojíš se i do pre-sales aktivit – připravíš prezentace, proof
      of concept (PoC) nebo ukázkové scénáře nad daty potenciálních zákazníků. Staneš
      se hlavním kontaktem pro zákazníky – pokud budou mít dotazy, narazí na problém
      nebo budou hledat nové možnosti, jak z platformy vytěžit maximum. Budeš spoluvytvářet
      onboardingové materiály, nápovědu i obsah pro Dawiso Academy a průběžně zlepšovat
      to, co zákazníkům pomůže platformu lépe pochopit a používat. Co od tebe očekáváme?
      Máš skvělé komunikační schopnosti a umíš přizpůsobit způsob vysvětlování různým
      typům lidí – od business uživatelů až po technické specialisty. Máš velký technický
      přehled – orientuješ se v databázích, SQL, JSON a umíš pracovat s daty tak,
      abys pochopil(a), kde je problém. AI nástroje jsou pro tebe běžnou součástí
      práce. Máš zkušenosti s prostředím AI agentů a používáš nástroje jako Claude
      nebo Codex. Jsi orientovaný(á) na výsledek . Záleží ti na tom, aby zákazníci
      byli úspěšní, a aktivně hledáš způsoby, jak jim pomoci jejich cílů dosáhnout.
      Přemýšlíš analyticky – dokážeš sledovat metriky adopce a úspěšnosti a převádět
      je do konkrétních návrhů na zlepšení. Domluvíš se plynně anglicky a zvládneš
      komunikaci se zahraničními zákazníky. Vyhovuje ti dynamické startupové prostředí,
      kde nejsou role striktně vymezené a priority se mohou rychle měnit. Co nabízíme?
      Otevřenou kulturu menší firmy, kde jsou tvoje nápady vítané a nezapadnou v davu
      Práci s reálným dopadem, kdy máš možnost ovlivnit jakým směrem se produkt a
      způsob spolupráce se zákazníky dál vyvíjí Flexibilní pracovní dobu a hybridní
      režim docházky do našich nových kanceláří v Karlíně 25 dní dovolené, 3 sick
      days, Multisport kartu, výhodný telefonní tarif a pravidelné společné akce'
