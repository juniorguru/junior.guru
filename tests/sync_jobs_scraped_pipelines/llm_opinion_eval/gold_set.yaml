    title: Specialista/specialistka informačního šetření – Národní úřad pro kybernetickou
      a informační bezpečnost
    text: 'Pracovní nabídka Pracovní pozice spadá pod Oddělení informačního šetření
      Baví Vás online investigace a techniky vytěžování otevřených zdrojů (OSINT)?
      Jste organizovaní a máte chuť se neustále zdokonalovat a vzdělávat? Chcete pomáhat
      zajišťovat kybernetickou bezpečnost České republiky analytickou prácí? Potom
      hledáme právě vás! „Naše oddělení poskytuje analytickou a informační podporu
      řadě klíčovým organizačním celkům NÚKIB a vytváří analytické materiály pro rozhodující
      činitele a organizace v české státní správě i v zahraničí. Náplní Vaší práce
      bude vytěžování otevřených zdrojů pomocí specializovaných analytických nástrojů
      a tvorba bezpečnostně-ekonomických analýz týkajících se veřejných zakázek.“
      – vedoucí oddělení strategických informací a analýz Co bude vaší hlavní pracovní
      náplní: vyhledávání, zpracovávání a analýza informací z otevřených zdrojů z
      oblasti kybernetické bezpečnosti, tvorba bezpečnostně-ekonomických analýz; průběžný
      monitoring dění v oblasti veřejných zakázek a kybernetické bezpečnosti státu,
      aktivní spolupráce s dalšími organizačními celky NÚKIB, administrativní podpora
      bezpečnostně-analytických procesů. Požadujeme: vysokoškolské vzdělání (magisterský
      stupeň výhodou), analytické a kontextuální myšlení – schopnost analyzovat a
      vyhodnocovat informace, schopnost uchopit komplexní témata, formulovat závěry,
      implikace a doporučení, zvýšený zájem o oblast ICT a kybernetickou bezpečnost
      výbornou znalost českého jazyka slovem i písmem, anglický jazyk na úrovni B2
      CEFR (nadprůměrná písemná i ústní komunikace), dobré komunikační a prezentační
      schopnosti, smysl pro pořádek, systematičnost a velmi dobré organizační schopnosti,
      samostatnost a iniciativnost, schopnost pracovat samostatně i v týmu, ochotu
      učit se novým věcem. Výhodou: zkušenost v oblasti kybernetické bezpečnosti,
      zkušenost s analytickými nástroji (např. Power-Bi, Maltego). studijní nebo pracovní
      zkušenosti ze zahraničí. Nabízíme: kreativní a perspektivní práci v zázemí stabilní
      a respektované instituce, s možností seberealizace, možnost dalšího vzdělávání
      a osobního i profesního růstu, metodické vedení, pružnou pracovní dobu, po zapracování
      možnost občasné práce z domu, 25 dní dovolené plus možnost čerpání 6 dní sick
      days v rámci kalendářního roku, stravenkový paušál, firemní notebook a mobilní
      telefon, jazykové kurzy přímo na pracovišti, FKSP (příspěvek na stravování,
      příspěvek na produkty spoření na stáří), možnost čerpání výhod z kolektivní
      smlouvy, a spoustu dalších benefitů. Zaměstnanci NÚKIB nespadají pod služební
