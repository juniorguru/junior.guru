- name: st-030
  inputs:
    id: st-030
    title: BE vývojář (Java/Kotlin) - Stream Karty
    text: 'Partners Banka je prostředí, kde se bankovní doména potkává s moderním
      vývojem, AI a možností věci reálně ovlivnit. Nejsme klasický korporát, kde se
      jen posouvají dokumenty mezi týmy. Chceme dodávat kvalitní řešení, která dávají
      smysl businessu, klientům i lidem, kteří je vyvíjejí a provozují. Fungujeme
      otevřeně, věcně a s respektem. Problémy neschováváme pod koberec, ale pojmenováváme
      je a řešíme. Máme jasný cíl: dodat to, co slíbíme, a zároveň budovat prostředí,
      ve kterém se lidem dobře pracuje. Vyvíjíme v Kotlinu na Micronaut frameworku.
      Naše aplikace jsou napsané ve stylu reaktivního programování, ale díky Kotlinu
      přehledné. Ctíme Clean Architecture, Contract first přístupy a dbáme na zpětnou
      kompatibilitu. Běžíme na Kubernetes a snažíme se, aby naše aplikace správně
      fungovaly v cloudu. Nasazujeme několikrát za den, většinou bez nutnosti odstávky.
      Něco o našem teamu: Jsme jedna parta, umíme se spolu zasmát a hlavně, nebojíme
      se zodpovědnosti. Jsme otevření novým nápadům s důrazem na architekturu a efektivitu
      procesů. V bance se staráme o karty - vytváření, placení, lifecycle karty, Apple/Google
      Pay. Aktuálně jsme ke kartám přibrali zprostředkování Kryptoměn. Nestaráme se
      pouze o karty a krypto, ale také úzce spolupracujeme s dalšími vývojovými týmy
      a s naším backoffice. Vše co vyvineme, také sami spravujeme v produkci v pracovní
      době. To prostřednictvím nástrojů jako je Grafana a Dynatrace. Hledáme vývojáře
      a nadšence, který: Má chuť se podílet na technologickém řešení moderní banky
      v cloudu. Je teamovým hráčem: zvládá kompromis a bere ohledy na realitu a kolegy,
      dokáže naslouchat a disponuje sebereflexí. Je komunikativní a příjemný, nebojí
      se navazovat vztahy s ostatními teamy. Dokáže strategicky přemýšlet a proměnit
      vizi v konkrétní řešení. Je samostatný, zodpovědný a proaktivní. Požadavky na
      pozici: Komerční praxe s vývojem BE v Java/Kotlin s použitím frameworku Spring
      Boot/Micronaut/podobné. Vědět, co obnáší nasazování do produkčního prostředí
      a jeho popdora. Zkušenost s mikroslužbami, RESTem, messagingem a databázemi
      (ORM, DB migrace a SQL). Znalost Dockeru, CI/CD, sémantického verzování, API
      dokumentace (OpenAPI/Swagger). Dokázat psát Unit a integrační testy. Docházka
      do kanceláře 3 dny v týdnu. Otevřená a upřímná komunikace. Znalost bankovního
      prostředí výhodou. Nebát se používat AI. (Využíváme vlastní AI řešení integrované
      s našimi interními systémy, které vývojářům pomáhá zvyšovat efektivitu a pracovat
      chytřeji. Kromě toho získáš placený GitHub Copilot, který budeš naplno využívat
      jako podporu při každodenním vývoji.) Naše technologie: Kotlin (BE) Micronaut
      framework Liquibase, PostgreSQL Rabbit MQ AWS, OCI, GCP Helm, Kubernetes, ArgoCD
      Výběrové řízení: telefonát s Petrou Hradilíkovou (HR), abychom zjistili, jestli
      pro obě strany dává smysl ve výběrovém řízení pokračovat (15min) teams rozhovor
      s Petrou a BE leaderem (30-45min) bootcamp (1 den práce na “zkoušku” v PBK Technology
      - tento den slouží primárně k tomu, abychom se vzájemně poznali, budeš mít možnost
      prohlédnout si budoucí působiště, seznámit se s kolegy z týmu a vypracovat technické
      zadání) Pokud si vzájemně sedneme, po bootcampu ladíme nabídku.'
