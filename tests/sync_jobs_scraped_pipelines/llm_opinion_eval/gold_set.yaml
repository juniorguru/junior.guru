    title: Head of Accounting
    text: 'FABINI je česká značka prémiového nádobí, která kombinuje kvalitní produkt,
      silný design a nadstandardní zákaznickou péči. Na trhu jsme něco přes 6 let
      a zlepšujeme vaření více než 250 tisícům zákazníků. Naším cílem je přinést kvalitní
      nádobí do každé kuchyně, dál pokračovat v nastartovaném téměř dvojnásobném každoročním
      růstu a věříme, že rok 2026 nás dostane přes půl miliardy obratu. Abychom zvládli
      další růst společnosti, posilujeme finanční tým a hledáme zkušeného člověka
      na pozici Head of Accounting , který převezme odpovědnost za kompletní účetnictví
      FABINI, vedení účetního týmu a správné nastavení účetních procesů. Čeká nás
      další růst, nové prodejní kanály i rozvoj ERP Odoo, a proto hledáme někoho,
      kdo účetnictví nejen spolehlivě zastřeší, ale bude ho s námi dál posouvat. Na
      čem bys u nás mohl/a spolupracovat: Odpovědnost za správnost, úplnost a kvalitu
      účetnictví společnosti Vedení a metodické zastřešení interního účetního týmu
      Řízení měsíčních, kvartálních a ročních účetních závěrek a odpovědnost za jejich
      správnost a včasnost Zastřešení DPH, OSS, DPPO a dalších daňových oblastí včetně
      spolupráce s externími daňovými poradci Řešení komplexnějších účetních a daňových
      případů a nastavování správného účetního postupu Příprava účetních výkazů a
      podkladů pro audit, daňové poradce a další externí partnery Nastavování a rozvoj
      účetních metodik, procesů a interních kontrol Sledování změn v české účetní
      a daňové legislativě a jejich zavádění do praxe Spolupráce s controllingem na
      měsíčním reportingu a správnosti finančních dat Spolupráce na rozvoji ERP Odoo,
      automatizaci účetních procesů a správném toku dat mezi systémy Metodické zastřešení
      účetních témat spojených s e-commerce, zahraničními trhy, zásobami, importem
      zboží a retailem Úzká spolupráce s CFO na dalším rozvoji účetnictví a finančních
      procesů společnosti Jak si tě představujeme: Máš alespoň 5 let zkušeností v
      účetnictví a zkušenost na pozici hlavní účetní nebo jiné seniorní účetní roli
      Výborně se orientuješ v českém účetnictví a dokážeš samostatně řešit komplexnější
      účetní případy Máš silnou praktickou znalost české daňové legislativy , zejména
      DPH a DPPO; zkušenost s OSS a přeshraničními transakcemi Dokážeš samostatně
      řídit měsíční i roční účetní závěrku a připravit účetnictví a podklady pro audit
      Máš zkušenost s vedením a metodickým rozvojem účetního týmu Orientuješ se ve
      skladovém účetnictví a účtování zásob; zkušenost z e-commerce, retailu nebo
      FMCG je výhodou Rozumíš P&L, rozvaze i cash flow a chápeš jejich vzájemné vazby
      Ideálně máš zkušenost se samostatným zpracováním mezd nebo se dobře orientuješ
      v související mzdové agendě Jsi hands-on, umíš převzít ownership a vedle vedení
