- name: st-067
  inputs:
    id: st-067
    title: Customer Success Manager
    text: 'About Us: At Roivenue , we empower businesses to make smarter, data-driven
      marketing decisions through our innovative marketing attribution platform. Our
      Prague-based team thrives on curiosity, collaboration, and continuous learning,
      developing forward-thinking solutions for the ever-evolving digital marketing
      landscape. Now, we’re seeking a driven Customer Success Manager to join us in
      delivering exceptional customer experiences, leveraging technical expertise
      to guide clients toward optimal use of our products. In this role, you’ll collaborate
      closely with various teams to ensure seamless implementation of our clients,
      troubleshoot and resolve challenges, and contribute to the ongoing enhancement
      of our platform. If you’re passionate about marketing, technology, problem-solving,
      and working with customers to unlock real value, we’d love to hear from you!
      Responsibilities: Own the end-to-end Client Success agenda for assigned clients,
      with a strong focus on data quality, attribution logic, and long-term client
      value. Lead technical onboarding and implementation of the Roivenue platform,
      including complex setups for enterprise clients and custom use cases. Deliver
      client trainings and workshops , ensuring clients understand not only how the
      product works, but how to use it effectively for decision-making and optimization.
      Act as the primary point of contact for technical and analytical support , ensuring
      fast, structured, and high-quality resolution of client questions and issues.
      Provide data-driven consultations to help clients interpret attribution results,
      understand customer journeys, and apply insights to marketing and business decisions.
      Support sales and account management with technical and methodological expertise
      during pre-sales, upsell, and strategic client discussions. Collaborate closely
      with Product and Data teams , translating client needs and feedback into actionable
      product input, and ensuring clients understand product capabilities and limitations.
      Identify recurring client challenges and contribute to process improvements
      , best practices, and scalable Client Success workflows. Contribute to and maintain
      client-facing documentation , training materials, and knowledge resources to
      support both clients and internal teams. Act as a key bridge between clients,
      Product, Sales, Account Management, and internal teams , ensuring alignment
      and clear communication across all stakeholders. Skills and Qualifications:
      Strong analytical and data-oriented mindset , with the ability to understand
      how data flows through systems and how it should be interpreted in a business
      context. Ability to work with complex datasets and attribution outputs , identify
      inconsistencies, formulate hypotheses, and systematically validate them. Solid
      understanding of digital marketing and performance marketing principles , including
      attribution, customer journeys, and campaign evaluation. Comfortable explaining
      complex analytical or technical topics in a clear and structured way to both
      technical and non-technical stakeholders. Strong written and verbal communication
      skills , especially in client-facing situations. English at B2 level or higher
      for daily communication with international clients and internal teams. Czech
      or Slovak language skills are an advantage but not required . High level of
      ownership and responsibility for client outcomes, with a strong focus on quality
      and long-term value. Ability to work independently, prioritize effectively,
      and stay structured in a fast-paced environment. Curiosity and willingness to
      continuously learn , especially in the areas of data, analytics, marketing technologies,
      and attribution. Nice to have Previous experience in Customer Success, Consulting,
      Performance Marketing, or Analytics. Experience with client trainings, workshops,
      or business consultations. Basic familiarity with SQL, Python, or data querying
      concepts (not required, but helpful for deeper analysis). Why Join Us? Flexible
      working setup You can work from our Prague office or choose a hybrid setup.
      Remote work is possible upon discussion. Competitive and fair compensation We
      offer a compensation package that reflects your experience and responsibilities,
      along with a range of company benefits. Clear growth paths Several people currently
      in senior or managerial roles at Roivenue started in similar positions. Deep
      product and client knowledge opens up natural growth opportunities, including
      paths toward product or leadership roles. Meaningful impact Your work will directly
      shape how clients make key marketing and business decisions, using advanced
      attribution and data-driven insights across international markets. Smart, collaborative
      culture You’ll be part of a team that values open discussion, ownership, and
      continuous improvement, but also genuinely enjoys working together. We regularly
      meet at company-wide events, team get-togethers, and teambuildings shaped by
      what people actually like: from gaming nights and board games to sports, dance,
      or other activities. Roivenue has a young, active spirit, and we care about
      building a culture where people feel comfortable, connected, and engaged.'
