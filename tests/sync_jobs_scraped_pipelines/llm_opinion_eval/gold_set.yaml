- name: jo-206
  inputs:
    id: jo-206
    title: C++ Developer – Modernizace High-Tech systémů – IXPERTA s.r.o.
    text: 'Pracovní nabídka Popis projektu Modernizace C++ platforem pro high-tech
      elektronové mikroskopy Thermo Fisher Scientific v rámci přípravy na Cyber Resilience
      Act. Cílem je posunout dlouhodobě vyvíjené produkty na modernější, bezpečnější
      a dlouhodobě udržitelný technologický základ. Jedním z hlavních driverů je příprava
      produktů na nové požadavky v oblasti cyber resilience a evropské regulace Cyber
      Resilience Act (CRA). Součástí programu je systematická analýza software pomocí
      SBOM, dependency scanningu, SAST/DAST a dalších nástrojů. Na základě těchto
      analýz vznikají technické požadavky na modernizaci jednotlivých částí produktu
      – například upgrade nebo náhradu starších knihoven a technologií, refactoring
      existujícího C++ kódu či úpravy související s novějšími verzemi komponent. Druhou
      významnou částí je integrace dlouhodobě oddělených produktových větví zpět do
      hlavní vývojové větve (trunk/mainline), kde již proběhla část technologického
      a security-related vývoje. To zahrnuje řešení breaking changes, integračních
      problémů a adaptaci product-specific kódu. Co budete dělat: Refactoring a modernizace
      existujícího C++ kódu. Upgrade nebo náhrada starších knihoven a dependencies.
      Řešení technických nálezů ze SBOM, SAST/DAST a dependency analýz. Integrace
      produktových větví s hlavní vývojovou větví a řešení breaking changes. Stabilizace,
      debugging a testování změn před product-specific CRA releasy. Pracovat ve vývojovém
      prostředí C++ / konkrétní toolchain a prostředí dle produktu. Co budete potřebovat:
      Velmi dobré C++17, Git, debugging a schopnost zorientovat se v komplexním existujícím
      systému a bezpečně v něm provádět změny. Alespoň 3 roky zkušeností v C+, znalost
      moderních norem C+, zažité návrhové vzory či solid principy. Výhodou je zkušenost
      s větším C++ codebase, refactoringem, dependency upgrades, Git branching/merging,
      CI/CD nebo static/security analysis. Cybersecurity zkušenost není podmínkou.
      Pozice je koncipována na hybridní režim, tedy docházku cca 3x týdně do kanceláře.
      Co je na projektu zajímavé: Není to klasický maintenance. Jde o technologickou
      modernizaci komplexních high-tech produktů, kombinující C++ refactoring, dependency
      modernization, integraci dlouhodobě oddělených větví a nové cybersecurity požadavky.'
