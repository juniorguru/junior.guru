- name: st-142
  inputs:
    id: st-142
    title: Programmatic Consultant (Campaign Execution & Optimization)
    text: '💪 Kdo jsme? Zircon Tree je globální adtech postavený na expertech. Spravujeme
      kampaně pro světové klienty a vyvíjíme vlastní AI SaaS nástroje: Zirsee - automatizovaný
      a přehledný reporting s využitím AI Zircon Ads - platforma pro jednodušší správu
      kampaní a nákup médií Automatizace ubírá rutinu, ne rozhodování. Čím víc systém
      nakupuje sám, tím větší váhu má člověk, který mu nastaví pravidla, postaví testy,
      ohlídá, kde kampaň reálně nakupuje, a odchytí místo, kde se algoritmus sekne.
      Někde se téhle roli říká RTB specialista , u nás je role konzultanta client-facing
      , a to je celý rozdíl. Nehledáme člověka, který naklikává, co mu přijde v briefu.
      Chceme někoho, kdo kampaň postaví, rozebere její výkon až na úroveň publik,
      formátů a inventory, a pak si sedne s klientem a vysvětlí , co udělal, proč
      to udělal a co zkusí dál. Pokud chceš měnit svět digitálního marketingu s námi,
      rádi se o tobě dozvíme víc! 🎯 Co budeš dělat: Správa a optimalizace kampaní:
      nastavíš, spustíš a průběžně ladíš programmatic kampaně tak, aby doručovaly
      výkon a plnily rozpočet. Rozhoduješ o publikách, formátech, frekvenci a inventory,
      často na více trzích současně. Kvalita a struktura nákupu: hlídáš, kde kampaň
      skutečně nakupuje. Whitelisty, pre-bid filtry, viewabilita, brand safety, nevalidní
      traffic. Vyhodnocování a testování: čteš data až na úroveň cílení, hledáš, kde
      je prostor, a ověřuješ to testem, ne dojmem. Výsledek pak umíš obhájit před
      klientem i před kolegy. Rozvoj kampaní a příležitosti: vidíš, kde má současné
      nastavení strop, a přineseš klientovi konkrétní návrh, co dál. Nový formát,
      nový kanál, jiná data nebo jiná optimalizace. Komunikace s klientem: dáváš doporučení,
      ze kterých klient pochopí, co se v kampani děje a co bude dál. Na statusu odpovídáš
      na otázky ke kampani sám, a když něco nefunguje, dozví se to klient od tebe
      dřív, než se sám zeptá. Aktuální trendy a technologie: CTV, DOOH, digitální
      audio, Rich Media a dynamické kreativy. Testuješ nové platformy a nástroje a
      víš, co z toho má u kterého klienta smysl nasadit. Zpětná vazba do našich produktů:
      to, co ti v Zirsee nebo Zircon Ads chybí, řekneš lidem, kteří je staví. Používáš
      je denně, takže tvoje připomínky mají váhu. 🧐 Koho hledáme? Hodíš se k nám,
      pokud máš: Máš za sebou alespoň 2 roky v aktivní správě RTB kampaní. Alternativně
      alespoň 2 roky ve správě PPC nebo reklamy na sociálních sítích a chuť přesedlat
      na programmatic. Umíš pracovat s některým z DSP na pokročilé úrovni, ať už je
      to DV360, Adform, The Trade Desk nebo Teads. Nemusíš znát všechny, v jednom
      se ale musíš pohybovat samostatně. Rozumíš tomu, jak se výkon měří: konverzní
      tracking, atribuce, viewabilita, frekvence. Poznáš, kdy je problém v kampani
      a kdy v měření. Data si zpracuješ sám. Pivoty v Excelu nebo Sheets a Looker
      Studio patří k tvé běžné výbavě. Bereš iniciativu za svou. Když čísla nebo zpětná
      vazba od klienta říkají, že strategie nefunguje, překopeš ji i uprostřed kampaně
      a odkomunikuješ to. Máš proklientský přístup a suverénní vystupování na callu
      i na statusu, včetně situace, kdy kampaň nedoručuje. Nerozhodí tě klient, který
      zpochybní výsledky. Zvládneš slovenštinu nebo češtinu na úrovni rodného jazyka
      a angličtinu, která snese mailovou komunikaci i call s klientem. Sleduješ, co
      se v programmaticu a v technologiích děje, protože tě to baví. Výhodou, nikoliv
      podmínkou, je: Konkrétní příklad kampaně, kde tvoje rozhodnutí měřitelně zvedlo
      výkon. Ideálně s čísly. Zkušenost s tvorbou case study, ať už pro klienta, nebo
      pro prezentaci výsledků směrem na trh. ✨ Výhody a benefity, které nabízíme navíc:
      Fixní měsíční odměnu (výši dohodneme na pohovoru podle tvých předchozích zkušeností,
      výsledků a portfolia). Podporu ve vzdělávání : můžeš si vybrat kurzy, školení,
      workshopy nebo konference, které tě baví a pomohou ti profesně růst. Prostor
      pro kariérní i finanční růst : s rostoucími zkušenostmi a odpovědností se může
      posouvat také tvoje role a odměna. Flexibilní pracovní dobu Hybrid model s office
      v Praze nebo Bratislavě, nebo i plný remote . Placené volno a sick days (i pro
      freelancery) Happy Money : měsíční rozpočet pro tým na cokoliv, co vám udělá
      radost nebo zpříjemní společný pracovní den Multisport kartu částečně hrazenou
      firmou Pravidelné teambuildingy a společné akce Reálný dopad tvé práce : přímo
      ovlivníš revenue firmy i směřování našich produktů.ň Vlastní produkty, které
      vyvíjíme in-house. Zircon Ads a Zirsee stavíme sami, takže zpětná vazba z klientské
      praxe má kam jít. Diverzitu klientů, segmentově i geograficky, od lokálních
      značek až po mezinárodní portfolia. Přátelský tím a přístup ke know-how zkušených
      kolegů ze Sales, SaaS a RTB. Z našich firemních akcí (pohled do naší firemní
      kultury): 📩 Jak bude probíhat výběrové řízení? Pošli nám své CV + krátký motivační
      dopis (nebo video). Zajímají nás 4 věci: co umíš dělat a co tě baví dělat nejvíc,
      co neumíš, ale chceš se to naučit, co nechceš, abychom od tebe chtěli, a také
      info o sobě – kdo jsi, co jsi. Co bude následovat? Krátký online rozhovor se
      Simi z HR, během kterého se vzájemně poznáte a proberete základní očekávání.
      Praktické zadání, na kterém si vyzkoušíš práci podobnou tomu, co u nás tester
      běžně řeší. Druhé kolo s hiring manažerem, ve kterém společně projdete tvoje
      řešení a dozvíš se více o týmu, produktech a každodenní práci. Pokud si sedneme
      pracovně i lidsky, pošleme ti nabídku spolupráce. Zaujalo tě to? Tak nám napiš,
      pošli svoje CV a pojďme zjistit, jestli k sobě ladíme. 🤝'
  metadata:
