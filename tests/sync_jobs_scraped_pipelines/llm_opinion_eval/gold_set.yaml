    title: 👉Account Manager/ka v digitální agentuře🎯
    text: 'Láká Tě svět marketingu a technologií a máš rád/a pořádek ve věcech? Hledáme
      někoho, kdo bude spolehlivý parťák – pro nás i pro naše klienty! Takový, co
      naslouchá, správně se ptá a rozumí potřebám. Tvojí hlavní výzvou bude držet
      klienta i tým na jedné vlně. Budeš propojovat cíle, čísla i lidi tak, aby vše
      dávalo smysl a přinášelo výsledky. Pokud Tě baví odpovědnost, vztahy a širší
      kontext digitálního marketingu, pak hledáme právě Tebe! Kdo že to jsme a koho
      že hledáme? Jsme fullservis digitální agentura se spoustou zajímavých klientů,
      pro které zajišťujeme digitální služby od A do Z. Tvoříme weby, realizujeme
      kampaně, navrhujeme komplexní projekty, vedeme marketing. Jdeme pořád dopředu,
      sledujeme nové trendy v oblasti webů a webových aplikací, ale také online marketingu.
      Učíme se. A to, co umíme, využíváme aktivně v projektech našich klientů. Přesně
      v tom potřebujeme Tvou pomocnou ruku! Hledáme kolegu/kolegyni, který/á bude
      o naše klienty pečovat. Naladí se na jejich potřeby a postará se o to, abychom
      jim dodali takové služby a produkty, které je budou dlouhodobě posouvat dál.
      To se samozřejmě neobejde bez dodržování domluvených termínů a dobré organizace
      práce. Ceníme si i schopnosti získávat nové klienty a přicházet se zajímavými
      nápady. V týmu táhneme za jeden provaz a rádi v něm přivítáme někoho dalšího,
      kdo to tak má taky. Co bude Tvým úkolem: naslouchat klientům, chápat jejich
      cíle a rozumět jejich projektům, které je potřeba udržovat a rozvíjet spolu
      s týmem specialistů vymýšlet nové projekty, které pomůžou klientům v dosahování
      jejich cílů vést realizaci projektů pro významné klienty přímo spolupracovat
      s realizačním týmem K jakým projektům se u nás můžeš dostat? U nás se zapojíš
      i do projektů, které mají opravdovou hloubku. Pro představu jsou tohle některé
      z projektů, na kterých náš tým aktuálně pracuje: moderní e-shopy postavené na
      našem vlastním commerce balíčku aukční platforma s real-time prvky komplexní
      firemní weby a aplikace online marketingové kampaně, pokročilá webová měření
      a analytika, online i offline grafika Koho hledáme: samostatného proaktivního
      člověka ochotného na sobě pracovat a hledat řešení pro jakýkoliv problém člověka
      otevřeného novým příležitostem spolehlivého detailistu s lidským přístupem a
      excelentními komunikačními dovednostmi Co na Tobě oceníme: orientaci v online
      marketingovém/technologickém prostředí zkušenosti s řízením projektů, ideálně
      v agentuře mysl otevřenou moderním technologiím, včetně AI znalost anglického
