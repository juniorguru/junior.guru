- name: st-039
  inputs:
    id: st-039
    title: AI Fullstack developer (React & Node.js)
    text: 'Jsme Qest technologies — softwarové studio, které posouvá hranice digitálních
      řešení. Už víc než 12 let stavíme technologie, za kterými stojí silný tým 70+
      lidí, a hledáme další posily! Jak a na čem konkrétně děláme? Pro DPD stavíme
      dlouhodobě celý digitální ekosystém – od návrhu API a vývoje vlastního ERP systému
      Universe, až po software pro správu sítě boxů a napojení partnerů. Vytvořili
      jsme mobilní aplikaci pro výdejní místa, dodali jsme kompletní řešení pro vlastní
      DPD boxy a podílíme se i na jejich rozšíření v CEE regionu. S Heureka Group
      máme za sebou rozsáhlou konsolidaci tří společností pod jednu značku. Podíleli
      jsme se na vývoji uživatelských účtů, optimalizaci obrázků a sjednocení frontendů.
      Pro Orea Hotely vyvíjíme kompletní digitální zákaznický servis – od online pre-check-inu
      a check-outu přes přístup na guest web až po kartu hosta a historii pobytů.
      Implementovali jsme bezpečnou autentizaci pomocí Magic linků, notifikační službu
      a věrnostní program Discovery. Pro CNC – mediální dům s tituly jako Frekvence
      1, Evropa 2, Blesk, iSport, Reflex aj. – tvoříme interaktivní kvízy, vyvíjíme
      admin rozhraní pro tvorbu „Instagram“ stories pro rychlé zpravodajství a také
      vizitkový systém pro zaměstnance s integrací do Google/Apple Wallet. Pro Direct
      jsme pracovali na rozsáhlém rebrandingu desítek webů. Spravujeme dva klíčové
      repozitáře, interní nástroj Šablonátor a spolupracujeme také na interní platformě
      pro Customer Support Garance mobility. Pro vývoj mobilních aplikací používáme
      React Native – jak pro vlastní produkt HomeQest, tak třeba pro startup Lokni
      , který si jde za snem o budoucnosti bez PET lahví. Umíme se poprat i s dalšími
      věcmi - máme za sebou návrh robota pro hru Abaku , rozvíjíme se i na poli datové
      analytiky , umíme dělat chytré domácnosti a mnoho dalšího. Jak u nás vypadá
      AI v praxi? Dodáváme interní AI asistenty a knowledge nástroje, které zrychlují
      práci týmů a zlepšují přístup k informacím napříč firmou. Efektivně je napojujeme
      na firemní systémy a LLM, takže mohou sloužit například pro přípravu podkladů
      pro zákazníky nebo vyhodnocování reportů. AI u nás často není samostatný produkt,
      ale chytrá vrstva uvnitř webových a mobilních aplikací, kterou využívají koncoví
      uživatelé i interní týmy. Navrhujeme AI-driven automatizace procesů, kde propojujeme
      modelové rozhodování, workflow orchestrace a integrace na reálné firemní systémy.
      Stavíme řešení nad firemní znalostí – od chytrého vyhledávání až po RAG asistenty
      s napojením na interní zdroje. Neřešíme AI jen jako funkci v produktu. Pomáháme
      také nastavovat AI-driven SDLC — tedy způsob, jak využívat AI napříč návrhem,
      vývojem, testováním i provozem moderních digitálních řešení. Techstack : Node.js,
      React (18+), Next.js, TypeScript SQL databáze (PostgreSQL, MSSQL, MariaDB),
      Elasticsearch AWS, Azure, Serverless REST API, GraphQL, React Query, Apollo
      Tailwind CSS, Styled Components React Testing Library, Jest Nástroje, které
      denně používáme: Slack, Notion a Google na komunikaci Azure DevOps na plánování
      Costlocker na trackování práce Co očekáváme od nových kolegů? Praktickou zkušenost
      s fullstack vývojem na mediorní / seniorní úrovni. Čím více zkušeností máte,
      tím lepší je pro vás výchozí pozice a možnost se u nás dále posouvat. S každým
      naším kolegou pracujeme individuálně na jeho rozvoji. Nabízíme vám možnost být
      hands-on expert, který zasahuje do architektury produktů nebo můžete směřovat
      k vedení týmu a předávání vašeho know how “mladším” kolegům. V rámci AI znalostí
      očekáváme: praktické zkušenosti s nástroji jako je Claude Code, Cursor nebo
      Codex schopnost správně formulovat úkoly pro AI, aby poskytlo nejlepší výsledky
      znalost halucinací a limitací AI – chápete, kde jsou hranice AI a jaké úkoly
      dokáže zvládnout znalost tokenové ekonomiky – jak fungují tokeny, kolik stojí,
      jak s nimi efektivně pracovat povědomí o context window – víte, že paměť AI
      má určitou kapacitu, a umíte si poradit v případě, že ji překročíte informace
      o bezpečnosti a hygieně dat, kterými se řídíte a dodržujete je Rozhodující je
      pro nás váš přístup k práci, analytické myšlení, selský rozum a hlavně to, zda
      si budete rozumět s naším týmem. Naše firma je česky / slovensky hovořící, takže
      komunikativní znalost jednoho z těchto jazyků je nutností. Co vám nabízíme?
      vzdělávání: portfolio kurzů na portálu Udemy, kurz Epic React, AWS certifikace,
      interní série workshopů možnost účastnit se konferencí (domácí i zahraniční)
      vystupování na Qeetupu (náš vlastní meetup pro vývojáře) lekce angličtiny MultiSport
      karta v kanceláři v Karlíně se můžete těšit na velký výběr čajů, 3 druhy kávy,
      granko, ráno nebo k svačině musli, kaše a ovoce, pomazánkový čtvrtek / sladké
      pondělí týmové akce (sportovní utkání, teambuildingy, a spousta dalších aktivit)
      Těším se na vaši reakci! Za tým Qest Káťa z HR'
