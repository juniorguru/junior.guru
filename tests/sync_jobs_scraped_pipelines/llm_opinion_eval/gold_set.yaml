- name: st-104
  inputs:
    id: st-104
    title: MIXIT hledá Senior grafického designéra/designérku!
    text: Jsi zkušený grafik/grafička a chceš se podílet na nové vizuální vizi značky
      Mixit? Chceš vidět výsledky své práce na obalech a kampaních, pracovat kromě
      obalů na kreativních projektech a mít možnost dostat své nápady až do reálity?
      Máš za sebou alespoň 4 roky zkušeností v oboru , relevantní vzdělání a už nepotřebuješ
      vodit za ruku? Zároveň nechceš jen odškrtávat zadání a hledáš místo, kde můžeš
      ovlivnit podobu výsledku? V MIXIT království na Praze 10 právě teď hledáme nového
      kolegu nebo kolegyni na pozici Senior grafického designéra/designérky , který/á
      perfektně dochutí náš grafický tým. Jestli máš grafické řemeslo pevně v ruce,
      umíš přijít s vlastním řešením, dokážeš si pohlídat detail od prvního návrhu
      až po tisk a chceš být u vzniku novinek českého love brandu, vypadá to, že hledáme
      právě tebe! Jaké je MIXIT pracovní prostředí? ☕️ kreativní, neformální, dynamické
      🍓tykáme si a většinou chodíme do kanceláře, protože všechno se mixuje u nás
      🐕 vypijeme dost kávy a potkáš tu i čtyřnohé kolegy Co bude tvoje práce? Spoluvytváření
      nové vizuální cesty značky Mixit. Obalová grafika – to je alfou a omegou. Chceme
      se posunout dál a novým nápadům se rozhodně nebráníme. Samostatná tvorba návrhů
      od prvního konceptu až po finální výstup. Tvorba propagačních materiálů a kampaní.
      Spolupráce na kreativních projektech, novinkách a speciálních edicích . Hledání
      efektivních řešení a nových kreativních nástrojů , které pomohou celému týmu
      práci zjednodušit nebo posunout výsledek. Co od tebe očekáváme? 4+ let relevantní
      praxe v grafickém designu (grafická studia, agentury, klientská strana). Vzdělání
      v oboru grafického designu, vizuální komunikace nebo příbuzném oboru (ideálně
      VŠ) . Pokročilou znalost Adobe CC. Zájem o AI a nové technologie je velké plus.
      Zkušenost s obalovým designem je výhodou , nikoliv podmínkou. Umíš pracovat
      samostatně – od pochopení zadání přes návrh až po finální výstup. Máš výborné
      oko na detail, typografii, kompozici, barvy a záleží ti na kvalitě výsledku.
      Dokážeš nejen plnit zadání, ale také navrhnout vlastní kreativní řešení a obhájit
      ho . Chápeš, že dobrá grafika není jen o estetice, ale také o funkčnosti, značce,
      produktu a cílovém zákazníkovi. Umíš pracovat v týmu a komunikovat s lidmi mimo
      grafické oddělení. Čeština na úrovni C1 je nutností . S kým a s čím budeš pracovat?
      S naším Art Directorem Liborem a dalšími grafiky, od juniornějších kolegů až
      po zkušené designéry. S Asanou , ve kterých držíme přehled o projektech a jejich
      fázích. S grafickými programy i s AI. S nadupaným Macem nebo PC – jak budeš
      ty chtít. A hlavně s produkty, které se z návrhu na monitoru dostanou až do
      rukou našich zákazníků. Co můžeš očekávat ty? Budeš pracovat na vizuální identitě
      a produktech jednoho z největších českých love brandů. Tvoje práce bude vidět
      v TV, na pultech obchodů i v domácnostech nejen v České republice . Velkou míru
      samostatnosti a důvěry – nechceme z tebe dělat člověka, který jen plní zadání.
      Prostor pro vlastní nápady, kreativitu a profesní růst. Různorodou práci, kde
      se nebudeš každý den věnovat tomu samému. Podporu skvělého šéfa, celého týmu
      grafiků a spolupráci napříč firmou. Práci na plný úvazek. Možnost částečného
      home office dle domluvy. Zvýhodněné MIXIT dobroty a možnost běžného ochutnávání
      :) Multisport kartu. Výbornou kávu. Stabilní firmu s nadšením a nasazením start-upu.
      Co prosím NEočekávej? Že budeš celý den jen mechanicky zpracovávat zadání. Že
      budeš mít každý projekt přesně nalajnovaný od A do Z. Chceme tvůj názor a zkušenost.
      Práci čistě na dálku – všechno se mixuje hlavně u nás. Komunikaci jen v angličtině
      – čeština na úrovni C1 je nutnost . Myslíš si, že jsi ty ta správná ingredience
      pro náš grafický tým? Napiš nám, připoj k tomu svoje CV a portfolio . Následně
      se ti ozveme a dáme si spolu první online call. Pokud bude vše z obou stran
      v pořádku, budeme se těšit na osobní setkání u nás. Těšíme se na tebe a brzy
      se snad vidíme v MIXIT!
