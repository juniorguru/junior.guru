- name: st-097
  inputs:
    id: st-097
    title: Manual Tester - Junior
    text: 'Ahoj, my jsme Legito! 👋 Z Brna budujeme s vášní a odhodláním startup (nebo
      už ScaleUp?) s globálním dopadem, který umožňuje neprogramátorům programovat
      a tím výrazně mění, jak lidé ve firmách pracují. Zákazníci z celého světa jako
      město New York, PwC (PricewaterhouseCoopers), Deloitte, nebo Škoda Auto dokazují,
      že naše práce má smysl. Jak jsme to dokázali? Jsme opravdový startup, který
      není vlastněný žádnými fondy a ani za sebou nemá velký korporát. Vše jsme vybudovali
      od nuly až do současných osmi nul a 40 zaměstnanců díky tomu, že pro nás bylo
      vždy nejdůležitější vyvíjet funkce, které pomohou našim zákazníkům a uživatelům
      být úspěšnější díky naší aplikaci. Nepředstíráme, že udržet si rychlý růst na
      globálním trhu je snadné. Jsme ale soutěživí a baví nás nové výzvy, takže si
      tu jízdu společně parádně užíváme, i když ze sebe občas musíme dostat to nejlepší,
      abychom uspěli. Jsi taky takový/á? Pak se ti u nás bude rozhodně líbit! 🚀 Součástí
      tvých projektů bude: Testování nových features a oprav bugů Práce na prostředí
      Legita i na prostředí našich klientů Ověřování prostředí poté, co vydáme release
      Release ve večerních hodinách 1x za 3 týdny 2x v týdnu (cca od 20:30) Hledáme
      někoho, kdo má alespoň základní (pokročilé) zkušenosti s: Reportováním bugů
      Psaním Test Cases Základní znalosti systému Git Práce s konzolí Znalost REST
      API a Postman Aby se ti u nás dobře pracovalo, potřebuješ: Schopnost systematické
      práce, logického uvažování a kritického myšlení Chuť učit se novým věcem Pečlivost
      a trpělivost Povědomí o tom, jak fungují webové aplikace Alespoň průměrnou znalost
      angličtiny Abys k nám dobře zapadl/zapadla, potřebuješ mít: Rád/a výzvy (zkušenosti
      s prací ve startupu výhodou) Chuť na sobě pracovat a neustále se zlepšovat VŠ
      (obor nerozhoduje) Čím si nás ještě můžeš získat: Jsi týmový hráč - máš chuť
      být součástí naší party Rychle se učíš a přizpůsobuješ novým situacím Hledáš
      inovativní, zkrácené cesty k řešení problémů Umíš si rozvrhnout práci tak, abys
      mohl/a flexibilně reagovat na potřeby týmu Dokážeš být agilní a přizpůsobit
      se novým výzvám v dynamicky se rozvíjejícím týmu a produktu Jak probíhá výběrové
      řízení? V prvním kroku nám prosím v odpovědi pošli tvé CV, příp. LinkedIN a
      připoj také motivační dopis. Zaujmou-li nás tvé zkušenosti, pošleme ti testovací
      úlohu – díky ní uvidíme, jak přemýšlíš a jak systematicky postupuješ. Když úkol
      zvládneš správně, pozveme tě na osobní pohovor. A pokud si během něj sedneme
      a bude tam oboustranný zájem, pošleme ti nabídku. Výběrko držíme co nejjednodušší
      a nejrychlejší, rozhodně tě tedy nečeká několik kol ani zbytečné průtahy. Můžeš
      od nás očekávat: Nástup ihned Nástupní odměna 30 000 na HPP ⬆️Náš tým na konferenci
      Legito PowerUp 2026 Dále také: Flexibilní pracovní dobu (ale držíme si core-time
      10:00 - 14:00) 4 týdny placené dovolené 3 dny home office měsíčně, 3 dny sick
      days ročně Možnost Multisport karty, inhouse masáží, snacků a dalších firemních
      výhod On-site spolupráci , kdy všechno dokážeš vyřešit hned a na místě s kolegy
      s minimem online meetingů Práci v příjemném a moderním prostředí vlastních kanceláří
      v novém komplexu Vlněna Příležitost se rozvíjet v týmu talentovaných, zkušených
      a motivovaných kolegů Je pro nás důležité budování dobrého týmu , pořádáme často
      různé firemní akce (snídaně, grilovačky, filmové večery, lan párty, deskovky...)
      O nás: Legito založili v roce 2014 spolužáci z Fakulty informatiky. V současné
      době máme stovky tisíc uživatelů a působíme téměř po celém světe (platící klienti
      ve více než 40 zemích). Mezi naše největší klienty patří PwC (přes 120 000 uživatelů
      celosvětově), Societe Generale Group (Komerční banka a spol.), Grant Thornton,
      Unicredit, Deloitte Legal, Škoda Auto, Lexis Nexis, největší advokátní kanceláře
      a mnoho dalších. Náš příběh tím rozhodně nekončí, naopak nabírá na intenzitě
      a budeme rádi, když ho budeš sdílet s námi. Celkem má náš tým kolem 40 členů
      . Hlavní kancelář je v Brně, ale máme menší pobočky ve Velké Británii, USA a
      Kolumbii. O cestě Legita si můžeš také přečíst na webu: CzechCrunch: Spojila
      právo s IT a přidala správu firemních procesů. Mladá firma z Brna si tím získala
      globální hráče CTP blog: Legito věří v blízkou spolupráci mezi lidmi. Na automatizaci
      dokumentů vyrostlo 12násobně Hospodářské noviny: PwC a Legito nově společně
      nabízejí platformu pro automatizaci dokumentů Finmag: Nebudu to dělat! Startup
      z Brna vyrostl na odporu k rutině, obraty má snové Tady se můžeš podívat na
      krátké shrnutí našeho produktu: Jak bude vypadat tvůj běžný den mezi námi? Nebudeme
      si nic nalhávat, startupový vývoj je agilní a občas hektický. Abychom to všechno
      zvládli i při tom, jak rychle rosteme a jak se zvyšují očekávání našich zákazníků,
      zavedli jsme nezbytně nutné procesy (sprinty, automatické a manuální testování,
      code review, code style). I přes to si však zakládáme na tom, že máme neformální
      a přátelskou atmosféru, která podporuje kreativitu. Například tě po příchodu
      může přivítat několik čtyřnohých hapiness managerů. Zaujala tě naše nabídka?
      Rádi tě pozveme k nám na čaj či kávu a popovídáme si.'
