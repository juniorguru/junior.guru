- name: st-071
  inputs:
    id: st-071
    title: Senior Product Manager (AI solutions)
    text: 'About role Location: Remote (CET +/- 2h) Languages: Fluent English + Native
      Slovak or Czech The Mission Most companies talk about AI; we ship it. At Sudolabs,
      we don''t just build wrappers. We build LLM-based applications, agentic systems,
      and multimodal workflows for global clients ranging from YC startups to Fortune
      500s (UNIQA, U.S. Steel, iQor). We are looking for a high-agency Senior PM who
      wants to lead client transformations into new AI-agentic operating models. You’ll
      work in small, autonomous teams (3–5 people) where the typical delivery lead
      time is under 12 weeks. No heavy hierarchy. No internal politics. Just building.
      How You’ll Work (The AI-Native Edge) Our company culture is tech-native and
      AI-oriented. Our PMs don''t just use ChatGPT, they run their work through our
      internal "Product-Harness"(agentic PM tooling), Claude Code, Figma, GitHub and
      any other individually preferred tools & systems. Unlimited AI Tokens: Use whatever
      model, whatever budget—no questions asked. Bleeding Edge: If a new framework
      drops Tuesday, you''re expected to be testing it by Wednesday. Total Leverage:
      We cover your tooling budget so you can build your own automations and pipelines
      to move faster than any traditional PM. What You’ll Own 1. Discovery & Strategy
      Lead AI Discovery workshops to map and prioritize use-cases. Validate ideas
      through rapid prototyping. Shape solution architecture with engineering. Score
      feasibility vs. business impact (ROI logic). Define product roadmaps and development
      scopes 2. Delivery & Scale Own the client relationship end-to-end as the primary
      point of contact. Translate technical trade-offs for non-technical stakeholders.
      Manage scope, timeline, and budget without breaking the relationship. Spot growth
      opportunities within the account to drive account retention. You’re a fit if...
      You are Technically Confident: You can discuss system architecture, estimates
      and data models with engineers without getting lost. You are Delivery-Proven:
      You’ve owned real software projects with real budgets and deadlines. You are
      High-Agency: You don''t wait for permission to fix a process, set a direction
      or try a new approach. You are Commercially Minded: You understand that clients
      are paying us to solve their business problems and that we need to bring them
      a real tangible value. Clear Communicator: You are structured in your work as
      well as in your communication, you embrace Pyramid Principle and can facilitate
      complex product workshops. This is probably NOT for you if... You want a purely
      internal facing role with no client contact. You prefer clear instructions and
      standardized playbooks. You are passive about AI tools and not curious to test
      new capabilities. You want to manage people rather than outcomes. Why Sudolabs?
      The Team: Work alongside engineers from Cambridge, CERN, and Imperial College;
      and strategists from BCG and Accenture. Focus: We prioritize depth. You will
      typically own one main project at a time. Autonomy: No 9-to-5 "clocking in."
      You define how and where the work gets done. The Hardware: MacBook + any Apple
      gear you need to stay productive. Rest: 31 paid days off per year + team retreats
      and learning budgets Perks & Benefits Permanent contract or trade license -
      choose what fits you Flexible working hours and location (you are responsible
      for the success of your client’s product not for your office presence) 31 paid
      days/year time off Internal education and knowledge sharing on a regular basis
      Hardware package - MacBook or anything you need Team buildings and company retreats
      Sudo apartment in Kosice - for our remote colleagues who would like to spend
      some time with us in Kosice Possibility to purchase a Multisport card for you
      and your friend Brand new office in the city center with parking space Pet-friendly
      office in Košice Regular snacks are a must, of course! Apply Send us your LinkedIn,
      CV - ideally with short note on the most interesting AI automation / product
      you’ve built yourself.'
