    title: Senior Cloud Engineer / Architect (Microsoft Azure)
    text: 'Česká národní banka rozvíjí využívání cloudových technologií a hledá zkušeného
      odborníka, který bude stát u návrhu a budování cloudového prostředí ČNB. V roli
      seniorního Cloud Engineera / Architekta pomůžeš nastavovat cloudovou architekturu,
      bezpečnostní principy, governance i technické standardy a staneš se klíčovým
      odborníkem pro oblast cloudu v rámci IT. Čeká tě full-time pozice v Praze .
      Budeš pracovat na prostředí, které má přímý dopad na fungování České národní
      banky. Na čem budeš pracovat Cloudové prostředí ČNB: budeš navrhovat, budovat
      a rozvíjet cloudové prostředí ČNB. Cloud landing zone: navrhneš a implementuješ
      landing zone včetně identity, sítí, bezpečnosti, monitoringu a governance. Standardy
      a pravidla: budeš definovat architektonické standardy pro využívání cloudových
      služeb. Automatizace: zapojíš Infrastructure as Code a CI/CD do budování i provozu
      infrastruktury. Spolupráce napříč IT: propojíš se s bezpečnostními, infrastrukturními,
      aplikačními i architektonickými týmy. Cloudová řešení: podpoříš jejich návrh,
      zavádění a praktickou implementaci. Rozvoj kompetencí: budeš předávat znalosti
      a pomáhat rozvíjet cloudové know-how v ČNB. Technologie a architektura v souvislostech
      Cloudové platformy: klíčová je pokročilá praktická zkušenost s cloudovými technologiemi;
      výhodou je hlubší zkušenost s Microsoft Azure , znalost Google Cloud Platform
      a relevantní certifikace Microsoft Azure. Infrastruktura a delivery: budeš pracovat
      s Infrastructure as Code, automatizací, Terraform , principy DevOps/DevSecOps
      a CI/CD . Bezpečnost a konektivita: řešit budeš identity, sítě, monitoring,
      governance, cloud security, Zero Trust, FinOps i private networking včetně Private
      Endpoint a PrivateLink . Moderní platformy: výhodou je zkušenost s Kubernetes
      a návrhem zabezpečení informačních systémů založených na moderních kontejnerových
      technologiích. Cloudové a AI služby: součástí role může být návrh zabezpečení
      a kontrola v ČNB používaných cloudových služeb MS Entra i AI cloudových služeb,
      jako jsou Copilot a ChatGPT . Koho hledáme Hledáme seniorního odborníka, který
      dokáže propojit koncepční pohled s praktickou implementací. Umíš převzít odpovědnost
      za svěřenou cloudovou oblast, formulovat technické standardy a srozumitelně
      je prosazovat napříč týmy. Vzdělání: máš vysokoškolské vzdělání, ideálně technického
      nebo IT zaměření. Praxe: máš alespoň 5 let zkušeností v oblasti cloudu nebo
      cloudové architektury a zkušenost s návrhem či provozem enterprise cloudového
      prostředí. Architektura: orientuješ se v identitě, sítích, bezpečnosti, monitoringu
      a governance v cloudu. Samostatnost: máš silné technické a koncepční myšlení
      a dokážeš samostatně převzít odbornou odpovědnost. Spolupráce: umíš spolupracovat
      napříč IT týmy, předávat znalosti a podílet se na zavádění řešení do praxe.
      Angličtina: zvládáš AJ na úrovni B2 . Regulované prostředí: zkušenost z finančního
      sektoru nebo jiného regulovaného prostředí bude výhodou. Co ti nabídneme Práci
      s významem: zajímavou a perspektivní práci v centru Prahy v prostředí ČNB s
      celospolečenským významem. Stabilitu a odborný růst: zázemí stabilní instituce,
      prostor pro kariérní i odborný rozvoj, vzdělávací kurzy a práci se skvělým týmem
      profesionálů. Volno a flexibilitu: 5 týdnů dovolené , sick days a pružnou pracovní
      dobu. Benefity pro každý den: cafeterii, stravenky, nadstandardní zdravotně
      preventivní program, sportovní centrum v budově, firemní sportovní tým a další.
      Podporu do budoucna: příspěvek na penzijní nebo životní pojištění či DIP, odborná
      školení, jazykové kurzy, mezinárodní semináře a stáže, sportovní a relaxační
      centrum, dvě závodní jídelny a kantýnu i výměnné zahraniční rekreace. Nástup:
      možný dohodou. O České národní bance ČNB je centrální bankou České republiky
      a nezávislou institucí, která pečuje o cenovou a finanční stabilitu. Dohlíží
      na finanční trh, podporuje rozvoj finančního systému a zajišťuje hladký oběh
      peněz i platební styk. Patří mezi nejprestižnější zaměstnavatele v Česku. Zakládáme
      si na erudici, profesionalitě a loajalitě; v týmu více než 1 400 zaměstnanců
      se potkávají čerství absolventi i lidé s mnohaletou praxí. Relativně nízká,
      pouze 5% fluktuace zaměstnanců, ukazuje, že tu lidé nacházejí dlouhodobé profesní
      zázemí. Přidej se k budování cloudu ČNB Pokud tě naše nabídka oslovila, zašli
      nám svůj strukturovaný životopis s motivačním dopisem nejpozději do 20. 9. 2026
      prostřednictvím registračního formuláře. Po přihlášení tvé podklady projdeme
      a ozveme se ti s dalšími kroky výběrového řízení. ČNB zpracovává osobní údaje,
      bližší informace nalezneš v Informaci o zpracování osobních údajů .'
