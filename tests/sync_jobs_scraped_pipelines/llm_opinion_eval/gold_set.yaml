- name: st-121
  inputs:
    id: st-121
    title: AI Engineer
    text: 'At Sudolabs, we''re expanding our technology team and looking for AI engineers
      with experience in building AI-driven digital products. If you have a background
      in AI engineering, this role offers an opportunity to work on practical applications
      of the latest advancements in AI. Type of contract: full-time or trade license
      Place of work: Kosice or remote Start date: let us know what time suits you
      best Compensation: from €20/hour up to €35/hour You’ll be part of a small team
      of engineers, data scientists, product managers, and designers where rapid prototyping
      and fast delivery are the norm. We don’t just follow AI trends—we translate
      cutting-edge research into real-world products. One day, you’ll be experimenting
      with breakthroughs that seemed impossible two weeks ago; the next, you’ll be
      preparing for what’s just around the corner (sometimes quite literally waiting
      for OpenAI’s next release to unlock new capabilities 😅). If you enjoy solving
      complex AI challenges and turning research into real products, we''d love to
      hear from you. As an AI engineer, we expect you to: Take ownership of delivering
      AI-driven projects, either independently or as part of a team. Engage with potential
      clients, collaborating with our proposal team to shape solutions and drive partnerships
      through technical research, solution architecture, estimations, prototyping,
      and feasibility testing. Work closely with clients to deeply understand their
      problems and needs. Work with our product designers on designing innovative
      AI UX patterns that deliver great user experience. Stay up to date with the
      latest AI trends and technologies, sharing insights and discoveries with the
      team. Develop a strong understanding of your domain and project, making informed
      decisions based on business objectives. Contribute to the growth of our engineering
      team by sharing AI knowledge and best practices across the department. Who are
      we looking for? 1+ year of AI/ML full-time software engineering experience Familiarity
      with advanced prompting techniques and common RAG strategies. Experience with
      evaluation frameworks and assessing AI performance. Understanding of Data Science
      / Machine Learning concepts, enabling you to build AI products (mainly leveraging
      LLMs / Foundation Models, though deep ML expertise isn’t required). Hands-on
      experience working with AI and LLMs, from concept to production. A proven track
      record of successfully delivering AI-related projects. Comfortable working across
      the full stack (TypeScript / Node / React / Python) Experience in product development,
      with a broad understanding of web or mobile, backend, and infrastructure. Strong
      product-oriented thinking Deep understanding of AI capabilities and how to leverage
      them to drive business value. A user-centric approach—caring deeply about the
      user experience, collecting and carefully studying data, and being willing to
      experiment. Excellent communication skills Ability to explain complex AI concepts
      in a simple, clear manner to non-technical stakeholders. Ability to identify
      and mitigate risks associated with AI-related projects as well as to manage
      client expectations in these projects. A collaborative and open-minded approach
      Willingness to share feedback, mentor others, and contribute to our internal
      knowledge base. Interest in organizing discussions, knowledge-sharing sessions,
      or AI-related events.'
