- name: st-108
  inputs:
    id: st-108
    title: Founding AI Engineer / RAG Specialist
    text: '🔎 Deep in retrieval. Hands-on with everything else Plomo helps people buy
      and sell companies - with a lot less manual work. Buying a company means understanding
      what you’re actually buying. Someone has to dig through thousands of contracts,
      spreadsheets, and financial reports, connect the dots, and spot what everyone
      else missed. That’s a big part of M&A: mergers and acquisitions. The stakes
      are high. The information is deeply confidential. A missed clause or an incorrect
      number can change a deal. There’s no room for confident guesses. Yet much of
      this work still happens across Excel, shared drives, and endless email threads.
      We’re building software that understands deal documents, finds the right evidence,
      and helps teams turn it into analysis and deal materials they can trust. It’s
      a huge, important industry full of hard engineering problems - and we’re just
      getting started. We''re looking for someone who knows RAG inside out, thinks
      independently, and wants to build something big with a small team. 🛠️ What you’ll
      get your hands on Retrieval that holds up under scrutiny. Own the journey from
      messy documents to useful context: parsing, chunking, hybrid search, reranking,
      and everything in between. AI that does useful work. Build workflows that connect
      evidence across documents, handle conflicting information, and produce outputs
      people can trace back to their sources. Quality you can measure. Build evals,
      investigate failures, and improve accuracy, latency, and cost against real deal
      problems. The product around it. Your home turf is AI, but you’re happy to jump
      into backend and frontend services, data pipelines, or product decisions to
      get something shipped properly. 🧠 You’ll click with us if… You’ve taken RAG
      into production. You’ve debugged the cases where the answer was right there
      and the system still missed it. You understand the tradeoffs and know how to
      test them. Your curiosity comes with working prototypes. A new model, paper,
      or tool drops, and you’re already experimenting while everyone else is bookmarking
      the announcement. You question the default. “That’s how everyone does it” makes
      you curious. You’ll try another approach, measure the difference, and happily
      change your mind when the evidence says otherwise. You build well with AI coding
      agents. You give them the right context, break down work, and steer, review,
      and verify their output. You take responsibility for scalable, maintainable
      code that other people can understand and build on. You think, then follow through.
      You can turn an ambiguous problem into a plan and carry it into production.
      You move quickly and care about what happens after shipping. You make the team
      better. You share context, challenge ideas with respect, ask for help early,
      and jump in when someone needs a hand. You don’t need an investment banking
      background. Bring curiosity - we’ll get you fluent in deals. 🌱 Why join us now
      Help shape the company. As one of our core teammates, you’ll work directly with
      the founders and influence the product, architecture, and engineering culture.
      Grow with what you build. There’s room to take on bigger technical and leadership
      responsibilities as Plomo grows, with our support along the way. Own a piece
      of it. Meaningful equity through ESOP gives you a stake in our success, with
      substantial upside if we get this right together. Have space to try things.
      Bring an idea, challenge an assumption, explore a better approach. We’ll help
      you test it and give promising work room to develop. We’re a small, ambitious
      team that likes moving fast, being direct, and figuring out hard things together.
      Your work will matter here, and so will your voice. We want this to be a place
      where you can do work you’re proud of, learn a ridiculous amount, and grow alongside
      people who have your back. 📍Practical details Full-time role €4,000 to €5,500
      per month , depending on experience Meaningful ESOP participation Remote-first,
      with one team day per week in our Prague office. You’re welcome to work from
      the office whenever you want. Direct collaboration with the founders and engineering
      team Let''s talk Send us something you’re proud of. A product, a repo, a weird
      experiment - and a few lines about yourself. We’d love to hear what you’ve been
      building, what you’re curious about, and what you’d want to try at Plomo.'
