- name: st-021
  inputs:
    id: st-021
    title: Marketér pro prop trading (paid ads, creators, AI) – ForTraders.com
    text: 'Kdo jsme ForTraders.com je rychle rostoucí fintech z Prahy. Stavíme platformu
      pro simulovaný trading na finančních trzích – forex, futures, crypto a opce
      – a používají ji lidé doslova po celém světě. 150 000+ zákazníků ze 130+ zemí
      tržby ve stovkách milionů korun core tým ~15 lidí + zákaznická podpora 24/7
      V tom, co děláme, jsme opravdu dobří. Do marketingu hledáme šikovného člověka,
      který má tah na branku, používá AI jako samozřejmost a hlavně rozumí tomu, co
      prodáváme. Nejdřív to nejdůležitější: rozumíš prop tradingu? Tohle je věc, na
      které u nás marketéři nejčastěji ztroskotají. Neznají, co náš produkt řeší,
      nerozumí tomu, jak trader přemýšlí, a pak neumí napsat jediný ad, který by mu
      dával smysl. Ideálně jsi sám trader. Víš, co je challenge, drawdown, funded
      účet a payout, a rozumíš tomu, proč si lidé prop firmu vybírají. Pokud netraduješ,
      ale prop trading znáš do hloubky a máš k trhům opravdový vztah, dej nám o tom
      vědět. Co budeš dělat Paid ads (Meta, Google, TikTok) – od kreativy přes nastavení
      po škálování v globální konkurenci. Spolupráce s creators a influencery v trading
      komunitě po celém světě. Sociální sítě a obsah – podívej se, jak to děláme dnes:
      instagram.com/fortraderscom AI naplno – v kreativě, copy, analýze i automatizaci.
      Většinu věcí si uděláš sám, rychle a bez agentury. Koho hledáme Máš za sebou
      reálné výsledky v paid ads a creator marketingu. Nemusíš mít deset let praxe,
      musíš umět doručit. AI není tvoje „zajímavá novinka", ale denní nástroj. Perfektní
      angličtina. Náš trh je celý svět, naprostá většina komunikace, adů i creators
      je v angličtině. Samostatnost a energie. Nečekáš na zadání, přicházíš s ním.
      Kdo se u nás nenajde: člověk z korporátu, který je zvyklý řídit agentury, schvalovat
      prezentace a exekuci nechávat na ostatních. U nás se dělá rukama. Nehledáme
      ani juniory. Náš CEO Jakub Rož razí filozofii co nejmenšího týmu z co nejchytřejších
      lidí – a tenhle člověk do něj musí zapadnout. Co nabízíme Volnou ruku a přímou
      linku na CEO. Nebudeš čekat na schvalování každého kroku. Jakékoliv zdroje,
      které budeš potřebovat – rozpočet, nástroje, lidi. Produkt, který se prodává
      ve 130+ zemích, takže tvoje práce má okamžitě globální dopad. Malý, chytrý tým
      bez korporátních vrstev. Jak se přihlásit Ozvi se nám. Reagujeme rychle a cokoliv
      rádi upřesníme. Pokud traduješ, napiš nám i to, jak a co obchoduješ – zajímá
      nás to víc než formální CV.'
  metadata:
    site: startupjobs
    url: https://www.startupjobs.cz/nabidka/107507/marketer-pro-prop-trading-paid-ads-creators-ai-fortraders-com
    gold_reason: Marketing role for prop trading ads/creators; explicitly states 'Nehledáme
      ani juniory' (we don't want juniors either), no code touched.
  expected_output: false
  evaluators: []
- name: st-025
  inputs:
    id: st-025
    title: 🏎️ Customer Journey & Growth Officer  🏍️
    text: 'Customer Journey & Growth Lead Chceš pracovat na tom, jak co nejlépe prodat
      vstupenky na Formuli 1 a MotoGP zákazníkům z celého světa – a zároveň postupně
      rozšiřovat celý produkt kolem jejich cesty na závod? V TicketsGP nehledáme klasického
      CMO ani člověka, který bude celý den sedět nad marketingovou strategií. Hledáme
      silného projekťáka s obchodním a marketingovým přesahem , který dokáže vzít
      konkrétní příležitost, rozpracovat ji, spočítat její ekonomiku a dotáhnout ji
      společně s vývojem, marketingem nebo externími partnery až do produkce. Prodáváme
      vstupenky na Formuli 1 a MotoGP zákazníkům z desítek zemí světa. Máme vlastní
      technologickou platformu, vývojový tým, obsah, marketingová data a silnou zákaznickou
      databázi. Teď chceme ještě lépe pracovat s celou customer journey - od prvního
      kontaktu se zákazníkem až po dopravu, ubytování a další služby spojené s jeho
      cestou na závod. Co budeš dělat Tvým hlavním úkolem bude hledat a realizovat
      projekty, které nám pomohou prodávat více, efektivněji a s vyšší hodnotou každé
      objednávky . V praxi budeš například: postupně zlepšovat celou customer journey
      od návštěvy webu až po samotný závod přemýšlet nad tím, jaké informace a nabídky
      má zákazník dostat v jednotlivých fázích nákupu rozvíjet e-mail marketing a
      automatizované mailingové scénáře , které patří mezi naše nejsilnější prodejní
      nástroje hledat příležitosti pro cross-sell a upsell navrhovat a spouštět nové
      produkty, například ubytování, dopravu, parkování, doplňkové služby nebo balíčky
      pro návštěvníky závodů připravit business case nového projektu a spočítat, jestli
      ekonomicky dává smysl koordinovat spuštění nových projektů napříč vývojem, marketingem,
      obchodem a externími dodavateli řídit PPC agenturu a určovat, kde a za jakých
      podmínek má placená reklama smysl vyhodnocovat PNO, ROI, marži, konverze a další
      ekonomiku marketingových aktivit hledat cesty, jak efektivně propagovat jednotlivé
      závody a produkty spolupracovat s vývojáři na úpravách webu, checkoutu a dalších
      částech produktu hledat slabá místa v nákupním procesu a navrhovat jejich řešení
      využívat data a AI k automatizaci a rychlejšímu rozhodování Nebudeš muset všechno
      dělat vlastníma rukama. Bude ale na tobě, aby se správné věci skutečně staly.
      Pokud například zjistíš, že zákazníkům kupujícím MotoGP v Barceloně dává smysl
      nabídnout hotel, bude tvým úkolem zjistit: Jaký produkt nabídnout → kde ho získat
      → jak ho technicky prodávat → kdy ho zákazníkovi nabídnout → jak ho propagovat
      → jaká je jeho ekonomika → a následně celý projekt dotáhnout. Koho hledáme Hledáme
      člověka, který umí kombinovat projektové řízení, marketing a businessové přemýšlení
      . Měl/a bys: umět samostatně převzít projekt a dotáhnout ho od nápadu do produkce
      přemýšlet obchodně a orientovat se v číslech umět prioritizovat projekty podle
      jejich reálného dopadu rozumět základům online marketingu a e-commerce orientovat
      se v PPC a umět posoudit jeho ekonomiku chápat principy CRM, e-mail marketingu
      a marketingové automatizace umět pracovat s vývojáři, agenturami a externími
      dodavateli umět si říct o potřebná data a na jejich základě udělat rozhodnutí
      být schopný/á pracovat samostatně bez přesně nalinkovaného zadání mít přirozenou
      potřebu věci dotahovat Nemusíš být nejlepší PPC specialista, copywriter, analytik
      ani produktový manažer. Potřebujeme ale, abys dokázal/a jednotlivé disciplíny
      propojit a dostat projekt do cíle . Výhodou bude zkušenost s e-commerce travel
      segmentem ticketingem produktovým nebo projektovým managementem CRM a e-mail
      marketingem mezinárodním online businesssem affiliate marketingem prací s vývojovým
      týmem Jak poznáš, že se ti daří Po prvním roce za tebou chceme vidět konkrétní
      výsledky. Například: lépe fungující customer journey vyšší konverzní poměr a
      hodnota objednávky výrazně lépe využitou zákaznickou databázi a mailing efektivnější
      investice do placené reklamy nové automatizované prodejní scénáře několik úspěšně
      spuštěných nových produktů rostoucí podíl zákazníků, kteří si kromě vstupenky
      koupí další službu projekty, které nezůstaly v prezentaci nebo v Trellu, ale
      reálně fungují a vydělávají Co nabízíme možnost pracovat na projektech s okamžitě
      viditelným dopadem na business přímou spolupráci s CEO velkou míru samostatnosti
      vlastní vývojový tým, se kterým můžeš své nápady skutečně realizovat obrovské
      množství dat o zákaznících a jejich nákupním chování moderní AI nástroje minimum
      korporátní byrokracie prostředí, kde je možné dobrý nápad velmi rychle dostat
      do produkce práci na mezinárodním produktu možnost cestovat na závody Formule
      1 a MotoGP flexibilní způsob spolupráce nadstandardní finanční ohodnocení odpovídající
      zkušenostem a dopadu na firmu Proč právě TicketsGP Jsme technologická a ticketingová
      firma, která prodává motorsportové zážitky zákazníkům z celého světa. A postupně
      nechceme prodávat jen vstupenku. Chceme zákazníkovi pomoci vyřešit celou cestu
      na závod - od vstupenky přes ubytování a dopravu až po další služby na místě.
      Proto hledáme člověka, kterého baví objevovat příležitosti, počítat jejich potenciál
      a následně je skutečně realizovat. Méně prezentací. Více spuštěných projektů.
      Pokud tě baví kombinace marketingu, produktu, čísel a projektového řízení, pravděpodobně
      si budeme rozumět.'
